<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Gear Game">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gear Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #111;
            background: linear-gradient(180deg, #f2efe7 0%, #ece7da 100%);
            height: 100vh;
            overflow: hidden;
        }

        .screenCard {
            margin: 0;
            padding: 10px;
            border: 1px solid #b8ad97;
            border-radius: 0;
            text-align: center;
            background: #f9f6ee;
            box-shadow: 0 8px 24px rgba(70, 54, 30, 0.12);
            width: 100%;
            max-width: none;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .startScreen,
        .mainScreen,
        .battleScreen,
        .deathScreen {
            max-width: none;
        }

        #mainView {
            text-align: left;
        }

        .mainHeader {
            margin: 0 0 14px 0;
        }

        .mainFooter {
            margin-top: 14px;
        }

        .battleScreen {
            display: none;
        }

        .deathScreen {
            display: none;
        }

        .deathSummary {
            margin-top: 12px;
            font-size: 16px;
            line-height: 1.4;
            color: #2b2116;
        }

        .gameButton {
            margin-top: 14px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .startButton,
        .inventoryButton {
            background: #2e9e44;
        }

        .startButtons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #adventureButton,
        #backToAdventureButton {
            background: #365ea8;
            color: #fff;
            margin-top: 0;
            margin-bottom: 12px;
        }

        #monasteryButton {
            background: #c76b49;
            color: #fff7ef;
            border-color: #9a4f34;
        }

        #castBlizzardButton {
            background: #7ec8ff;
            color: #083a5f;
            border-color: #4aa7e6;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .box {
            border: 1px solid #ccc;
            padding: 10px;
            width: 100%;
            flex: 1 1 0;
            min-width: 0;
            color: #111;
            box-sizing: border-box;
        }

        .itemName {
            color: #0a5ad8;
            font-weight: bold;
        }

        .goldValue {
            color: #d97706;
            font-weight: bold;
        }

        .enemyLogName {
            color: #d62828;
            font-weight: bold;
        }

        .heroLogName {
            color: #2e9e44;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: block;
            padding: 4px 0;
        }

        .price {
            color: #d97706;
            font-weight: bold;
        }

        #shopList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            text-align: left;
        }

        .shopItemInfo {
            text-align: left;
        }

        .itemStatsSmall {
            font-size: 11px;
            color: #555;
        }

        #inventoryList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        #equipmentList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .warning {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }

        .battlePanels {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 12px 0;
            color: #111;
        }

        .battlePanel {
            flex: 1;
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            font-size: 13px;
            color: #111;
        }

        .battlePanel.heroPanel {
            background-color: #f2fff2;
        }

        .battlePanel.enemyPanel {
            background-color: #fff2f2;
        }

        .inventorySection {
            margin-top: 10px;
        }

        .equipmentSection {
            margin-top: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
        }

        .slotLabel {
            font-size: 12px;
            color: #666;
        }

        .battleGrid {
            display: grid;
            grid-template-columns: repeat(20, clamp(18px, 2.65vh, 24px));
            gap: 2px;
            justify-content: center;
            margin-top: 6px;
        }

        .battleCell {
            width: clamp(18px, 2.65vh, 24px);
            height: clamp(18px, 2.65vh, 24px);
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f3f3;
            font-size: 10px;
        }

        .battleCell.hero {
            background-color: #c8f7c5;
        }

        .battleCell.enemy {
            background-color: #f7c5c5;
        }

        .battleCell.shop {
            background-color: #7aaaff;
            color: #003366;
            font-weight: bold;
        }

        .battleCell.monastery {
            background-color: #c76b49;
            color: #fff7ef;
            font-weight: bold;
        }

        .battleCell.blizzardPreview {
            background-color: #b87bff !important;
            color: #fff !important;
            box-shadow: inset 0 0 0 2px #6f2dc9;
        }

        .battleCell.druidHouse {
            background-color: #a36e2f;
            color: #fff;
            font-weight: bold;
        }

        .battleCell.treasure {
            background-color: #f0d95e;
            color: #333;
            font-weight: bold;
        }

        .battleCell.tree {
            background-color: #1b5e20;
            color: #d6f5d6;
            font-weight: bold;
        }

        .battleCell.woodBlock {
            background-color: #8b5a2b;
            color: #fff3e0;
            font-weight: bold;
        }

        .battleCell.stoneBlock {
            background-color: #d0d0d0;
            color: #222;
            font-weight: bold;
        }

        .battleCell.cave {
            background-color: #7d7d7d;
            color: #f5f5f5;
            font-weight: bold;
        }

        .battleCell.caveCenter {
            background-color: #111;
            color: #ddd;
            font-weight: bold;
        }

        .caveGrid {
            display: none;
            grid-template-columns: repeat(8, clamp(24px, 3.8vh, 32px));
            gap: 2px;
            justify-content: center;
            margin-top: 6px;
        }

        .caveCell {
            width: clamp(24px, 3.8vh, 32px);
            height: clamp(24px, 3.8vh, 32px);
            border: 1px solid #3d3d3d;
            background: #4a4a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
        }

        .caveCell.hero {
            background: #c8f7c5;
            color: #111;
            font-weight: bold;
        }

        .caveCell.rock {
            background: #111;
            color: #111;
        }

        .mapWithLeftLogs {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
        }

        .leftLogItem {
            height: 24px;
            border-radius: 2px;
            background-color: #6d4c41;
            color: #fff3e0;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .resourceSectionTitle {
            font-size: 11px;
            color: #4f4435;
            text-align: center;
            font-weight: bold;
            margin-top: 4px;
        }

        .leftLogsEmpty {
            font-size: 11px;
            color: #6f675e;
            text-align: center;
            margin-top: 6px;
        }

        .caveViewLayout {
            display: none;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
        }

        .moveButton {
            width: 100%;
            height: 100%;
            border: none;
            background: none;
            font-size: 14px;
            cursor: pointer;
        }

        .attackButton {
            margin-top: 10px;
            padding: 6px 10px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }

        .inventoryButton {
            margin-top: 10px;
            padding: 6px 10px;
            color: white;
            border: none;
            cursor: pointer;
        }

        #shopButton {
            background: #365ea8;
        }

        #treasureButton {
            background: #d97706;
        }

        #druidHouseButton {
            background: #8b5a2b;
        }

        #chopTreeButton {
            background: #1b5e20;
        }

        #buildButton {
            background: #0f9ea8;
        }

        #caveButton {
            background: #111;
            color: #fff;
        }

        #mineButton {
            background: #c9c9c9;
            color: #111;
        }

        #stoneBuildButton {
            background: #d4d4d4;
            color: #111;
        }

        #blowHornButton {
            background: #f3e3be;
            color: #4b3a20;
            border: 1px solid #bda274;
        }

        #freeHealButton {
            margin-top: 10px;
            padding: 6px 10px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }

        .fleeButton {
            margin-top: 10px;
            padding: 6px 10px;
            background-color: #d4b400;
            color: black;
            border: none;
            cursor: pointer;
        }

        .statBox {
            margin: 8px 0;
            font-size: 13px;
        }

        .eventLog {
            margin-top: 12px;
            border-top: 1px solid #ddd;
            padding-top: 8px;
            text-align: left;
            font-size: 12px;
            max-height: none;
            overflow-y: auto;
            min-height: 0;
        }

        .adventureLayout {
            display: flex;
            flex-direction: row;
            gap: 8px;
            margin-top: 6px;
            min-height: 0;
            flex: 1;
        }

        .adventureMain {
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
        }

        .adventureLog,
        .deathLog {
            margin-top: 0;
            max-height: none;
        }

        .deathLayout {
            display: flex;
            flex-direction: row;
            gap: 12px;
            margin-top: 12px;
            text-align: left;
            min-height: 0;
            flex: 1;
        }

        .deathMain {
            min-width: 0;
        }

        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
                align-items: stretch;
            }

            .adventureLayout,
            .deathLayout {
                flex-direction: column;
            }

            .box {
                flex: 1 1 auto;
            }
        }

        .adventureLog,
        .deathLog {
            width: min(30vw, 360px);
            flex: 0 0 min(30vw, 360px);
            border-top: 0;
            border-left: 1px solid #ddd;
            padding-top: 0;
            padding-left: 8px;
            height: 100%;
        }

        #battleScreen > .attackButton,
        #battleScreen > .inventoryButton,
        #battleScreen > .fleeButton,
        #battleScreen > .gameButton {
            margin-top: 6px;
            padding: 6px 10px;
            font-size: 13px;
        }

        #battleScreen {
            display: none;
            text-align: left;
        }

        #battleInfo,
        #battleStats {
            margin-bottom: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="startScreen" class="startScreen screenCard">
        <h1>Welcome</h1>
        <p id="welcomeMessage"></p>
        <p id="welcomeTip"></p>
        <div class="startButtons">
            <button id="startEasyButton" class="startButton gameButton" onclick="startGameFromWelcome('easy')">Easy</button>
            <button id="startNormalButton" class="startButton gameButton" onclick="startGameFromWelcome('normal')">Normal</button>
            <button id="startHardButton" class="startButton gameButton" onclick="startGameFromWelcome('hard')">Hard</button>
        </div>
    </div>

    <div id="mainView" class="screenCard mainScreen" style="display:none;">
        <h1 id="pageTitle" class="mainHeader">Gear Shop</h1>
        <button id="backToAdventureButton" class="gameButton" onclick="returnToAdventure()" style="display:none;">Back to Adventure</button>
        <div class="container">
            <div class="box">
                <h2 id="vendorHeading">Shop</h2>
                <ul id="shopList"></ul>
                <button id="freeHealButton" class="gameButton" onclick="useDruidFreeHeal()" style="display:none;">Free heal (50% HP)</button>
                <div id="warningMessage" class="warning"></div>
            </div>

            <div class="box">
                <h2>Inventory</h2>
                <p>Gold: <span id="goldAmount" class="goldValue"></span></p>
                <p>Mana: <span id="manaAmount"></span></p>
                <div class="equipmentSection">
                    <h3>Equipped</h3>
                    <ul id="equipmentList"></ul>
                </div>
                <div class="inventorySection">
                    <h3>Bag</h3>
                    <ul id="inventoryList"></ul>
                </div>
            </div>
        </div>
        <div class="mainFooter">
            <button id="adventureButton" class="gameButton" onclick="startAdventureMode()" style="display:none;">Start adventure</button>
        </div>
    </div>

    <div id="battleScreen" class="battleScreen screenCard">
        <h2 id="adventureTitle">Adventure</h2>
        <div id="battleInfo"></div>
        <div id="battlePanels" class="battlePanels">
            <div id="heroBattlePanel" class="battlePanel heroPanel"></div>
            <div id="enemyBattlePanel" class="battlePanel enemyPanel"></div>
        </div>
        <div id="battleStats" class="statBox"></div>
        <button id="attackButton" class="attackButton" onclick="heroAttack()" style="display:none;">Fight</button>
        <button id="castFireballButton" class="attackButton" onclick="castFireball()" style="display:none;">Cast Fireball</button>
        <button id="castBlizzardButton" class="attackButton" onclick="castBlizzard()" style="display:none;">Cast Blizzard</button>
        <button id="fleeButton" class="fleeButton" onclick="heroFlee()" style="display:none;">Flee</button>
        <button id="inventoryButton" class="inventoryButton" onclick="openInventory()">Open Inventory</button>
        <button id="drinkPotionQuickButton" class="attackButton" onclick="drinkHealthPotionQuick()" style="display:none;">Drink Health potion</button>
        <button id="shopButton" class="inventoryButton" onclick="enterShop()" style="display:none;">Enter Shop</button>
        <button id="druidHouseButton" class="inventoryButton" onclick="enterDruidHouse()" style="display:none;">Enter Druid House</button>
        <button id="monasteryButton" class="inventoryButton" onclick="enterMonastery()" style="display:none;">Enter Monastery</button>
        <button id="chopTreeButton" class="inventoryButton" onclick="chopTree()" style="display:none;">Chop Logs</button>
        <button id="buildButton" class="inventoryButton" onclick="buildFromLogs()" style="display:none;" disabled>Build</button>
        <button id="stoneBuildButton" class="inventoryButton" onclick="buildFromRocks()" style="display:none;" disabled>Stone Build</button>
        <button id="caveButton" class="inventoryButton" onclick="toggleCave()" style="display:none;">Enter Cave</button>
        <button id="mineButton" class="inventoryButton" onclick="mineRock()" style="display:none;">Mine</button>
        <button id="treasureButton" class="inventoryButton" onclick="openTreasure()" style="display:none;">Open Treasure</button>
        <button id="blowHornButton" class="inventoryButton" onclick="blowHorn()" style="display:none;">Blow Horn</button>
        <div class="adventureLayout">
            <div class="adventureMain">
                <div id="battleGrid" class="battleGrid"></div>
                <div id="caveViewLayout" class="caveViewLayout">
                    <div id="caveGrid" class="caveGrid"></div>
                </div>
            </div>
            <div id="eventLog" class="eventLog adventureLog"></div>
        </div>
    </div>

    <div id="deathScreen" class="deathScreen screenCard">
        <h2>The End</h2>
        <div class="deathLayout">
            <div class="deathMain">
                <div id="deathSummary" class="deathSummary"></div>
                <button id="deathRestartButton" class="startButton gameButton" onclick="restartAfterDeath()">Start a New Game</button>
            </div>
            <div>
                <h3>Battle Log</h3>
                <div id="deathLog" class="eventLog deathLog"></div>
            </div>
        </div>
    </div>

    <script>
        var shopItems = [];
        var druidItems = [];
        var inventory = [];
        var gold = 0;
        var mapSize = 20;
        var caveSize = 8;
        var initialTreeCount = 15;
        var dailyTreeGrowth = 3;
        var startingGold = 0;
        var startingSurvivalEnemyCount = 0;
        var isGameDataLoaded = false;
        var hasHorse = false;
        var horseCount = 0;
        var equippedItems = {
            head: null,
            torso: null,
            mainHand: null,
            offHand: null
        };
        var heroStats = {
            name: '',
            healthPoints: 0,
            currentHealth: 0,
            baseDamage: 0,
            baseArmor: 0
        };
        var heroManaCurrent = 20;
        var heroManaMax = 30;
        var heroStartingMana = 20;
        var spellsCatalog = [];
        var hasFireballSpell = false;
        var hasBlizzardSpell = false;
        var blizzardTargetingActive = false;
        var blizzardPreviewCenter = null;
        var heroPos = { x: 0, y: 0 };
        var shopPos = { x: 0, y: 0 };
        var monasteryPos = { x: mapSize - 1, y: 0 };
        var druidHouseCells = [];
        var treasureCells = [];
        var treeCells = [];
        var logCells = [];
        var woodBlockCells = [];
        var stoneBlockCells = [];
        var caveCells = [];
        var inCave = false;
        var caveHeroPos = { x: 4, y: 7 };
        var caveRockCells = [];
        var caveExitPos = null;
        var caveExitDiscovered = false;
        var caveGeneratedDay = 0;
        var caveEnemies = [];
        var caveEnemyRockKeys = {};
        var caveGoldRockKeys = {};
        var minedRockItems = [];
        var battleActive = false;
        var gameOver = false;
        var enemyTemplates = [];
        var allItems = [];
        var enemies = [];
        var currentEnemy = null;
        var enemyCurrentHealth = 0;
        var turnNumber = 0;
        var eventLog = [];
        var enemiesKilled = 0;
        var goldAcquired = 0;
        var currentDay = 1;
        var druidHealDay = 0;
        var survivalEnemyCount = 0;
        var pendingShopSurvivalAdvance = false;
        var pendingShopEnemyCount = 0;
        var isShopOpen = true;
        var activeVendor = 'shop';
        var heroLevel = 1;
        var heroExperience = 0;
        var heroNextLevelXp = 5;
        var shopItemTargetCount = 10;
        var enemyTurnPending = false;
        var enemyMoveTimeoutId = null;
        var enemyMoveDelayMs = 500;
        var isFreshDataMode = false;
        var currentGameMode = 'normal';
        var hornUsedThisGame = false;
        var hornSummonInProgress = false;
        var riderMarkers = [];
        var caveRiderMarkers = [];
        var heroScaling = {
            baseLevel: 1,
            healthIncreasePerLevel: 1,
            damageIncreasePerLevel: 1,
            armorIncreasePerLevel: 1
        };
        var heroBaseStats = {
            healthPoints: 0,
            baseDamage: 0,
            baseArmor: 0
        };
        var lastKillingEnemy = null;
        var endGameMessages = [
            'You have lived the bright life of a hero, destroyed {x} enemies and hoarded {y} gold.',
            'The world still sings your name; you broke {x} foes and gathered {y} gold in your wake.',
            'A legend was forged this day, as you toppled {x} enemies and saved {y} gold for the future.',
            'Your name is carved into the annals of glory, for you defeated {x} enemies and amassed {y} gold.'
        ];
        var welcomeMessages = [
            'Noble hero, help yourself with this finest selection of items in my shop and save the world.',
            'Brave traveler, choose your gear wisely before stepping into danger.',
            'Champion, steel and courage await you. Prepare and begin your quest.',
            'Defender of the realm, stock your pack and carve your path to glory.',
            'Wanderer, fortune favors the prepared. Arm up and face the wilds.'
        ];
        var tipsMessages = [
            'Kill enemies to level up.',
            'Visit druid house to heal.',
            'Buy armor to survive.'
        ];

        function getSpellByName(spellName) {
            if (!spellName || !Array.isArray(spellsCatalog)) {
                return null;
            }

            for (var i = 0; i < spellsCatalog.length; i++) {
                if (spellsCatalog[i] && spellsCatalog[i].name === spellName) {
                    return spellsCatalog[i];
                }
            }

            return null;
        }

        function isSpellLearned(spellName) {
            if (spellName === 'Fireball') {
                return hasFireballSpell;
            }

            if (spellName === 'Blizzard') {
                return hasBlizzardSpell;
            }

            return false;
        }

        function setSpellLearned(spellName) {
            if (spellName === 'Fireball') {
                hasFireballSpell = true;
            }

            if (spellName === 'Blizzard') {
                hasBlizzardSpell = true;
            }
        }

        function getSpellCastPrice(spellName, fallbackValue) {
            var spell = getSpellByName(spellName);
            if (spell && typeof spell.castPrice === 'number' && spell.castPrice >= 0) {
                return spell.castPrice;
            }
            return fallbackValue;
        }

        function getRandomTipMessage() {
            if (!tipsMessages || tipsMessages.length === 0) {
                return '';
            }
            return tipsMessages[Math.floor(Math.random() * tipsMessages.length)];
        }

        function normalizeGameMode(modeValue) {
            var mode = (modeValue || '').toLowerCase();
            if (mode === 'easy' || mode === 'hard' || mode === 'normal') {
                return mode;
            }
            return 'normal';
        }

        function getModeFromUrl() {
            return normalizeGameMode(new URLSearchParams(window.location.search).get('mode'));
        }

        function setModeInUrl(mode) {
            var params = new URLSearchParams(window.location.search);
            params.set('mode', normalizeGameMode(mode));
            var query = params.toString();
            var nextUrl = window.location.pathname + (query ? '?' + query : '') + window.location.hash;
            window.history.replaceState(null, '', nextUrl);
        }

        function getEnemyDifficultyMultiplier() {
            if (currentGameMode === 'easy') {
                return 0.5;
            }
            if (currentGameMode === 'hard') {
                return 1.25;
            }
            return 1;
        }

        function scaleEnemyStatForDifficulty(statValue, minimum) {
            var baseValue = typeof statValue === 'number' ? statValue : 0;
            var minValue = typeof minimum === 'number' ? minimum : 0;
            return Math.max(minValue, Math.round(baseValue * getEnemyDifficultyMultiplier()));
        }

        function setStartButtonsDisabled(disabled, loadingText) {
            var easyButton = document.getElementById('startEasyButton');
            var normalButton = document.getElementById('startNormalButton');
            var hardButton = document.getElementById('startHardButton');
            var buttons = [easyButton, normalButton, hardButton];

            for (var i = 0; i < buttons.length; i++) {
                if (!buttons[i]) {
                    continue;
                }

                buttons[i].disabled = !!disabled;
                if (disabled && loadingText) {
                    buttons[i].textContent = loadingText;
                } else if (buttons[i] === easyButton) {
                    buttons[i].textContent = 'Easy';
                } else if (buttons[i] === normalButton) {
                    buttons[i].textContent = 'Normal';
                } else if (buttons[i] === hardButton) {
                    buttons[i].textContent = 'Hard';
                }
            }
        }

        function showStartScreen() {
            var welcomeMessage = document.getElementById('welcomeMessage');
            var welcomeTip = document.getElementById('welcomeTip');

            currentGameMode = getModeFromUrl();

            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.getElementById('adventureButton').style.display = 'none';
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('deathScreen').style.display = 'none';

            if (!isGameDataLoaded) {
                setStartButtonsDisabled(true, 'Loading...');
                if (!welcomeMessage.textContent) {
                    welcomeMessage.textContent = 'Loading game data from JSON files...';
                }
                if (welcomeTip) {
                    welcomeTip.textContent = '';
                }
                return;
            }

            setStartButtonsDisabled(false);
            welcomeMessage.textContent = welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
            if (welcomeTip) {
                welcomeTip.textContent = 'Tip: ' + getRandomTipMessage();
            }
        }

        function getSellPrice(item) {
            if (!item || typeof item.price !== 'number') {
                return 0;
            }
            return Math.floor(item.price / 2);
        }

        function isHealthPotionItem(item) {
            return !!(item && item.name === 'Health potion' && item.properties && typeof item.properties.healthPercentsRestores === 'number' && item.properties.healthPercentsRestores > 0);
        }

        function isConsumableItem(item) {
            return !!(item && item.slot === 'consumable');
        }

        function isPermanentConsumableItem(item) {
            if (!isConsumableItem(item) || !item.properties) {
                return false;
            }
            return !!(item.properties.permanentHealthPoints || item.properties.permanentBaseDamage || item.properties.permanentBaseArmor);
        }

        function canUseDruidFreeHealToday() {
            return druidHealDay !== currentDay;
        }

        function getHealthPotionRestoreAmount(item) {
            if (!isHealthPotionItem(item)) {
                return 0;
            }

            return Math.max(1, Math.round(heroStats.healthPoints * (item.properties.healthPercentsRestores / 100)));
        }

        function getFirstHealthPotionIndex() {
            for (var i = 0; i < inventory.length; i++) {
                if (isHealthPotionItem(inventory[i])) {
                    return i;
                }
            }
            return -1;
        }

        function drinkHealthPotionAt(index) {
            if (gameOver) {
                return false;
            }

            if (typeof index !== 'number' || index < 0 || index >= inventory.length) {
                return false;
            }

            var potion = inventory[index];
            if (!isHealthPotionItem(potion)) {
                return false;
            }

            var restoreAmount = getHealthPotionRestoreAmount(potion);
            var oldHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.min(heroStats.healthPoints, heroStats.currentHealth + restoreAmount);
            inventory.splice(index, 1);
            addEvent('Hero drinks Health potion and restores ' + (heroStats.currentHealth - oldHealth) + ' HP (' + oldHealth + ' -> ' + heroStats.currentHealth + ')');
            showInventory();

            if (!isShopOpen) {
                renderBattle();
            }

            return true;
        }

        function drinkHealthPotion(index) {
            drinkHealthPotionAt(index);
        }

        function drinkHealthPotionQuick() {
            var potionIndex = getFirstHealthPotionIndex();
            if (potionIndex === -1) {
                return;
            }
            drinkHealthPotionAt(potionIndex);
        }

        function getNextLevelXp(level) {
            return 5 * Math.pow(2, Math.max(0, level - 1));
        }

        function getExperienceToNextLevel() {
            return Math.max(0, heroNextLevelXp - heroExperience);
        }

        function applyHeroLevelStats(healToFull) {
            var levelDelta = Math.max(1, heroLevel - heroScaling.baseLevel + 1);
            heroStats.healthPoints = getScaledStat(heroBaseStats.healthPoints, heroScaling.healthIncreasePerLevel, levelDelta, 1);
            heroStats.baseDamage = getScaledStat(heroBaseStats.baseDamage, heroScaling.damageIncreasePerLevel, levelDelta, 0);
            heroStats.baseArmor = getScaledStat(heroBaseStats.baseArmor, heroScaling.armorIncreasePerLevel, levelDelta, 0);

            if (healToFull) {
                heroStats.currentHealth = heroStats.healthPoints;
            } else {
                heroStats.currentHealth = Math.min(heroStats.currentHealth, heroStats.healthPoints);
            }
        }

        function resetHeroProgress() {
            heroLevel = Math.max(1, heroScaling.baseLevel);
            heroExperience = 0;
            heroNextLevelXp = getNextLevelXp(heroLevel);
            applyHeroLevelStats(true);
        }

        function applyPermanentHeroBaseStats(healthBonus, damageBonus, armorBonus) {
            var healthDelta = typeof healthBonus === 'number' ? healthBonus : 0;
            var damageDelta = typeof damageBonus === 'number' ? damageBonus : 0;
            var armorDelta = typeof armorBonus === 'number' ? armorBonus : 0;
            var oldMaxHealth = heroStats.healthPoints;
            var oldCurrentHealth = heroStats.currentHealth;

            heroBaseStats.healthPoints = Math.max(1, heroBaseStats.healthPoints + healthDelta);
            heroBaseStats.baseDamage = Math.max(0, heroBaseStats.baseDamage + damageDelta);
            heroBaseStats.baseArmor = Math.max(0, heroBaseStats.baseArmor + armorDelta);
            applyHeroLevelStats(false);

            var gainedMaxHealth = Math.max(0, heroStats.healthPoints - oldMaxHealth);
            heroStats.currentHealth = Math.min(heroStats.healthPoints, oldCurrentHealth + gainedMaxHealth);
        }

        function gainHeroExperience(amount) {
            if (typeof amount !== 'number' || amount <= 0) {
                return;
            }

            heroExperience += amount;
            addEvent('Hero gains ' + amount + ' XP (' + heroExperience + ' total).');

            while (heroExperience >= heroNextLevelXp) {
                heroLevel += 1;
                heroNextLevelXp = getNextLevelXp(heroLevel);
                applyHeroLevelStats(true);
                addEvent('Hero reaches Level ' + heroLevel + ' and is fully healed.');
            }
        }

        function startGameFromWelcome(mode) {
            if (!isGameDataLoaded) {
                return;
            }

            currentGameMode = normalizeGameMode(typeof mode === 'string' ? mode : getModeFromUrl());
            setModeInUrl(currentGameMode);

            var mainView = document.getElementById('mainView');
            var shopBox = mainView.querySelector('.container .box:first-child');
            var inventoryBox = mainView.querySelector('.container .box:last-child');

            resetForNewGame();

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('pageTitle').style.display = 'block';
            document.getElementById('adventureButton').style.display = 'inline-block';
            document.getElementById('backToAdventureButton').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('deathScreen').style.display = 'none';
            mainView.style.display = 'block';

            if (shopBox) {
                shopBox.style.display = 'block';
            }
            if (inventoryBox) {
                inventoryBox.style.display = 'block';
            }

            isShopOpen = true;
            showInventory();
        }

        function showDeathScreen() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('pageTitle').style.display = 'none';
            document.getElementById('adventureButton').style.display = 'none';
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('backToAdventureButton').style.display = 'none';
            var summary = getEndGameMessage();

                summary += ' ' + killerMessage;
            }
            document.getElementById('deathSummary').textContent = summary;
            document.getElementById('deathLog').innerHTML = document.getElementById('eventLog').innerHTML;
            document.getElementById('deathScreen').style.display = 'block';
        }

        function restartAfterDeath() {
            resetForNewGame();
            showStartScreen();
        }

            if (!isGameDataLoaded) {
                loadItems();
                showStartScreen();
                return;
            }

            gold = startingGold;
            heroManaCurrent = heroStartingMana;
            hasFireballSpell = false;

            horseCount = 0;

            equippedItems = {
                head: null,

            };

            druidHouseCells = [];

            treeCells = [];
            logCells = [];
            woodBlockCells = [];
            stoneBlockCells = [];
            caveCells = [];

            shopItems = getRandomShopItems(allItems, shopItemTargetCount);

        function handleHeroDeath(killingEnemy) {
            if (gameOver) {
                return;
            }

            lastKillingEnemy = null;
            if (killingEnemy) {
                lastKillingEnemy = {
                    name: killingEnemy.name,
                    level: killingEnemy.level,
                    equippedWeapon: killingEnemy.equippedWeapon,
                    equippedArmor: killingEnemy.equippedArmor
                };
            }

            addEvent(heroStats.name + ' has fallen in battle');
            blizzardTargetingActive = false;
            blizzardPreviewCenter = null;
            gameOver = true;
            battleActive = false;
            currentEnemy = null;
            enemyCurrentHealth = 0;
            showBattleActions(false);
            showDeathScreen();
        }

        function getKillerMessage() {
            if (!lastKillingEnemy || !lastKillingEnemy.name) {
                return '';
            }

            var level = typeof lastKillingEnemy.level === 'number' ? lastKillingEnemy.level : 1;
            var sentence = 'Your life was ended by level ' + level + ' ' + lastKillingEnemy.name;
            var equipmentParts = [];

            if (lastKillingEnemy.equippedWeapon && lastKillingEnemy.equippedWeapon.name) {
                equipmentParts.push('the ' + lastKillingEnemy.equippedWeapon.name);
            }
            if (lastKillingEnemy.equippedArmor && lastKillingEnemy.equippedArmor.name) {
                equipmentParts.push('the ' + lastKillingEnemy.equippedArmor.name);
            }

            if (equipmentParts.length === 1) {
                sentence += ' with ' + equipmentParts[0];
            } else if (equipmentParts.length === 2) {
                sentence += ' with ' + equipmentParts[0] + ' and ' + equipmentParts[1];
            }

            return sentence + '.';
        }

        function updateHorseState() {
            hasHorse = horseCount > 0;
        }

        function buyItem(index) {
            var sourceItems = activeVendor === 'druid' ? druidItems : shopItems;
            var item = sourceItems[index];
            var warningMessage = document.getElementById('warningMessage');

            if (!item) {
                return;
            }

            if (gold >= item.price) {
                gold = gold - item.price;
                inventory.push({ name: item.name, price: item.price, slot: item.slot, properties: item.properties });

                if (item.name === 'Horse') {
                    horseCount += 1;
                    updateHorseState();
                }

                sourceItems.splice(index, 1);
                warningMessage.textContent = '';
                showShop();
                showInventory();
            } else {
                warningMessage.textContent = 'Not enough money !!!';
            }
        }

        function getItemStatsText(item) {
            var text = '';

            if (item.properties.damage > 0) {
                text += 'Damage ' + item.properties.damage;
            }

            if (item.properties.armor > 0) {
                if (text !== '') {
                    text += ' / ';
                }
                text += 'Armour ' + item.properties.armor;
            }

            if (item.properties.healthPercentsRestores > 0) {
                if (text !== '') {
                    text += ' / ';
                }
                text += 'Restores ' + item.properties.healthPercentsRestores + '% HP';
            }

            if (item.properties.permanentHealthPoints > 0 || item.properties.permanentBaseDamage > 0 || item.properties.permanentBaseArmor > 0) {
                var permanentParts = [];
                if (item.properties.permanentHealthPoints > 0) {
                    permanentParts.push('+' + item.properties.permanentHealthPoints + ' Max HP');
                }
                if (item.properties.permanentBaseDamage > 0) {
                    permanentParts.push('+' + item.properties.permanentBaseDamage + ' Base Damage');
                }
                if (item.properties.permanentBaseArmor > 0) {
                    permanentParts.push('+' + item.properties.permanentBaseArmor + ' Base Armor');
                }
                if (text !== '') {
                    text += ' / ';
                }
                text += 'Permanent: ' + permanentParts.join(', ');
            }

            return text;
        }

        function usePermanentConsumable(index) {
            if (gameOver) {
                return;
            }

            if (typeof index !== 'number' || index < 0 || index >= inventory.length) {
                return;
            }

            var item = inventory[index];
            if (!isPermanentConsumableItem(item)) {
                return;
            }

            var hpBonus = item.properties.permanentHealthPoints || 0;
            var damageBonus = item.properties.permanentBaseDamage || 0;
            var armorBonus = item.properties.permanentBaseArmor || 0;
            applyPermanentHeroBaseStats(hpBonus, damageBonus, armorBonus);
            inventory.splice(index, 1);
            addEvent('Hero uses ' + item.name + ' and gains permanent power.');
            showInventory();

            if (!isShopOpen) {
                renderBattle();
            }
        }

        function useDruidFreeHeal() {
            if (gameOver || activeVendor !== 'druid') {
                return;
            }

            var warningMessage = document.getElementById('warningMessage');
            if (!canUseDruidFreeHealToday()) {
                if (warningMessage) {
                    warningMessage.textContent = 'Free heal already used today. Come back tomorrow.';
                }
                showShop();
                return;
            }

            var healAmount = Math.max(1, Math.round(heroStats.healthPoints * 0.5));
            var oldHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.min(heroStats.healthPoints, heroStats.currentHealth + healAmount);
            var manaRestore = Math.max(1, Math.round(heroManaMax * 0.5));
            var oldMana = heroManaCurrent;
            heroManaCurrent = Math.min(heroManaMax, heroManaCurrent + manaRestore);
            druidHealDay = currentDay;

            if (warningMessage) {
                warningMessage.textContent = '';
            }

            addEvent('Druid grants free healing: +' + (heroStats.currentHealth - oldHealth) + ' HP and +' + (heroManaCurrent - oldMana) + ' mana.');
            showInventory();
            showShop();
        }

        function showShop() {
            var shopList = document.getElementById('shopList');
            var vendorHeading = document.getElementById('vendorHeading');
            var freeHealButton = document.getElementById('freeHealButton');
            shopList.innerHTML = '';

            if (vendorHeading) {
                if (activeVendor === 'druid') {
                    vendorHeading.textContent = 'Druid House';
                } else if (activeVendor === 'monastery') {
                    vendorHeading.textContent = 'Monastery';
                } else {
                    vendorHeading.textContent = 'Shop';
                }
            }

            if (activeVendor === 'monastery') {
                for (var spellIndex = 0; spellIndex < spellsCatalog.length; spellIndex++) {
                    var spell = spellsCatalog[spellIndex];
                    if (!spell || !spell.name) {
                        continue;
                    }

                    var isLearned = isSpellLearned(spell.name);
                    var learnPrice = typeof spell.learningPrice === 'number' ? spell.learningPrice : 0;
                    var canLearn = !isLearned && gold >= learnPrice;
                    var learnButtonText = isLearned ? 'Learned' : (canLearn ? 'Learn (' + learnPrice + 'g)' : 'Need ' + learnPrice + 'g');
                    var spellLi = document.createElement('li');
                    var usageText = spell.canBeUsedOnMap ? 'map and battles' : 'battles only';
                    spellLi.innerHTML = '<span class="shopItemInfo"><span class="itemName">' + spell.name + '</span> <span class="slotLabel">(spell)</span><br><span class="itemStatsSmall">Source: ' + spell.source + '. Damage: ' + spell.damage + '. Cast cost: ' + spell.castPrice + ' mana. Usable in: ' + usageText + '.</span></span><button onclick="learnSpell(\'' + spell.name + '\')"' + (canLearn ? '' : ' disabled') + '>' + learnButtonText + '</button>';
                    shopList.appendChild(spellLi);
                }
            } else {
                var sourceItems = activeVendor === 'druid' ? druidItems : shopItems;

                for (var i = 0; i < sourceItems.length; i++) {
                    var item = sourceItems[i];
                    var li = document.createElement('li');
                    li.innerHTML = '<span class="shopItemInfo"><span class="itemName">' + item.name + '</span> <span class="slotLabel">(' + item.slot + ')</span><br><span class="itemStatsSmall">' + getItemStatsText(item) + '</span></span><span class="price goldValue">' + item.price + '</span><button onclick="buyItem(' + i + ')">Buy</button>';
                    shopList.appendChild(li);
                }
            }

            if (freeHealButton) {
                if (activeVendor === 'druid') {
                    var canFreeHeal = canUseDruidFreeHealToday();
                    freeHealButton.style.display = 'inline-block';
                    freeHealButton.disabled = !canFreeHeal;
                    freeHealButton.textContent = canFreeHeal ? 'Free heal (50% HP)' : 'Free heal used today';
                } else {
                    freeHealButton.style.display = 'none';
                }
            }
        }

        function sellItem(index) {
            if (!isShopOpen) {
                return;
            }

            var item = inventory[index];

            if (item) {
                if (item.name === 'Horse') {
                    horseCount = Math.max(0, horseCount - 1);
                    updateHorseState();
                }

                gold = gold + getSellPrice(item);
                inventory.splice(index, 1);
                showInventory();
            }
        }

        function unequipItem(slotKey) {
            var item = equippedItems[slotKey];

            if (!item) {
                return;
            }

            if (slotKey === 'mainHand' && equippedItems.mainHand && equippedItems.offHand && equippedItems.mainHand === equippedItems.offHand) {
                inventory.push(equippedItems.mainHand);
                equippedItems.mainHand = null;
                equippedItems.offHand = null;
                showInventory();
                return;
            }

            if (slotKey === 'offHand' && equippedItems.mainHand && equippedItems.offHand && equippedItems.mainHand === equippedItems.offHand) {
                inventory.push(equippedItems.offHand);
                equippedItems.mainHand = null;
                equippedItems.offHand = null;
                showInventory();
                return;
            }

            equippedItems[slotKey] = null;
            inventory.push(item);
            showInventory();
        }

        function equipItem(index) {
            var item = inventory[index];

            if (!item) {
                return;
            }

            if (item.slot === 'main hand/off-hand') {
                if (equippedItems.mainHand === null && equippedItems.offHand === null) {
                    equippedItems.mainHand = item;
                    equippedItems.offHand = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'main hand') {
                if (equippedItems.mainHand === null) {
                    equippedItems.mainHand = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'off-hand') {
                if (equippedItems.offHand === null) {
                    equippedItems.offHand = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'head') {
                if (equippedItems.head === null) {
                    equippedItems.head = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'torso') {
                if (equippedItems.torso === null) {
                    equippedItems.torso = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            }
        }

        function showInventory() {
            var inventoryList = document.getElementById('inventoryList');
            var equipmentList = document.getElementById('equipmentList');
            inventoryList.innerHTML = '';
            equipmentList.innerHTML = '';

            var slotNames = [
                { key: 'head', label: 'Head' },
                { key: 'torso', label: 'Torso' },
                { key: 'mainHand', label: 'Main Hand' },
                { key: 'offHand', label: 'Off Hand' }
            ];

            for (var s = 0; s < slotNames.length; s++) {
                var slot = slotNames[s];
                var slotItem = equippedItems[slot.key === 'mainHand' ? 'mainHand' : slot.key === 'offHand' ? 'offHand' : slot.key];
                var slotLi = document.createElement('li');
                var slotKey = slot.key === 'mainHand' ? 'mainHand' : slot.key === 'offHand' ? 'offHand' : slot.key;
                if (slotItem) {
                    slotLi.innerHTML = '<span><strong>' + slot.label + ':</strong> <span class="itemName">' + slotItem.name + '</span> (' + getItemStatsText(slotItem) + ')</span><button onclick="unequipItem(\'' + slotKey + '\')">Unequip</button>';
                } else {
                    slotLi.innerHTML = '<span><strong>' + slot.label + ':</strong> Empty</span><span></span>';
                }
                equipmentList.appendChild(slotLi);
            }

            for (var i = 0; i < inventory.length; i++) {
                var item = inventory[i];
                var li = document.createElement('li');
                var sellPrice = getSellPrice(item);
                var sellButtonHtml = isShopOpen ? '<button onclick="sellItem(' + i + ')">Sell for ' + sellPrice + '</button>' : '<button disabled>Sell for ' + sellPrice + '</button>';
                var actionButtonHtml = '';
                if (isHealthPotionItem(item)) {
                    actionButtonHtml = '<button onclick="drinkHealthPotion(' + i + ')">Drink to restore ' + getHealthPotionRestoreAmount(item) + ' HP</button>';
                } else if (isPermanentConsumableItem(item)) {
                    actionButtonHtml = '<button onclick="usePermanentConsumable(' + i + ')">Use</button>';
                } else {
                    actionButtonHtml = '<button onclick="equipItem(' + i + ')">Equip</button>';
                }
                li.innerHTML = '<span><span class="itemName">' + item.name + '</span> <span class="slotLabel">(' + item.slot + ')</span><br>' + getItemStatsText(item) + '</span>' + actionButtonHtml + sellButtonHtml;
                inventoryList.appendChild(li);
            }

            document.getElementById('goldAmount').textContent = gold;
            var manaAmount = document.getElementById('manaAmount');
            if (manaAmount) {
                manaAmount.textContent = heroManaCurrent + '/' + heroManaMax;
            }
        }

        function getRandomCell() {
            return {
                x: Math.floor(Math.random() * mapSize),
                y: Math.floor(Math.random() * mapSize)
            };
        }

        function addRandomTrees(count, blockedCells) {
            var blocked = blockedCells || [];

            for (var treeIndex = 0; treeIndex < count; treeIndex++) {
                var treePos = getRandomCell();
                var treeBlocked = false;

                while (!treeBlocked) {
                    treeBlocked = true;
                    for (var c = 0; c < blocked.length; c++) {
                        if (blocked[c].x === treePos.x && blocked[c].y === treePos.y) {
                            treePos = getRandomCell();
                            treeBlocked = false;
                            break;
                        }
                    }
                }

                treeCells.push(treePos);
                blocked.push(treePos);
            }
        }

        function getDailyCaveCells() {
            return [
                { x: 0, y: mapSize - 3 },
                { x: 1, y: mapSize - 3 },
                { x: 2, y: mapSize - 3 },
                { x: 0, y: mapSize - 2 },
                { x: 1, y: mapSize - 2, isCenter: true },
                { x: 2, y: mapSize - 2 },
                { x: 0, y: mapSize - 1 },
                { x: 1, y: mapSize - 1 },
                { x: 2, y: mapSize - 1 }
            ];
        }

        function getEnemyDisplayLetter(enemy) {
            if (!enemy || !enemy.name) {
                return 'E';
            }

                if (pos.x >= 3 && pos.y <= maxIndex - 3) cells.push({ x: pos.x - 3, y: pos.y + 3, arrow: '↙↙↙' });
                if (pos.x <= maxIndex - 3 && pos.y <= maxIndex - 3) cells.push({ x: pos.x + 3, y: pos.y + 3, arrow: '↘↘↘' });
            }

            return cells;
        }

        function buildRiderMarkersFromEnemies(enemyList, isCaveMap) {
            var markers = [];
            var occupied = {};
            var offsets = [
                { x: 1, y: 0 },
                { x: -1, y: 0 },
                { x: 0, y: -1 },
                { x: 0, y: 1 },
                { x: 1, y: -1 },
                { x: -1, y: -1 },
                { x: 1, y: 1 },
                { x: -1, y: 1 }
            ];
            var maxSize = isCaveMap ? caveSize : mapSize;

            for (var i = 0; i < enemyList.length; i++) {
                var enemy = enemyList[i];
                if (!enemy || !enemy.alive || !enemy.pos) {
                    continue;
                }

                for (var o = 0; o < offsets.length; o++) {
                    var candidate = {
                        x: enemy.pos.x + offsets[o].x,
                        y: enemy.pos.y + offsets[o].y
                    };

                    if (candidate.x < 0 || candidate.y < 0 || candidate.x >= maxSize || candidate.y >= maxSize) {
                        continue;
                    }

                    var key = candidate.x + '_' + candidate.y;
                    if (occupied[key]) {
                        continue;
                    }

                    occupied[key] = true;
                    markers.push(candidate);
                    break;
                }
            }

            return markers;
        }

        function blowHorn() {
            if (gameOver || hornUsedThisGame || hornSummonInProgress || !hasEquippedHorn()) {
                return;

            var totalAliveEnemies = getAliveEnemyCount() + getAliveCaveEnemyCount();
            if (totalAliveEnemies === 0) {
                addEvent('No enemies answer the horn call.');
                renderBattle();
                return;
            }

            if (enemyMoveTimeoutId) {
                clearTimeout(enemyMoveTimeoutId);
                enemyMoveTimeoutId = null;
            }
            enemyTurnPending = false;

            hornUsedThisGame = true;
            hornSummonInProgress = true;
            battleActive = false;
            currentEnemy = null;
            enemyCurrentHealth = 0;
            riderMarkers = buildRiderMarkersFromEnemies(enemies, false);
            caveRiderMarkers = buildRiderMarkersFromEnemies(caveEnemies, true);
            addEvent('The horn thunders across the land. Riders charge toward every enemy!');
            showBattleActions(false);
            renderBattle();

            setTimeout(function() {
                var vanquishedCount = 0;
                for (var i = 0; i < enemies.length; i++) {
                    if (enemies[i] && enemies[i].alive) {
                        enemies[i].alive = false;
                        vanquishedCount += 1;
                    }
                }

                for (var j = 0; j < caveEnemies.length; j++) {
                    if (caveEnemies[j] && caveEnemies[j].alive) {
                        caveEnemies[j].alive = false;
                        vanquishedCount += 1;
                    }
                }

                battleActive = false;
                currentEnemy = null;
                enemyCurrentHealth = 0;
                riderMarkers = [];
                caveRiderMarkers = [];
                hornSummonInProgress = false;
                addEvent('The riders vanish after vanquishing ' + vanquishedCount + ' enemies.');
                showBattleActions(false);
                renderBattle();
            }, 700);
        }

        function generateCaveRocks() {
            caveRockCells = [];
            caveExitPos = null;
            caveExitDiscovered = false;
            caveGeneratedDay = currentDay;
            caveEnemies = [];
            caveEnemyRockKeys = {};
            caveGoldRockKeys = {};
            var blockedCells = [caveHeroPos];

            for (var rockIndex = 0; rockIndex < 16; rockIndex++) {
                var rockPos = {
                    x: Math.floor(Math.random() * caveSize),
                    y: Math.floor(Math.random() * caveSize)
                };
                var blocked = true;

                while (blocked) {
                    blocked = false;
                    for (var i = 0; i < blockedCells.length; i++) {
                        if (blockedCells[i].x === rockPos.x && blockedCells[i].y === rockPos.y) {
                            rockPos = {
                                x: Math.floor(Math.random() * caveSize),
                                y: Math.floor(Math.random() * caveSize)
                            };
                            blocked = true;
                            break;
                        }
                    }
                }

                caveRockCells.push(rockPos);
                blockedCells.push(rockPos);
            }

            if (caveRockCells.length > 0) {
                var exitRock = caveRockCells[Math.floor(Math.random() * caveRockCells.length)];
                caveExitPos = { x: exitRock.x, y: exitRock.y };
            }

            var caveEnemyAssigned = false;
            var goldAssigned = false;
            var hasCaveEnemyTemplate = enemyTemplates.some(function(enemyTemplate) {
                return shouldSpawnInCave(enemyTemplate);
            });
            for (var rockOutcomeIndex = 0; rockOutcomeIndex < caveRockCells.length; rockOutcomeIndex++) {
                var rockKey = caveRockCells[rockOutcomeIndex].x + '_' + caveRockCells[rockOutcomeIndex].y;
                if (hasCaveEnemyTemplate && Math.random() < 0.25) {
                    caveEnemyRockKeys[rockKey] = true;
                    caveEnemyAssigned = true;
                }
                if (Math.random() < 0.25) {
                    caveGoldRockKeys[rockKey] = true;
                    goldAssigned = true;
                }
            }

            if (hasCaveEnemyTemplate && !caveEnemyAssigned && caveRockCells.length > 0) {
                var forcedCaveEnemyRock = caveRockCells[Math.floor(Math.random() * caveRockCells.length)];
                caveEnemyRockKeys[forcedCaveEnemyRock.x + '_' + forcedCaveEnemyRock.y] = true;
            }
            if (!goldAssigned && caveRockCells.length > 0) {
                var forcedGoldRock = caveRockCells[Math.floor(Math.random() * caveRockCells.length)];
                caveGoldRockKeys[forcedGoldRock.x + '_' + forcedGoldRock.y] = true;
            }
        }

        function isCaveRockCell(pos) {
            for (var i = 0; i < caveRockCells.length; i++) {
                var rock = caveRockCells[i];
                if (rock.x === pos.x && rock.y === pos.y) {
                    return true;
                }
            }
            return false;
        }

        function getCaveEnemyAt(pos) {
            for (var i = 0; i < caveEnemies.length; i++) {
                var caveEnemy = caveEnemies[i];
                if (caveEnemy && caveEnemy.alive && caveEnemy.pos.x === pos.x && caveEnemy.pos.y === pos.y) {
                    return caveEnemy;
                }
            }
            return null;
        }

        function getNearbyCaveEnemy(pos) {
            for (var i = 0; i < caveEnemies.length; i++) {
                var caveEnemy = caveEnemies[i];
                if (caveEnemy && caveEnemy.alive && isWithinOneCell(pos, caveEnemy.pos)) {
                    return caveEnemy;
                }
            }
            return null;
        }

        function getAdjacentCaveRockCell(pos) {
            for (var i = 0; i < caveRockCells.length; i++) {
                if (isWithinOneCell(pos, caveRockCells[i]) && !isSameCell(pos, caveRockCells[i])) {
                    return caveRockCells[i];
                }
            }
            return null;
        }

        function isCaveExitCell(pos) {
            return !!(caveExitDiscovered && caveExitPos && pos && caveExitPos.x === pos.x && caveExitPos.y === pos.y);
        }

        function getRandomCaveEnemyTemplate() {
            var caveTemplates = enemyTemplates.filter(function(enemyTemplate) {
                return shouldSpawnInCave(enemyTemplate);
            });

            if (caveTemplates.length === 0) {
                return null;
            }

            return caveTemplates[Math.floor(Math.random() * caveTemplates.length)];
        }

        function createCaveEnemyEncounter(template) {
            if (!template) {
                return null;
            }

            var enemyLevel = getEnemyLevelForCurrentDay(template);
            var healthIncreasePerLevel = typeof template.healthIncreasePerLevel === 'number' ? template.healthIncreasePerLevel : 1;
            var damageIncreasePerLevel = typeof template.damageIncreasePerLevel === 'number' ? template.damageIncreasePerLevel : 1;
            var armorIncreasePerLevel = typeof template.armorIncreasePerLevel === 'number' ? template.armorIncreasePerLevel : 1;

            var caveEnemy = {
                name: template.name,
                behaviour: template.behaviour,
                level: enemyLevel,
                healthPoints: scaleEnemyStatForDifficulty(getScaledStat(template.healthPoints, healthIncreasePerLevel, enemyLevel, 1), 1),
                baseDamage: scaleEnemyStatForDifficulty(getScaledStat(typeof template.baseDamage === 'number' ? template.baseDamage : 5, damageIncreasePerLevel, enemyLevel, 0), 0),
                baseArmor: scaleEnemyStatForDifficulty(getScaledStat(typeof template.baseArmor === 'number' ? template.baseArmor : 0, armorIncreasePerLevel, enemyLevel, 0), 0),
                weaponEfficiency: typeof template.weaponEfficiency === 'number' ? template.weaponEfficiency : 1,
                armorEfficiency: typeof template.armorEfficiency === 'number' ? template.armorEfficiency : 1,
                dropsGold: getEnemyGoldDrop(template, enemyLevel),
                alive: true,
                equippedWeapon: null,
                equippedArmor: null
            };
            return caveEnemy;
        }

        function spawnCaveEnemyAt(pos) {
            if (!pos) {
                return false;
            }

            if (getCaveEnemyAt(pos)) {
                return false;
            }

            var template = getRandomCaveEnemyTemplate();
            if (!template) {
                return false;
            }

            var caveEnemy = createCaveEnemyEncounter(template);
            caveEnemy.pos = { x: pos.x, y: pos.y };
            caveEnemies.push(caveEnemy);
            addEvent('A ' + getEnemyDisplayName(caveEnemy) + ' rises from the shattered rock!');
            return true;
        }

        function renderCaveGrid() {
            var caveGrid = document.getElementById('caveGrid');
            if (!caveGrid) {
                return;
            }

            caveGrid.innerHTML = '';

            for (var y = 0; y < caveSize; y++) {
                for (var x = 0; x < caveSize; x++) {
                    var cell = document.createElement('div');
                    cell.className = 'caveCell';

                    if (x === caveHeroPos.x && y === caveHeroPos.y) {
                        cell.textContent = 'H';
                        cell.classList.add('hero');
                    } else if (getCaveEnemyAt({ x: x, y: y })) {
                        cell.textContent = 'S';
                        cell.style.background = '#8b1a1a';
                        cell.style.color = '#fff';
                    } else if (isCaveRiderMarkerCell({ x: x, y: y })) {
                        cell.textContent = 'R';
                        cell.style.background = '#f3e3be';
                        cell.style.color = '#4b3a20';
                        cell.style.fontWeight = 'bold';
                    } else if (isCaveExitCell({ x: x, y: y })) {
                        cell.textContent = 'E';
                    } else if (isCaveRockCell({ x: x, y: y })) {
                        cell.classList.add('rock');
                    } else {
                        var adjacent = getAdjacentCaveCells(caveHeroPos);
                        for (var i = 0; i < adjacent.length; i++) {
                            if (adjacent[i].x === x && adjacent[i].y === y) {
                                cell.innerHTML = '<button class="moveButton" onclick="moveHeroTo(' + x + ', ' + y + ')">' + adjacent[i].arrow + '</button>';
                                break;
                            }
                        }
                    }

                    caveGrid.appendChild(cell);
                }
            }
        }

        function getAdjacentCaveCells(pos) {
            var cells = [];

            if (pos.x > 0) cells.push({ x: pos.x - 1, y: pos.y, arrow: '←' });
            if (pos.x < caveSize - 1) cells.push({ x: pos.x + 1, y: pos.y, arrow: '→' });
            if (pos.y > 0) cells.push({ x: pos.x, y: pos.y - 1, arrow: '↑' });
            if (pos.y < caveSize - 1) cells.push({ x: pos.x, y: pos.y + 1, arrow: '↓' });
            if (pos.x > 0 && pos.y > 0) cells.push({ x: pos.x - 1, y: pos.y - 1, arrow: '↖' });
            if (pos.x < caveSize - 1 && pos.y > 0) cells.push({ x: pos.x + 1, y: pos.y - 1, arrow: '↗' });
            if (pos.x > 0 && pos.y < caveSize - 1) cells.push({ x: pos.x - 1, y: pos.y + 1, arrow: '↙' });
            if (pos.x < caveSize - 1 && pos.y < caveSize - 1) cells.push({ x: pos.x + 1, y: pos.y + 1, arrow: '↘' });

            return cells;
        }

        function toggleCave() {
            if (gameOver || battleActive) {
                return;
            }

            if (!inCave && !getAdjacentCaveCell(heroPos)) {
                return;
            }

            if (inCave) {
                if (!caveExitDiscovered || !caveExitPos) {
                    addEvent('Hero cannot leave the cave yet. The hidden exit is still buried under rock.');
                    renderBattle();
                    return;
                }

                if (!isWithinOneCell(caveHeroPos, caveExitPos)) {
                    addEvent('Hero must stand near the revealed cave exit to leave.');
                    renderBattle();
                    return;
                }

                inCave = false;
                addEvent('Hero climbs out of the cave through the hidden exit.');
            } else {
                inCave = true;
                caveHeroPos = { x: Math.floor(caveSize / 2), y: caveSize - 1 };
                if (caveGeneratedDay !== currentDay || !caveExitPos) {
                    generateCaveRocks();
                }
                addEvent('Hero descends into the cave. Find the hidden exit beneath the rocks.');
            }
            renderBattle();
        }

        function mineRock() {
            if (gameOver || battleActive || !inCave) {
                return;
            }

            if (!hasEquippedPickaxe()) {
                addEvent('Hero needs an equipped Pickaxe to mine rocks.');
                renderBattle();
                return;
            }

            var nearbyRock = getAdjacentCaveRockCell(caveHeroPos);
            if (!nearbyRock) {
                addEvent('No rock is close enough to mine.');
                renderBattle();
                return;
            }

            caveRockCells = caveRockCells.filter(function(rock) {
                return !(rock.x === nearbyRock.x && rock.y === nearbyRock.y);
            });
            minedRockItems.push({ id: Date.now() + '_' + Math.floor(Math.random() * 100000) });
            addEvent('Hero mines a rock in the cave.');
            var minedRockKey = nearbyRock.x + '_' + nearbyRock.y;

            if (caveExitPos && nearbyRock.x === caveExitPos.x && nearbyRock.y === caveExitPos.y) {
                caveExitDiscovered = true;
                addEvent('A hidden cave exit is revealed beneath the broken rock!');
            } else if (caveRockCells.length === 0 && caveExitPos && !caveExitDiscovered) {
                caveExitDiscovered = true;
                caveExitPos = { x: caveHeroPos.x, y: caveHeroPos.y };
                addEvent('With the final rock gone, a hidden cave exit is revealed in the chamber!');
            }

            if (caveGoldRockKeys[minedRockKey]) {
                var caveGold = heroLevel * 2;
                gold += caveGold;
                goldAcquired += caveGold;
                addEvent('Hero finds ' + caveGold + ' gold beneath the rock.');
                delete caveGoldRockKeys[minedRockKey];
            }

            if (caveEnemyRockKeys[minedRockKey]) {
                delete caveEnemyRockKeys[minedRockKey];
                spawnCaveEnemyAt(nearbyRock);
            }

            renderBattle();
            if (!battleActive && inCave && !gameOver) {
                scheduleEnemyMoveAfterHeroTurn();
            }
        }

        function scheduleEnemyMoveAfterHeroTurn() {
            if (enemyTurnPending || battleActive || gameOver) {
                return;
            }

            enemyTurnPending = true;
            if (enemyMoveTimeoutId) {
                clearTimeout(enemyMoveTimeoutId);
            }

            enemyMoveTimeoutId = setTimeout(function() {
                enemyTurnPending = false;
                enemyMoveTimeoutId = null;

                if (gameOver || battleActive) {
                    renderBattle();
                    return;
                }

                if (inCave) {
                    if (moveCaveEnemies()) {
                        return;
                    }
                    renderBattle();
                    return;
                }

                if (moveEnemies()) {
                    return;
                }

                renderBattle();
            }, enemyMoveDelayMs);
        }

            showBattleMap(true);
            renderLeftLogs();
        }

        function chopTree() {
            if (gameOver || battleActive) {

                addEvent('Hero needs an equipped Axe to chop trees.');

        function buildFromLogs() {

        function buildFromRocks() {

                addEvent('A stone block is already built here.');
                refreshExplorationUi();
                return;
            }

            if (isWoodBlockCell(heroPos)) {

                refreshExplorationUi();

            minedRockItems.pop();

        function visitTreasure(pos) {
            var treasure = getTreasureAt(pos);
            if (!treasure) {
                return;
            }

            var treasureGold = Math.max(0, typeof treasure.gold === 'number' ? treasure.gold : 0);
            if (treasureGold > 0) {
                gold += treasureGold;
                goldAcquired += treasureGold;
            }

            var lootedItems = Array.isArray(treasure.items) ? treasure.items : [];
            for (var i = 0; i < lootedItems.length; i++) {

            }

            addEvent('Hero opens treasure and gains ' + treasureGold + 'g and ' + lootedItems.length + ' item(s).');
