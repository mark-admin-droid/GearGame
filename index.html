        function getAdjacentCaveCells(pos) {
            var cells = [];

            if (pos.x > 0) cells.push({ x: pos.x - 1, y: pos.y, arrow: '←' });
            if (pos.x < caveSize - 1) cells.push({ x: pos.x + 1, y: pos.y, arrow: '→' });
            if (pos.y > 0) cells.push({ x: pos.x, y: pos.y - 1, arrow: '↑' });
            if (pos.y < caveSize - 1) cells.push({ x: pos.x, y: pos.y + 1, arrow: '↓' });
            if (pos.x > 0 && pos.y > 0) cells.push({ x: pos.x - 1, y: pos.y - 1, arrow: '↖' });
            if (pos.x < caveSize - 1 && pos.y > 0) cells.push({ x: pos.x + 1, y: pos.y - 1, arrow: '↗' });
            if (pos.x > 0 && pos.y < caveSize - 1) cells.push({ x: pos.x - 1, y: pos.y + 1, arrow: '↙' });
            if (pos.x < caveSize - 1 && pos.y < caveSize - 1) cells.push({ x: pos.x + 1, y: pos.y + 1, arrow: '↘' });

            return cells;
        }

        function toggleCave() {
            if (gameOver || battleActive) {
                return;
            }

            if (!inCave && !getAdjacentCaveCell(heroPos)) {
                return;
            }

            if (inCave) {
                if (!caveExitDiscovered || !caveExitPos) {
                    addEvent('Hero cannot leave the cave yet. The hidden exit is still buried under rock.');
                    renderBattle();
                    return;
                }

                if (!isWithinOneCell(caveHeroPos, caveExitPos)) {
                    addEvent('Hero must stand near the revealed cave exit to leave.');
                    renderBattle();
                    return;
                }

                inCave = false;
                addEvent('Hero climbs out of the cave through the hidden exit.');
            } else {
                inCave = true;
                caveHeroPos = { x: Math.floor(caveSize / 2), y: caveSize - 1 };
                if (caveGeneratedDay !== currentDay || !caveExitPos) {
                    generateCaveRocks();
                }
                addEvent('Hero descends into the cave. Find the hidden exit beneath the rocks.');
            }
            renderBattle();
        }

        function mineRock() {
            if (gameOver || battleActive || !inCave) {
                return;
            }

            if (!hasEquippedPickaxe()) {
                addEvent('Hero needs an equipped Pickaxe to mine rocks.');
                renderBattle();
                return;
            }

            var nearbyRock = getAdjacentCaveRockCell(caveHeroPos);
            if (!nearbyRock) {
                addEvent('No rock is close enough to mine.');
                renderBattle();
                return;
            }

            caveRockCells = caveRockCells.filter(function(rock) {
                return !(rock.x === nearbyRock.x && rock.y === nearbyRock.y);
            });
            minedRockItems.push({ id: Date.now() + '_' + Math.floor(Math.random() * 100000) });
            addEvent('Hero mines a rock in the cave.');
            var minedRockKey = nearbyRock.x + '_' + nearbyRock.y;

            if (caveExitPos && nearbyRock.x === caveExitPos.x && nearbyRock.y === caveExitPos.y) {
                caveExitDiscovered = true;
                addEvent('A hidden cave exit is revealed beneath the broken rock!');
            } else if (caveRockCells.length === 0 && caveExitPos && !caveExitDiscovered) {
                caveExitDiscovered = true;
                caveExitPos = { x: caveHeroPos.x, y: caveHeroPos.y };
                addEvent('With the final rock gone, a hidden cave exit is revealed in the chamber!');
            }

            if (caveGoldRockKeys[minedRockKey]) {
                var caveGold = heroLevel * 2;
                gold += caveGold;
                goldAcquired += caveGold;
                addEvent('Hero finds ' + caveGold + ' gold beneath the rock.');
                delete caveGoldRockKeys[minedRockKey];
            }

            if (caveSkeletonRockKeys[minedRockKey]) {
                delete caveSkeletonRockKeys[minedRockKey];
                spawnCaveSkeletonAt(nearbyRock);
            }

            renderBattle();
        }

        function scheduleEnemyMoveAfterHeroTurn() {
            if (enemyTurnPending || inCave || battleActive || gameOver) {
                return;
            }

            enemyTurnPending = true;
            if (enemyMoveTimeoutId) {
                clearTimeout(enemyMoveTimeoutId);
            }

            enemyMoveTimeoutId = setTimeout(function() {
                enemyTurnPending = false;
                enemyMoveTimeoutId = null;

                if (gameOver || battleActive || inCave) {
                    renderBattle();
                    return;
                }

                if (moveEnemies()) {
                    return;
                }

                renderBattle();
            }, enemyMoveDelayMs);
        }

        function refreshExplorationUi() {
            var battleScreen = document.getElementById('battleScreen');
            var battleInfo = document.getElementById('battleInfo');
            var attackButton = document.getElementById('attackButton');
            var fleeButton = document.getElementById('fleeButton');
            var shopButton = document.getElementById('shopButton');
            var druidHouseButton = document.getElementById('druidHouseButton');
            var chopTreeButton = document.getElementById('chopTreeButton');
            var buildButton = document.getElementById('buildButton');
            var caveButton = document.getElementById('caveButton');
            var mineButton = document.getElementById('mineButton');
            var treasureButton = document.getElementById('treasureButton');
            var drinkPotionQuickButton = document.getElementById('drinkPotionQuickButton');
            var leftLogsPanel = document.getElementById('leftLogsPanel');
            var nearbyEnemy = getNearbyEnemy(heroPos);
            var onShop = isWithinOneCell(heroPos, shopPos);
            var onDruidHouse = !!getAdjacentDruidHouseCell(heroPos) && !gameOver;
            var onTreeWithAxe = !!getAdjacentTreeCell(heroPos) && hasEquippedAxe() && !gameOver;
            var onCave = !!getAdjacentCaveCell(heroPos) && !gameOver;
            var canUseDruid = canUseDruidHouseToday();
            var onTreasure = !!getNearbyTreasure(heroPos) && !gameOver;

            if (battleScreen) {
                battleScreen.style.display = 'block';
            }

            attackButton.style.display = nearbyEnemy ? 'inline-block' : 'none';
            if (nearbyEnemy) {
                attackButton.textContent = 'Fight';
            }
            fleeButton.style.display = 'none';
            shopButton.style.display = onShop ? 'inline-block' : 'none';
            druidHouseButton.style.display = onDruidHouse && canUseDruid ? 'inline-block' : 'none';
            chopTreeButton.style.display = onTreeWithAxe ? 'inline-block' : 'none';
            buildButton.style.display = logCells && logCells.length > 0 ? 'inline-block' : 'none';
            buildButton.disabled = !logCells || logCells.length === 0;
            caveButton.style.display = onCave || inCave ? 'inline-block' : 'none';
            caveButton.textContent = inCave ? 'Leave Cave' : 'Enter Cave';
            mineButton.style.display = 'none';
            treasureButton.style.display = onTreasure ? 'inline-block' : 'none';
            drinkPotionQuickButton.style.display = getFirstHealthPotionIndex() !== -1 ? 'inline-block' : 'none';

            if (leftLogsPanel) {
                leftLogsPanel.style.display = 'flex';
            }

            if (nearbyEnemy) {
                battleInfo.textContent = 'Enemy is nearby!';
            } else if (onShop) {
                battleInfo.textContent = 'You are at the shop. Enter to browse gear.';
            } else if (onDruidHouse) {
                battleInfo.textContent = canUseDruid ? 'The druid house is right next to you. Enter to restore 50% of max HP.' : 'The druid house already healed you today. Return tomorrow.';
            } else if (onTreeWithAxe) {
                battleInfo.textContent = 'A tree is next to you. Use Chop Tree with your axe.';
            } else if (onCave) {
                battleInfo.textContent = 'A cave is next to you. Enter to explore it.';
            } else if (onTreasure) {
                battleInfo.textContent = 'You found treasure. Open it to claim your reward.';
            } else {
                battleInfo.textContent = 'Choose a move with an arrow.';
            }

            showBattleMap(true);
            renderLeftLogs();
        }

        function chopTree() {
            if (gameOver || battleActive) {
                return;
            }

            if (!hasEquippedAxe()) {
                addEvent('Hero needs an equipped Axe to chop trees.');
                renderBattle();
                return;
            }

            var nearbyTree = getAdjacentTreeCell(heroPos);
            if (!nearbyTree) {
                addEvent('No tree is close enough to chop.');
                renderBattle();
                return;
            }

            treeCells = treeCells.filter(function(tree) {
                return !(tree.x === nearbyTree.x && tree.y === nearbyTree.y);
            });

            addEvent('Hero chops down a tree with the axe.');
            spawnLogOnLeftSide();
            renderBattle();
        }

        function buildFromLogs() {
            if (gameOver || battleActive) {
                return;
            }

            if (!logCells || logCells.length === 0) {
                addEvent('You need at least one chopped log to build.');
                refreshExplorationUi();
                return;
            }

            if (isWoodBlockCell(heroPos)) {
                addEvent('A wooden block is already built here.');
                refreshExplorationUi();
                return;
            }

            logCells.pop();
            woodBlockCells.push({ x: heroPos.x, y: heroPos.y });
            addEvent('Hero builds a wooden block using one chopped log.');
            refreshExplorationUi();
        }

        function buildFromRocks() {
            if (gameOver || battleActive || inCave) {
                return;
            }

            if (!minedRockItems || minedRockItems.length === 0) {
                addEvent('You need at least one mined rock to build a stone block.');
                refreshExplorationUi();
                return;
            }

            if (isStoneBlockCell(heroPos)) {
                addEvent('A stone block is already built here.');
                refreshExplorationUi();
                return;
            }

            if (isWoodBlockCell(heroPos)) {
                addEvent('A wooden block is already built here.');
                refreshExplorationUi();
                return;
            }

            minedRockItems.pop();
            stoneBlockCells.push({ x: heroPos.x, y: heroPos.y });
            addEvent('Hero builds a stone block using one mined rock.');
            refreshExplorationUi();
        }

        function canUseDruidHouseToday() {
            return druidHealDay !== currentDay;
        }

        function visitDruidHouse() {
            if (!canUseDruidHouseToday()) {
                addEvent('The druid house is closed to you for today. Return tomorrow.');
                renderBattle();
                return false;
            }

            addEvent('Hero enters the druid house and is touched by green energy.');
            var healAmount = Math.max(1, Math.round(heroStats.healthPoints * 0.5));
            var oldHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.min(heroStats.healthPoints, heroStats.currentHealth + healAmount);
            druidHealDay = currentDay;
            addEvent('Druid heals hero for ' + (heroStats.currentHealth - oldHealth) + ' HP (' + oldHealth + ' -> ' + heroStats.currentHealth + ')');
            renderBattle();
            return true;
        }

        function enterDruidHouse() {
            if (gameOver || battleActive) {
                return;
            }

            var nearbyDruidHouse = getAdjacentDruidHouseCell(heroPos);
            if (!nearbyDruidHouse) {
                return;
            }

            visitDruidHouse();
        }

        function visitTreasure(pos) {
            var treasure = getTreasureAt(pos);
            if (!treasure) {
                return;
            }
            gold += treasure.gold;
            goldAcquired += treasure.gold;
            addEvent('Hero finds treasure and gains ' + treasure.gold + 'g (gold now ' + gold + ')');
            treasureCells = treasureCells.filter(function(t) { return t !== treasure; });
            renderBattle();
        }

        function getArrowForDirection(fromPos, toPos) {
            if (toPos.x < fromPos.x && toPos.y === fromPos.y) return '←';
            if (toPos.x > fromPos.x && toPos.y === fromPos.y) return '→';
            if (toPos.x === fromPos.x && toPos.y < fromPos.y) return '↑';
            if (toPos.x === fromPos.x && toPos.y > fromPos.y) return '↓';
            if (toPos.x < fromPos.x && toPos.y < fromPos.y) return '↖';
            if (toPos.x > fromPos.x && toPos.y < fromPos.y) return '↗';
            if (toPos.x < fromPos.x && toPos.y > fromPos.y) return '↙';
            return '↘';
        }

        function formatEventMessage(message) {
            var formatted = message;

            function escapeRegex(text) {
                return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            if (enemyTemplates && enemyTemplates.length > 0) {
                for (var i = 0; i < enemyTemplates.length; i++) {
                    var enemyName = enemyTemplates[i].name;
                    if (enemyName && formatted.indexOf(enemyName) !== -1) {
                        formatted = formatted.replace(new RegExp('\\b' + escapeRegex(enemyName) + '\\b', 'g'), '<span class="enemyLogName">' + enemyName + '</span>');
                    }
                }
            }

            if (heroStats && heroStats.name && formatted.indexOf(heroStats.name) !== -1) {
                formatted = formatted.replace(new RegExp('\\b' + escapeRegex(heroStats.name) + '\\b', 'g'), '<span class="heroLogName">' + heroStats.name + '</span>');
            }

            if (allItems && allItems.length > 0) {
                for (var j = 0; j < allItems.length; j++) {
                    var itemName = allItems[j].name;
                    if (itemName && formatted.indexOf(itemName) !== -1) {
                        formatted = formatted.replace(new RegExp('\\b' + escapeRegex(itemName) + '\\b', 'g'), '<span class="itemName">' + itemName + '</span>');
                    }
                }
            }

            formatted = formatted.replace(/(gold(?: now)?\s+)(\d+)/gi, '$1<span class="goldValue">$2</span>');
            formatted = formatted.replace(/(\d+)(?=\s*g\b)/gi, '<span class="goldValue">$1</span>');
            formatted = formatted.replace(/(\d+)(?=\s+gold\b)/gi, '<span class="goldValue">$1</span>');
            formatted = formatted.replace(/(\d+)(?=\s+coins?\b)/gi, '<span class="goldValue">$1</span>');

            return formatted;
        }

        function addEvent(message) {
            eventLog.unshift(message);
            var eventLogBox = document.getElementById('eventLog');
            eventLogBox.innerHTML = '';

            for (var i = 0; i < eventLog.length; i++) {
                var line = document.createElement('div');
                line.innerHTML = formatEventMessage(eventLog[i]);
                eventLogBox.appendChild(line);
            }
        }

        function getDirectionName(fromPos, toPos) {
            if (toPos.x < fromPos.x && toPos.y === fromPos.y) return 'west';
            if (toPos.x > fromPos.x && toPos.y === fromPos.y) return 'east';
            if (toPos.x === fromPos.x && toPos.y < fromPos.y) return 'north';
            if (toPos.x === fromPos.x && toPos.y > fromPos.y) return 'south';
            if (toPos.x < fromPos.x && toPos.y < fromPos.y) return 'northwest';
            if (toPos.x > fromPos.x && toPos.y < fromPos.y) return 'northeast';
            if (toPos.x < fromPos.x && toPos.y > fromPos.y) return 'southwest';
            return 'southeast';
        }

        function getHeroDamage() {
            var damage = typeof heroStats.baseDamage === 'number' ? heroStats.baseDamage : 3;
            var equippedSlots = [equippedItems.mainHand, equippedItems.offHand];
            var countedItems = [];

            for (var i = 0; i < equippedSlots.length; i++) {
                var item = equippedSlots[i];
                if (item && countedItems.indexOf(item) !== -1) {
                    continue;
                }
                if (item && item.properties && item.properties.damage) {
                    damage += item.properties.damage;
                }
                if (item) {
                    countedItems.push(item);
                }
            }

            return damage;
        }

        function getHeroArmor() {
            var armor = typeof heroStats.baseArmor === 'number' ? heroStats.baseArmor : 0;
            var equippedSlots = [equippedItems.head, equippedItems.torso, equippedItems.mainHand, equippedItems.offHand];
            var countedItems = [];

            for (var i = 0; i < equippedSlots.length; i++) {
                var item = equippedSlots[i];
                if (item && countedItems.indexOf(item) !== -1) {
                    continue;
                }
                if (item && item.properties && item.properties.armor) {
                    armor += item.properties.armor;
                }
                if (item) {
                    countedItems.push(item);
                }
            }

            return armor;
        }

        function getEnemyDamage(enemy) {
            var baseDamage = 5;

            if (!enemy) {
                return baseDamage;
            }

            if (typeof enemy.baseDamage === 'number') {
                baseDamage = enemy.baseDamage;
            }

            if (enemy.equippedWeapon && enemy.equippedWeapon.properties && enemy.equippedWeapon.properties.damage) {
                baseDamage = baseDamage + enemy.equippedWeapon.properties.damage;
            }

            return baseDamage;
        }

        function getEnemyArmor(enemy) {
            var armor = 0;

            if (enemy && typeof enemy.baseArmor === 'number') {
                armor += enemy.baseArmor;
            }

            if (enemy && enemy.equippedArmor && enemy.equippedArmor.properties && enemy.equippedArmor.properties.armor) {
                armor += enemy.equippedArmor.properties.armor;
            }

            return armor;
        }

        function showBattleActions(show) {
            var attackButton = document.getElementById('attackButton');
            var fleeButton = document.getElementById('fleeButton');
            attackButton.style.display = show ? 'inline-block' : 'none';
            fleeButton.style.display = show ? 'inline-block' : 'none';
        }

        function enterShop() {
            if (gameOver) {
                return;
            }
            if (isWithinOneCell(heroPos, shopPos)) {
                if (getAliveEnemyCount() === 0) {
                    pendingShopSurvivalAdvance = true;
                    pendingShopEnemyCount = survivalEnemyCount;
                    addEvent('The road is clear. The shop feels like a brief calm before the next wave.');
                }
                addEvent('Hero enters the shop.');
                showShopView();
            }
        }

        function openTreasure() {
            if (gameOver) {
                return;
            }
            var nearbyTreasure = getNearbyTreasure(heroPos);
            if (nearbyTreasure) {
                visitTreasure(nearbyTreasure.pos);
            }
        }

        function heroAttack() {
            if (gameOver) {
                return;
            }

            if (!battleActive) {
                var nearbyEnemy = inCave ? getNearbyCaveEnemy(caveHeroPos) : getNearbyEnemy(heroPos);
                if (nearbyEnemy) {
                    startClash(nearbyEnemy);
                }
                return;
            }

            if (!currentEnemy) {
                return;
            }

            var heroAttackPower = getHeroDamage();
            var enemyArmor = getEnemyArmor(currentEnemy);
            var heroDamage = Math.max(0, heroAttackPower - enemyArmor);
            var oldEnemyHealth = enemyCurrentHealth;
            enemyCurrentHealth = Math.max(0, enemyCurrentHealth - heroDamage);
            addEvent('Hero attacks for ' + heroDamage + ' damage (' + getEnemyDisplayName(currentEnemy) + ' armor ' + enemyArmor + ' reduces ' + heroAttackPower + ' to ' + heroDamage + ', HP ' + oldEnemyHealth + ' -> ' + enemyCurrentHealth + ')');

            if (enemyCurrentHealth <= 0) {
                addEvent(getEnemyDisplayName(currentEnemy) + ' is defeated!');

                var xpReward = Math.max(1, typeof currentEnemy.level === 'number' ? currentEnemy.level : 1);
                gainHeroExperience(xpReward);

                var reward = typeof currentEnemy.dropsGold === 'number' ? currentEnemy.dropsGold : 0;

                if (reward > 0) {
                    gold += reward;
                    goldAcquired += reward;
                    addEvent('Hero gains ' + reward + ' coins for defeating ' + getEnemyDisplayName(currentEnemy) + ' (gold ' + (gold - reward) + ' -> ' + gold + ')');
                } else {
                    addEvent(getEnemyDisplayName(currentEnemy) + ' drops no coins.');
                }

                var droppedItems = [];
                if (currentEnemy.equippedWeapon) {
                    droppedItems.push(currentEnemy.equippedWeapon);
                }
                if (currentEnemy.equippedArmor) {
                    droppedItems.push(currentEnemy.equippedArmor);
                }

                for (var d = 0; d < droppedItems.length; d++) {
                    var lootItem = droppedItems[d];
                    inventory.push({ name: lootItem.name, price: lootItem.price, slot: lootItem.slot, properties: lootItem.properties });
                    if (lootItem.name === 'Horse') {
                        horseCount += 1;
                        updateHorseState();
                    }
                    addEvent('Hero loots ' + lootItem.name + ' from ' + getEnemyDisplayName(currentEnemy) + ' and adds it to the inventory');
                }

                enemiesKilled += 1;
                currentEnemy.alive = false;
                battleActive = false;
                currentEnemy = null;
                enemyCurrentHealth = 0;
                showBattleActions(false);
                showInventory();
                renderBattle();
                return;
            }

            var enemyAttackPower = getEnemyDamage(currentEnemy);
            var heroArmor = getHeroArmor();
            var enemyDamage = Math.max(0, enemyAttackPower - heroArmor);
            var oldHeroHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.max(0, heroStats.currentHealth - enemyDamage);
            if (enemyDamage === 0) {
                addEvent(getEnemyDisplayName(currentEnemy) + ' attacks but ' + heroStats.name + "'s armor deflects all damage (HP " + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');
            } else {
                addEvent(getEnemyDisplayName(currentEnemy) + ' attacks for ' + enemyDamage + ' damage (' + heroStats.name + ' armor ' + heroArmor + ' reduces ' + enemyAttackPower + ' to ' + enemyDamage + ', HP ' + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');
            }

            if (heroStats.currentHealth <= 0) {
                handleHeroDeath(currentEnemy);
                return;
            }

            renderBattle();
        }

        function heroFlee() {
            if (gameOver || !battleActive) {
                return;
            }

            addEvent('Hero flees from ' + getEnemyDisplayName(currentEnemy) + '!');
            battleActive = false;
            currentEnemy = null;
            enemyCurrentHealth = 0;
            showBattleActions(false);
            renderBattle();
        }

        function moveHeroTo(x, y) {
            if (gameOver || battleActive || enemyTurnPending) {
                return;
            }

            if (inCave) {
                if (isCaveRockCell({ x: x, y: y })) {
                    addEvent('Hero cannot move into a rock.');
                    renderBattle();
                    return;
                }
                caveHeroPos = { x: x, y: y };
                var caveEnemyOnTile = getCaveEnemyAt(caveHeroPos);
                if (caveEnemyOnTile) {
                    startClash(caveEnemyOnTile);
                    return;
                }
                renderBattle();
                return;
            }

            if (isTreeCell({ x: x, y: y })) {
                if (hasEquippedAxe()) {
                    treeCells = treeCells.filter(function(tree) {
                        return !(tree.x === x && tree.y === y);
                    });
                    addEvent('Turn ' + (turnNumber + 1) + '. Hero chops down a tree with the axe.');
                    spawnLogOnLeftSide();
                    renderBattle();
                    return;
                }
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into a tree.');
                renderBattle();
                return;
            }

            if (isWoodBlockCell({ x: x, y: y })) {
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into a wooden block.');
                renderBattle();
                return;
            }

            if (isStoneBlockCell({ x: x, y: y })) {
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into a stone block.');
                renderBattle();
                return;
            }

            if (isCaveCell({ x: x, y: y })) {
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into the cave.');
                renderBattle();
                return;
            }

            var oldPos = { x: heroPos.x, y: heroPos.y };
            heroPos = { x: x, y: y };
            turnNumber = turnNumber + 1;
            addEvent('Turn ' + turnNumber + '. Hero moved ' + getDirectionName(oldPos, heroPos));

            var enemyOnTile = getEnemyAt(heroPos);
            if (enemyOnTile) {
                currentEnemy = enemyOnTile;
                enemyCurrentHealth = enemyOnTile.healthPoints;
                battleActive = true;
                addEvent('Turn ' + turnNumber + '. Clash has begun against ' + getEnemyDisplayName(enemyOnTile));
            } else if (isSameCell(heroPos, shopPos)) {
                addEvent('Turn ' + turnNumber + '. Hero reached the shop. Use Enter Shop to browse gear.');
            } else if (isDruidHouseCell(heroPos)) {
                addEvent('Turn ' + turnNumber + '. Hero reaches the druid house');
                visitDruidHouse();
                return;
            } else {
                var treasure = getTreasureAt(heroPos);
                if (treasure) {
                    addEvent('Turn ' + turnNumber + '. Hero discovers treasure. Open it to claim the gold.');
                    renderBattle();
                    return;
                }
            }

            renderBattle();
            if (!battleActive && !inCave && !gameOver) {
                scheduleEnemyMoveAfterHeroTurn();
            }
        }

        function startClash(enemy) {
            if (gameOver) {
                return;
            }

            var enemyToBattle = enemy || (inCave ? getCaveEnemyAt(caveHeroPos) || getNearbyCaveEnemy(caveHeroPos) : getEnemyAt(heroPos) || getNearbyEnemy(heroPos));
            if (!enemyToBattle) {
                return;
            }

            if (enemyMoveTimeoutId) {
                clearTimeout(enemyMoveTimeoutId);
                enemyMoveTimeoutId = null;
            }
            enemyTurnPending = false;

            currentEnemy = enemyToBattle;
            enemyCurrentHealth = enemyToBattle.healthPoints;
            battleActive = true;
            addEvent('Turn ' + turnNumber + '. Clash has begun against ' + getEnemyDisplayName(enemyToBattle));
            showBattleActions(true);
            renderBattle();
        }

        function showBattleMap(show) {
            var battleGrid = document.getElementById('battleGrid');
            if (show) {
                battleGrid.style.display = 'grid';
            } else {
                battleGrid.style.display = 'none';
            }
        }

        function renderBattle() {
            var battleGrid = document.getElementById('battleGrid');
            var caveGrid = document.getElementById('caveGrid');
            var mapWithLeftLogs = document.querySelector('.mapWithLeftLogs');
            var battleInfo = document.getElementById('battleInfo');
            var battleStats = document.getElementById('battleStats');
            var heroBattlePanel = document.getElementById('heroBattlePanel');
            var enemyBattlePanel = document.getElementById('enemyBattlePanel');
            var leftLogsPanel = document.getElementById('leftLogsPanel');
            battleGrid.innerHTML = '';

            var nearbyEnemy = getNearbyEnemy(heroPos);
            var nearbyCaveEnemy = inCave ? getNearbyCaveEnemy(caveHeroPos) : null;
            var enemyOnTile = getEnemyAt(heroPos);

            for (var y = 0; y < mapSize; y++) {
                for (var x = 0; x < mapSize; x++) {
                    var cell = document.createElement('div');
                    cell.className = 'battleCell';

                    if (x === heroPos.x && y === heroPos.y) {
                        cell.textContent = 'H';
                        cell.classList.add('hero');
                                    } else if (x === shopPos.x && y === shopPos.y) {
                        cell.textContent = 'S';
                        cell.classList.add('shop');
                    } else if (isDruidHouseCell({ x: x, y: y })) {
                        cell.textContent = 'DH';
                        cell.classList.add('druidHouse');
                    } else if (getTreasureAt({ x: x, y: y })) {
                        cell.textContent = 'T';
                        cell.classList.add('treasure');
                    } else if (isTreeCell({ x: x, y: y })) {
                        cell.textContent = 'TR';
                        cell.classList.add('tree');
                    } else if (isWoodBlockCell({ x: x, y: y })) {
                        cell.textContent = 'WB';
                        cell.classList.add('woodBlock');
                    } else if (isStoneBlockCell({ x: x, y: y })) {
                        cell.textContent = 'SB';
                        cell.classList.add('stoneBlock');
                    } else if (getCaveCell({ x: x, y: y })) {
                        var caveCell = getCaveCell({ x: x, y: y });
                        cell.textContent = '';
                        cell.classList.add(caveCell.isCenter ? 'caveCenter' : 'cave');
                    } else {
                        var enemyAtCell = getEnemyAt({ x: x, y: y });
                        if (enemyAtCell) {
                            cell.textContent = getEnemyDisplayLetter(enemyAtCell);
                            cell.classList.add('enemy');
                            cell.style.backgroundColor = getEnemyMapColor(enemyAtCell.level);
                            cell.style.color = getEnemyMapTextColor(enemyAtCell.level);
                        } else {
                            var adjacent = getAdjacentCells(heroPos);
                            var moved = false;

                            for (var i = 0; i < adjacent.length; i++) {
                                if (adjacent[i].x === x && adjacent[i].y === y) {
                                    cell.innerHTML = '<button class="moveButton" onclick="moveHeroTo(' + x + ', ' + y + ')">' + adjacent[i].arrow + '</button>';
                                    moved = true;
                                    break;
                                }
                            }

                            if (!moved) {
                                cell.textContent = '';
                            }
                        }
                    }

                    battleGrid.appendChild(cell);
                }
            }

            renderLeftLogs();
            renderCaveGrid();
            renderCaveResources();

            heroBattlePanel.innerHTML = '<strong>' + heroStats.name + '</strong><br>Level ' + heroLevel + '<br>Experience to the next level ' + getExperienceToNextLevel() + '<br>HP ' + heroStats.currentHealth + '/' + heroStats.healthPoints + '<br>Damage ' + getHeroDamage() + '<br>Armor ' + getHeroArmor();

            if (battleActive && currentEnemy) {
                enemyBattlePanel.style.display = 'block';
                enemyBattlePanel.innerHTML = '<strong>' + getEnemyDisplayName(currentEnemy) + '</strong><br>HP ' + enemyCurrentHealth + '/' + currentEnemy.healthPoints + '<br>Damage ' + getEnemyDamage(currentEnemy) + '<br>Armor ' + getEnemyArmor(currentEnemy);
                battleStats.innerHTML = '<strong>Enemy:</strong> ' + getEnemyDisplayName(currentEnemy) + ' HP ' + enemyCurrentHealth + '/' + currentEnemy.healthPoints;
            } else {
                enemyBattlePanel.style.display = 'none';
                enemyBattlePanel.innerHTML = '';
                battleStats.innerHTML = '';
            }

            var attackButton = document.getElementById('attackButton');
            var fleeButton = document.getElementById('fleeButton');
            var shopButton = document.getElementById('shopButton');
            var druidHouseButton = document.getElementById('druidHouseButton');
            var chopTreeButton = document.getElementById('chopTreeButton');
            var buildButton = document.getElementById('buildButton');
            var stoneBuildButton = document.getElementById('stoneBuildButton');
            var caveButton = document.getElementById('caveButton');
            var mineButton = document.getElementById('mineButton');
            var treasureButton = document.getElementById('treasureButton');
            var drinkPotionQuickButton = document.getElementById('drinkPotionQuickButton');
            var onShop = isWithinOneCell(heroPos, shopPos);
            var onDruidHouse = !!getAdjacentDruidHouseCell(heroPos) && !battleActive && !gameOver;
            var onTreeWithAxe = !!getAdjacentTreeCell(heroPos) && hasEquippedAxe() && !battleActive && !gameOver;
            var onCave = !!getAdjacentCaveCell(heroPos) && !battleActive && !gameOver;
            var onCaveRock = !!getAdjacentCaveRockCell(caveHeroPos) && hasEquippedPickaxe() && inCave && !battleActive && !gameOver;
            var canUseDruid = canUseDruidHouseToday();
            var onTreasure = !!getNearbyTreasure(heroPos) && !battleActive && !gameOver;

            if (gameOver) {
                battleInfo.textContent = '';
                attackButton.style.display = 'none';
                fleeButton.style.display = 'none';
                shopButton.style.display = 'none';
                druidHouseButton.style.display = 'none';
                chopTreeButton.style.display = 'none';
                buildButton.style.display = 'none';
                stoneBuildButton.style.display = 'none';
                caveButton.style.display = 'none';
                mineButton.style.display = 'none';
                treasureButton.style.display = 'none';
                drinkPotionQuickButton.style.display = 'none';
                if (leftLogsPanel) {
                    leftLogsPanel.style.display = 'none';
                }
                if (mapWithLeftLogs) {
                    mapWithLeftLogs.style.display = 'flex';
                }
                if (caveGrid) {
                    caveGrid.style.display = 'none';
                }
                showBattleMap(false);
            } else if (battleActive) {
                battleInfo.textContent = 'Battle begins!';
                attackButton.style.display = 'inline-block';
                attackButton.textContent = 'Attack';
                fleeButton.style.display = 'inline-block';
                shopButton.style.display = 'none';
                druidHouseButton.style.display = 'none';
                chopTreeButton.style.display = 'none';
                buildButton.style.display = 'none';
                stoneBuildButton.style.display = 'none';
                caveButton.style.display = 'none';
                mineButton.style.display = 'none';
                treasureButton.style.display = 'none';
                drinkPotionQuickButton.style.display = getFirstHealthPotionIndex() !== -1 ? 'inline-block' : 'none';
                if (leftLogsPanel) {
                    leftLogsPanel.style.display = 'none';
                }
                if (mapWithLeftLogs) {
                    mapWithLeftLogs.style.display = 'flex';
                }
                if (caveGrid) {
                    caveGrid.style.display = 'none';
                }
                showBattleMap(false);
            } else {
                shopButton.style.display = onShop ? 'inline-block' : 'none';
                druidHouseButton.style.display = onDruidHouse && canUseDruid ? 'inline-block' : 'none';
                chopTreeButton.style.display = onTreeWithAxe ? 'inline-block' : 'none';
                buildButton.style.display = logCells && logCells.length > 0 ? 'inline-block' : 'none';
                buildButton.disabled = !logCells || logCells.length === 0;
                stoneBuildButton.style.display = inCave ? 'none' : (minedRockItems && minedRockItems.length > 0 ? 'inline-block' : 'none');
                stoneBuildButton.disabled = !minedRockItems || minedRockItems.length === 0;
                caveButton.style.display = onCave || inCave ? 'inline-block' : 'none';
                caveButton.textContent = inCave ? 'Leave Cave' : 'Enter Cave';
                mineButton.style.display = onCaveRock ? 'inline-block' : 'none';
                treasureButton.style.display = onTreasure ? 'inline-block' : 'none';
                drinkPotionQuickButton.style.display = getFirstHealthPotionIndex() !== -1 ? 'inline-block' : 'none';
                if (leftLogsPanel) {
                    leftLogsPanel.style.display = 'flex';
                }

                if (inCave) {
                    if (mapWithLeftLogs) {
                        mapWithLeftLogs.style.display = 'none';
                    }
                    if (caveGrid) {
                        caveGrid.style.display = 'grid';
                    }
                    var caveViewLayout = document.getElementById('caveViewLayout');
                    if (caveViewLayout) {
                        caveViewLayout.style.display = 'flex';
                    }
                    if (leftLogsPanel) {
                        leftLogsPanel.style.display = 'none';
                    }
                    if (isCaveExitCell(caveHeroPos)) {
                        battleInfo.textContent = 'The hidden exit is beneath your feet. Use Leave Cave to escape.';
                    } else if (caveExitDiscovered) {
                        battleInfo.textContent = 'The hidden exit has been revealed. Find the E tile to leave the cave.';
                    } else if (nearbyCaveEnemy) {
                        battleInfo.textContent = 'A cave skeleton is nearby. Fight or move away.';
                    } else {
                        battleInfo.textContent = onCaveRock ? 'A rock is next to you. Mine it.' : hasEquippedPickaxe() ? 'Inside the cave. Break rocks to uncover the hidden exit.' : 'Inside the cave. Equip a Pickaxe to mine rocks and uncover the hidden exit.';
                    }
                    attackButton.style.display = nearbyCaveEnemy ? 'inline-block' : 'none';
                    if (nearbyCaveEnemy) {
                        attackButton.textContent = 'Fight';
                    }
                    fleeButton.style.display = 'none';
                    shopButton.style.display = 'none';
                    druidHouseButton.style.display = 'none';
                    chopTreeButton.style.display = 'none';
                    buildButton.style.display = 'none';
                    stoneBuildButton.style.display = 'none';
                    treasureButton.style.display = 'none';
                    drinkPotionQuickButton.style.display = getFirstHealthPotionIndex() !== -1 ? 'inline-block' : 'none';
                    showBattleMap(false);
                    return;
                }

                if (mapWithLeftLogs) {
                    mapWithLeftLogs.style.display = 'flex';
                }
                if (caveGrid) {
                    caveGrid.style.display = 'none';
                }
                var caveViewLayout = document.getElementById('caveViewLayout');
                if (caveViewLayout) {
                    caveViewLayout.style.display = 'none';
                }

                if (nearbyEnemy) {
                    battleInfo.textContent = 'Enemy is nearby!';
                    attackButton.style.display = 'inline-block';
                    attackButton.textContent = 'Fight';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                } else if (onShop) {
                    battleInfo.textContent = 'You are at the shop. Enter to browse gear.';
                    attackButton.style.display = 'none';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                } else if (onDruidHouse) {
                    battleInfo.textContent = canUseDruid ? 'The druid house is right next to you. Enter to restore 50% of max HP.' : 'The druid house already healed you today. Return tomorrow.';
                    attackButton.style.display = 'none';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                } else if (onTreeWithAxe) {
                    battleInfo.textContent = 'A tree is next to you. Use Chop Tree with your axe.';
                    attackButton.style.display = 'none';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                } else if (onCave) {
                    battleInfo.textContent = 'A cave is next to you. Enter to explore it.';
                    attackButton.style.display = 'none';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                } else if (onTreasure) {
                    battleInfo.textContent = 'You found treasure. Open it to claim your reward.';
                    attackButton.style.display = 'none';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                } else {
                    battleInfo.textContent = 'Choose a move with an arrow.';
                    attackButton.style.display = 'none';
                    fleeButton.style.display = 'none';
                    showBattleMap(true);
                }
            }
        }

        function showShopView() {
            var mainView = document.getElementById('mainView');
            var shopBox = mainView.querySelector('.container .box:first-child');
            var inventoryBox = mainView.querySelector('.container .box:last-child');

            if (shopBox) {
                shopBox.style.display = 'block';
            }
            if (inventoryBox) {
                inventoryBox.style.display = 'block';
            }

            mainView.style.display = 'block';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('deathScreen').style.display = 'none';
            document.getElementById('backToAdventureButton').style.display = 'inline-block';
            isShopOpen = true;
            showInventory();
        }

        function openInventory() {
            var mainView = document.getElementById('mainView');
            var shopBox = mainView.querySelector('.container .box:first-child');
            var inventoryBox = mainView.querySelector('.container .box:last-child');

            if (shopBox) {
                shopBox.style.display = 'none';
            }
            if (inventoryBox) {
                inventoryBox.style.display = 'block';
            }

            mainView.style.display = 'block';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('deathScreen').style.display = 'none';
            document.getElementById('backToAdventureButton').style.display = 'inline-block';
            isShopOpen = false;
            showInventory();
        }

        function returnToAdventure() {
            var mainView = document.getElementById('mainView');
            var shopBox = mainView.querySelector('.container .box:first-child');
            var inventoryBox = mainView.querySelector('.container .box:last-child');

            if (shopBox) {
                shopBox.style.display = 'block';
            }
            if (inventoryBox) {
                inventoryBox.style.display = 'block';
            }

            if (pendingShopSurvivalAdvance && getAliveEnemyCount() === 0) {
                var overnightHeal = Math.max(1, Math.round(heroStats.healthPoints * 0.1));
                var oldHealth = heroStats.currentHealth;
                heroStats.currentHealth = Math.min(heroStats.healthPoints, heroStats.currentHealth + overnightHeal);
                addEvent('Hero stayed overnight in the shop and recovered ' + (heroStats.currentHealth - oldHealth) + ' HP (' + oldHealth + ' -> ' + heroStats.currentHealth + ')');
                advanceSurvivalWave();
            }
            pendingShopSurvivalAdvance = false;
            pendingShopEnemyCount = 0;

            mainView.style.display = 'none';
            document.getElementById('battleScreen').style.display = 'block';
            document.getElementById('deathScreen').style.display = 'none';
            document.getElementById('backToAdventureButton').style.display = 'none';
            isShopOpen = false;
            renderBattle();
        }

        function startAdventureMode() {
            document.getElementById('pageTitle').style.display = 'none';
            document.getElementById('adventureButton').style.display = 'none';
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'block';
            document.getElementById('deathScreen').style.display = 'none';
            isShopOpen = false;

            heroStats.currentHealth = heroStats.healthPoints;
            heroPos = getRandomCell();
            caveCells = getDailyCaveCells();
            inCave = false;
            caveHeroPos = { x: Math.floor(caveSize / 2), y: caveSize - 1 };
            caveExitPos = null;
            caveExitDiscovered = false;
            caveGeneratedDay = 0;
            caveEnemies = [];
            while (isCaveCell(heroPos)) {
                heroPos = getRandomCell();
            }
            enemies = [];
            enemiesKilled = 0;
            goldAcquired = 0;
            currentDay = 1;
            druidHealDay = 0;
            survivalEnemyCount = startingSurvivalEnemyCount;
            pendingShopSurvivalAdvance = false;
            pendingShopEnemyCount = 0;
            updateAdventureTitle();
            var blockedCells = [heroPos].concat(caveCells);

            spawnEnemyWave(survivalEnemyCount);
            for (var i = 0; i < enemies.length; i++) {
                if (enemies[i] && enemies[i].alive) {
                    blockedCells.push(enemies[i].pos);
                }
            }

            var shopCell = getRandomCell();
            var shopBlocked = false;

            while (!shopBlocked) {
                shopBlocked = true;
                for (var c = 0; c < blockedCells.length; c++) {
                    if (blockedCells[c].x === shopCell.x && blockedCells[c].y === shopCell.y) {
                        shopCell = getRandomCell();
                        shopBlocked = false;
                        break;
                    }
                }
            }

            shopPos = shopCell;
            druidHouseCells = [];
            treasureCells = [];
            treeCells = [];
            logCells = [];
            woodBlockCells = [];
            stoneBlockCells = [];
            var houseCell = getRandomCell();
            var houseAdjacent = { x: houseCell.x + 1, y: houseCell.y };
            if (houseAdjacent.x > mapSize - 1 || blockedCells.some(function(c) { return c.x === houseAdjacent.x && c.y === houseAdjacent.y; })) {
                houseAdjacent = { x: houseCell.x, y: houseCell.y + 1 };
            }
            if (houseAdjacent.x <= mapSize - 1 && houseAdjacent.y <= mapSize - 1 && !blockedCells.some(function(c) { return c.x === houseAdjacent.x && c.y === houseAdjacent.y; })) {
                druidHouseCells = [houseCell, houseAdjacent];
            } else {
                // fallback to a second random adjacent cell
                for (var x = -1; x <= 1 && druidHouseCells.length === 0; x++) {
                    for (var y = -1; y <= 1 && druidHouseCells.length === 0; y++) {
                        if (Math.abs(x) + Math.abs(y) === 1) {
                            var candidate = { x: houseCell.x + x, y: houseCell.y + y };
                            if (candidate.x >= 0 && candidate.x < mapSize && candidate.y >= 0 && candidate.y < mapSize && !blockedCells.some(function(c) { return c.x === candidate.x && c.y === candidate.y; })) {
                                druidHouseCells = [houseCell, candidate];
                            }
                        }
                    }
                }
            }

            blockedCells.push(houseCell);
            if (druidHouseCells.length > 1) {
                blockedCells.push(druidHouseCells[1]);
            }

            for (var t = 0; t < 2; t++) {
                var treasurePos = getRandomCell();
                var treasureBlocked = false;
                while (!treasureBlocked) {
                    treasureBlocked = true;
                    for (var c = 0; c < blockedCells.length; c++) {
                        if (blockedCells[c].x === treasurePos.x && blockedCells[c].y === treasurePos.y) {
                            treasurePos = getRandomCell();
                            treasureBlocked = false;
                            break;
                        }
                    }
                }
                treasureCells.push({ pos: treasurePos, gold: 10 + Math.floor(Math.random() * 11) });
                blockedCells.push(treasurePos);
            }

            addRandomTrees(initialTreeCount, blockedCells);

            currentEnemy = null;
            enemyCurrentHealth = 0;
            gameOver = false;
            turnNumber = 0;
            eventLog = [];
            addEvent('Adventure started');
            battleActive = false;
            renderBattle();
        }

        function fetchJsonDynamic(path) {
            var requestPath = path;
            var fetchOptions = {};

            if (isFreshDataMode) {
                requestPath = path + '?t=' + Date.now();
                fetchOptions.cache = 'no-store';
            }

            return fetch(requestPath, fetchOptions).then(function(response) {
                if (!response.ok) {
                    throw new Error(path + ' failed to load (HTTP ' + response.status + ').');
                }
                return response.json();
            });
        }

        function loadItems() {
            isGameDataLoaded = false;
            isFreshDataMode = new URLSearchParams(window.location.search).get('fresh') === '1';
            Promise.all([
                fetchJsonDynamic('items.json'),
                fetchJsonDynamic('enemies.json'),
                fetchJsonDynamic('hero.json'),
                fetchJsonDynamic('tips.json').catch(function() {
                    return [];
                })
            ])
                .then(function(results) {
                    var loadedItems = results[0] || [];
                    var allEnemies = results[1] || [];
                    var heroConfig = results[2] || {};
                    var loadedTips = results[3] || [];

                    if (!Array.isArray(loadedItems) || loadedItems.length === 0) {
                        throw new Error('items.json is empty or invalid.');
                    }
                    if (!Array.isArray(allEnemies) || allEnemies.length === 0) {
                        throw new Error('enemies.json is empty or invalid.');
                    }
                    if (!heroConfig || typeof heroConfig !== 'object') {
                        throw new Error('hero.json is invalid.');
                    }
                    if (typeof heroConfig.name !== 'string' || heroConfig.name.length === 0) {
                        throw new Error('hero.json is missing a valid name.');
                    }
                    if (typeof heroConfig.healthPoints !== 'number' || heroConfig.healthPoints <= 0) {
                        throw new Error('hero.json is missing a valid healthPoints value.');
                    }
                    if (typeof heroConfig.baseDamage !== 'number' || heroConfig.baseDamage < 0) {
                        throw new Error('hero.json is missing a valid baseDamage value.');
                    }
                    if (typeof heroConfig.baseArmor !== 'number' || heroConfig.baseArmor < 0) {
                        throw new Error('hero.json is missing a valid baseArmor value.');
                    }
                    if (typeof heroConfig.startingGold !== 'number' || heroConfig.startingGold < 0) {
                        throw new Error('hero.json is missing a valid startingGold value.');
                    }
                    if (typeof heroConfig.startingSurvivalEnemyCount !== 'number' || heroConfig.startingSurvivalEnemyCount < 1) {
                        throw new Error('hero.json is missing a valid startingSurvivalEnemyCount value.');
                    }

                    allItems = loadedItems;
                    if (Array.isArray(loadedTips) && loadedTips.length > 0) {
                        var normalizedTips = loadedTips.filter(function(tip) {
                            return typeof tip === 'string' && tip.trim().length > 0;
                        }).map(function(tip) {
                            return tip.trim();
                        });
                        if (normalizedTips.length > 0) {
                            tipsMessages = normalizedTips;
                        }
                    }
                    startingGold = heroConfig.startingGold;
                    startingSurvivalEnemyCount = Math.floor(heroConfig.startingSurvivalEnemyCount);
                    survivalEnemyCount = startingSurvivalEnemyCount;

                    shopItems = getRandomShopItems(allItems, 10);
                    shopItemTargetCount = 10;

                    enemyTemplates = allEnemies;
                    heroStats.name = heroConfig.name;
                    heroBaseStats.healthPoints = heroConfig.healthPoints;
                    heroBaseStats.baseDamage = heroConfig.baseDamage;
                    heroBaseStats.baseArmor = heroConfig.baseArmor;
                    heroScaling.baseLevel = typeof heroConfig.baseLevel === 'number' ? Math.max(1, Math.floor(heroConfig.baseLevel)) : 1;
                    heroScaling.healthIncreasePerLevel = typeof heroConfig.healthIncreasePerLevel === 'number' && heroConfig.healthIncreasePerLevel > 0 ? heroConfig.healthIncreasePerLevel : 1;
                    heroScaling.damageIncreasePerLevel = typeof heroConfig.damageIncreasePerLevel === 'number' && heroConfig.damageIncreasePerLevel > 0 ? heroConfig.damageIncreasePerLevel : 1;
                    heroScaling.armorIncreasePerLevel = typeof heroConfig.armorIncreasePerLevel === 'number' && heroConfig.armorIncreasePerLevel > 0 ? heroConfig.armorIncreasePerLevel : 1;
                    resetHeroProgress();

                    gold = startingGold;
                    isGameDataLoaded = true;

                    var startButton = document.getElementById('startButton');
                    var welcomeMessage = document.getElementById('welcomeMessage');
                    var welcomeTip = document.getElementById('welcomeTip');
                    if (startButton) {
                        startButton.disabled = false;
                        startButton.textContent = 'Start';
                    }
                    if (welcomeMessage) {
                        welcomeMessage.textContent = welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
                    }
                    if (welcomeTip) {
                        welcomeTip.textContent = 'Tip: ' + getRandomTipMessage();
                    }

                    showShop();
                    showInventory();
                })
                .catch(function(error) {
                    isGameDataLoaded = false;
                    allItems = [];
                    enemyTemplates = [];
                    shopItems = [];

                    var startButton = document.getElementById('startButton');
                    var welcomeMessage = document.getElementById('welcomeMessage');
                    var welcomeTip = document.getElementById('welcomeTip');
                    var warningMessage = document.getElementById('warningMessage');

                    if (startButton) {
                        startButton.disabled = true;
                        startButton.textContent = 'Start';
                    }
                    if (welcomeMessage) {
                        welcomeMessage.textContent = 'Could not load game data. Check items.json, enemies.json and hero.json.';
                    }
                    if (welcomeTip) {
                        welcomeTip.textContent = '';
                    }
                    if (warningMessage) {
                        warningMessage.textContent = 'Data load error: ' + (error && error.message ? error.message : 'Unknown error');
                    }
                });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function() {
                    // Service worker registration failure should not block gameplay.
                });
            });
        }

        loadItems();
        showStartScreen();

        function handleAdventureKeyboardNavigation(event) {
            if (gameOver || battleActive || enemyTurnPending) {
                return;
            }

            var mainView = document.getElementById('mainView');
            var battleScreen = document.getElementById('battleScreen');
            if (!battleScreen || battleScreen.style.display === 'none') {
                return;
            }
            if (mainView && mainView.style.display !== 'none') {
                return;
            }

            var targetTag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
            if (targetTag === 'input' || targetTag === 'textarea' || targetTag === 'select') {
                return;
            }

            var key = (event.key || '').toLowerCase();
            var deltas = {
                w: { x: 0, y: -1 },
                x: { x: 0, y: 1 },
                a: { x: -1, y: 0 },
                d: { x: 1, y: 0 },
                q: { x: -1, y: -1 },
                e: { x: 1, y: -1 },
                z: { x: -1, y: 1 },
                c: { x: 1, y: 1 }
            };

            if (!deltas[key]) {
                return;
            }

            event.preventDefault();

            var currentPos = inCave ? caveHeroPos : heroPos;
            var maxX = inCave ? caveSize - 1 : mapSize - 1;
            var maxY = inCave ? caveSize - 1 : mapSize - 1;
            var nextX = currentPos.x + deltas[key].x;
            var nextY = currentPos.y + deltas[key].y;

            if (nextX < 0 || nextY < 0 || nextX > maxX || nextY > maxY) {
                return;
            }

            moveHeroTo(nextX, nextY);
        }

        document.addEventListener('keydown', handleAdventureKeyboardNavigation);
    </script>
</body>
