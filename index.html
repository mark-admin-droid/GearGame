<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Gear Game">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gear Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #111;
            background: linear-gradient(180deg, #f2efe7 0%, #ece7da 100%);
        }

        .screenCard {
            margin: 0;
            padding: 12px;
            border: 1px solid #b8ad97;
            border-radius: 0;
            text-align: center;
            background: #f9f6ee;
            box-shadow: 0 8px 24px rgba(70, 54, 30, 0.12);
            width: 100%;
            max-width: none;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .startScreen,
        .mainScreen,
        .battleScreen,
        .deathScreen {
            max-width: none;
        }

        #mainView {
            text-align: left;
        }

        .mainHeader {
            margin: 0 0 14px 0;
        }

        .mainFooter {
            margin-top: 14px;
        }

        .battleScreen {
            display: none;
        }

        .deathScreen {
            display: none;
        }

        .deathSummary {
            margin-top: 12px;
            font-size: 16px;
            line-height: 1.4;
            color: #2b2116;
        }

        .gameButton {
            margin-top: 14px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .startButton,
        .inventoryButton {
            background: #2e9e44;
        }

        #adventureButton,
        #backToAdventureButton {
            background: #365ea8;
            color: #fff;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .box {
            border: 1px solid #ccc;
            padding: 10px;
            width: 100%;
            flex: 1 1 0;
            min-width: 0;
            color: #111;
            box-sizing: border-box;
        }

        .itemName {
            color: #0a5ad8;
            font-weight: bold;
        }

        .goldValue {
            color: #d97706;
            font-weight: bold;
        }

        .enemyLogName {
            color: #d62828;
            font-weight: bold;
        }

        .heroLogName {
            color: #2e9e44;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: block;
            padding: 4px 0;
        }

        .price {
            color: #d97706;
            font-weight: bold;
        }

        #shopList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            text-align: left;
        }

        .shopItemInfo {
            text-align: left;
        }

        .itemStatsSmall {
            font-size: 11px;
            color: #555;
        }

        #inventoryList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        #equipmentList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .warning {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }

        .battlePanels {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 12px 0;
            color: #111;
        }

        .battlePanel {
            flex: 1;
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            font-size: 13px;
            color: #111;
        }

        .battlePanel.heroPanel {
            background-color: #f2fff2;
        }

        .battlePanel.enemyPanel {
            background-color: #fff2f2;
        }

        .inventorySection {
            margin-top: 10px;
        }

        .equipmentSection {
            margin-top: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
        }

        .slotLabel {
            font-size: 12px;
            color: #666;
        }

        .battleGrid {
            display: grid;
            grid-template-columns: repeat(20, 28px);
            gap: 2px;
            justify-content: center;
            margin-top: 10px;
        }

        .battleCell {
            width: 28px;
            height: 28px;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f3f3;
        }

        .battleCell.hero {
            background-color: #c8f7c5;
        }

        .battleCell.enemy {
            background-color: #f7c5c5;
        }

        .battleCell.shop {
            background-color: #7aaaff;
            color: #003366;
            font-weight: bold;
        }

        .battleCell.druidHouse {
            background-color: #a36e2f;
            color: #fff;
            font-weight: bold;
        }

        .battleCell.treasure {
            background-color: #f0d95e;
            color: #333;
            font-weight: bold;
        }

        .battleCell.tree {
            background-color: #1b5e20;
            color: #d6f5d6;
            font-weight: bold;
        }

        .battleCell.woodBlock {
            background-color: #8b5a2b;
            color: #fff3e0;
            font-weight: bold;
        }

        .battleCell.stoneBlock {
            background-color: #d0d0d0;
            color: #222;
            font-weight: bold;
        }

        .battleCell.cave {
            background-color: #7d7d7d;
            color: #f5f5f5;
            font-weight: bold;
        }

        .battleCell.caveCenter {
            background-color: #111;
            color: #ddd;
            font-weight: bold;
        }

        .caveGrid {
            display: none;
            grid-template-columns: repeat(8, 36px);
            gap: 2px;
            justify-content: center;
            margin-top: 10px;
        }

        .caveCell {
            width: 36px;
            height: 36px;
            border: 1px solid #3d3d3d;
            background: #4a4a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
        }

        .caveCell.hero {
            background: #c8f7c5;
            color: #111;
            font-weight: bold;
        }

        .caveCell.rock {
            background: #111;
            color: #111;
        }

        .mapWithLeftLogs {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
        }

        .leftLogsPanel {
            width: 64px;
            min-height: 598px;
            border: 1px solid #b8ad97;
            background: #efe5d2;
            padding: 4px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .leftLogItem {
            height: 24px;
            border-radius: 2px;
            background-color: #6d4c41;
            color: #fff3e0;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .leftRockItem {
            height: 24px;
            border-radius: 2px;
            background-color: #2f2f2f;
            color: #e2e2e2;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .resourceSectionTitle {
            font-size: 11px;
            color: #4f4435;
            text-align: center;
            font-weight: bold;
            margin-top: 4px;
        }

        .leftLogsEmpty {
            font-size: 11px;
            color: #6f675e;
            text-align: center;
            margin-top: 6px;
        }

        .caveViewLayout {
            display: none;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
        }

        .caveResourcePanel {
            width: 72px;
            min-height: 304px;
            border: 1px solid #555;
            background: #d3d3d3;
            padding: 4px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .moveButton {
            width: 100%;
            height: 100%;
            border: none;
            background: none;
            font-size: 14px;
            cursor: pointer;
        }

        .attackButton {
            margin-top: 10px;
            padding: 6px 10px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }

        .inventoryButton {
            margin-top: 10px;
            padding: 6px 10px;
            color: white;
            border: none;
            cursor: pointer;
        }

        #shopButton {
            background: #365ea8;
        }

        #treasureButton {
            background: #d97706;
        }

        #druidHouseButton {
            background: #8b5a2b;
        }

        #chopTreeButton {
            background: #1b5e20;
        }

        #buildButton {
            background: #0f9ea8;
        }

        #caveButton {
            background: #111;
            color: #fff;
        }

        #mineButton {
            background: #c9c9c9;
            color: #111;
        }

        #stoneBuildButton {
            background: #d4d4d4;
            color: #111;
        }

        .fleeButton {
            margin-top: 10px;
            padding: 6px 10px;
            background-color: #d4b400;
            color: black;
            border: none;
            cursor: pointer;
        }

        .statBox {
            margin: 8px 0;
            font-size: 13px;
        }

        .eventLog {
            margin-top: 12px;
            border-top: 1px solid #ddd;
            padding-top: 8px;
            text-align: left;
            font-size: 12px;
            max-height: 140px;
            overflow-y: auto;
        }

        .adventureLayout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .adventureMain {
            min-width: 0;
        }

        .adventureLog,
        .deathLog {
            margin-top: 0;
            max-height: 55vh;
        }

        .deathLayout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            text-align: left;
        }

        .deathMain {
            min-width: 0;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: stretch;
            }

            .box {
                flex: 1 1 auto;
            }
        }

        @media (min-width: 1024px) {
            .screenCard {
                padding: 16px;
            }

            .adventureLayout,
            .deathLayout {
                flex-direction: row;
                align-items: flex-start;
            }

            .adventureMain,
            .deathMain {
                flex: 1;
            }

            .adventureLog,
            .deathLog {
                width: 320px;
                flex: 0 0 320px;
                border-top: 0;
                border-left: 1px solid #ddd;
                padding-top: 0;
                padding-left: 10px;
                max-height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div id="startScreen" class="startScreen screenCard">
        <h1>Welcome</h1>
        <p id="welcomeMessage"></p>
        <p id="welcomeTip"></p>
        <button id="startButton" class="startButton gameButton" onclick="startGameFromWelcome()">Start</button>
    </div>

    <div id="mainView" class="screenCard mainScreen" style="display:none;">
        <h1 id="pageTitle" class="mainHeader">Gear Shop</h1>
        <button id="backToAdventureButton" class="gameButton" onclick="returnToAdventure()" style="display:none;">Back to Adventure</button>
        <div class="container">
            <div class="box">
                <h2>Shop</h2>
                <ul id="shopList"></ul>
                <div id="warningMessage" class="warning"></div>
            </div>

            <div class="box">
                <h2>Inventory</h2>
                <p>Gold: <span id="goldAmount" class="goldValue"></span></p>
                <div class="equipmentSection">
                    <h3>Equipped</h3>
                    <ul id="equipmentList"></ul>
                </div>
                <div class="inventorySection">
                    <h3>Bag</h3>
                    <ul id="inventoryList"></ul>
                </div>
            </div>
        </div>
        <div class="mainFooter">
            <button id="adventureButton" class="gameButton" onclick="startAdventureMode()" style="display:none;">Start adventure</button>
        </div>
    </div>

    <div id="battleScreen" class="battleScreen screenCard">
        <h2 id="adventureTitle">Adventure</h2>
        <div id="battleInfo"></div>
        <div id="battlePanels" class="battlePanels">
            <div id="heroBattlePanel" class="battlePanel heroPanel"></div>
            <div id="enemyBattlePanel" class="battlePanel enemyPanel"></div>
        </div>
        <div id="battleStats" class="statBox"></div>
        <button id="attackButton" class="attackButton" onclick="heroAttack()" style="display:none;">Fight</button>
        <button id="fleeButton" class="fleeButton" onclick="heroFlee()" style="display:none;">Flee</button>
        <button id="inventoryButton" class="inventoryButton" onclick="openInventory()">Open Inventory</button>
        <button id="drinkPotionQuickButton" class="attackButton" onclick="drinkHealthPotionQuick()" style="display:none;">Drink Health potion</button>
        <button id="shopButton" class="inventoryButton" onclick="enterShop()" style="display:none;">Enter Shop</button>
        <button id="druidHouseButton" class="inventoryButton" onclick="enterDruidHouse()" style="display:none;">Enter Druid House</button>
        <button id="chopTreeButton" class="inventoryButton" onclick="chopTree()" style="display:none;">Chop Logs</button>
        <button id="buildButton" class="inventoryButton" onclick="buildFromLogs()" style="display:none;" disabled>Build</button>
        <button id="stoneBuildButton" class="inventoryButton" onclick="buildFromRocks()" style="display:none;" disabled>Stone Build</button>
        <button id="caveButton" class="inventoryButton" onclick="toggleCave()" style="display:none;">Enter Cave</button>
        <button id="mineButton" class="inventoryButton" onclick="mineRock()" style="display:none;">Mine</button>
        <button id="treasureButton" class="inventoryButton" onclick="openTreasure()" style="display:none;">Open Treasure</button>
        <div class="adventureLayout">
            <div class="adventureMain">
                <div class="mapWithLeftLogs">
                    <div id="leftLogsPanel" class="leftLogsPanel"></div>
                    <div id="battleGrid" class="battleGrid"></div>
                </div>
                <div id="caveViewLayout" class="caveViewLayout">
                    <div id="caveGrid" class="caveGrid"></div>
                    <div id="caveResourcePanel" class="caveResourcePanel"></div>
                </div>
            </div>
            <div id="eventLog" class="eventLog adventureLog"></div>
        </div>
    </div>

    <div id="deathScreen" class="deathScreen screenCard">
        <h2>The End</h2>
        <div class="deathLayout">
            <div class="deathMain">
                <div id="deathSummary" class="deathSummary"></div>
                <button id="deathRestartButton" class="startButton gameButton" onclick="restartAfterDeath()">Start a New Game</button>
            </div>
            <div>
                <h3>Battle Log</h3>
                <div id="deathLog" class="eventLog deathLog"></div>
            </div>
        </div>
    </div>

    <script>
        var shopItems = [];
        var inventory = [];
        var gold = 0;
        var mapSize = 20;
        var caveSize = 8;
        var initialTreeCount = 15;
        var dailyTreeGrowth = 3;
        var startingGold = 0;
        var startingSurvivalEnemyCount = 0;
        var isGameDataLoaded = false;
        var hasHorse = false;
        var horseCount = 0;
        var equippedItems = {
            head: null,
            torso: null,
            mainHand: null,
            offHand: null
        };
        var heroStats = {
            name: '',
            healthPoints: 0,
            currentHealth: 0,
            baseDamage: 0,
            baseArmor: 0
        };
        var heroPos = { x: 0, y: 0 };
        var shopPos = { x: 0, y: 0 };
        var druidHouseCells = [];
        var treasureCells = [];
        var treeCells = [];
        var logCells = [];
        var woodBlockCells = [];
        var stoneBlockCells = [];
        var caveCells = [];
        var inCave = false;
        var caveHeroPos = { x: 4, y: 7 };
        var caveRockCells = [];
        var caveExitPos = null;
        var caveExitDiscovered = false;
        var caveGeneratedDay = 0;
        var caveEnemies = [];
        var caveSkeletonRockKeys = {};
        var caveGoldRockKeys = {};
        var minedRockItems = [];
        var battleActive = false;
        var gameOver = false;
        var enemyTemplates = [];
        var allItems = [];
        var enemies = [];
        var currentEnemy = null;
        var enemyCurrentHealth = 0;
        var turnNumber = 0;
        var eventLog = [];
        var enemiesKilled = 0;
        var goldAcquired = 0;
        var currentDay = 1;
        var druidHealDay = 0;
        var survivalEnemyCount = 0;
        var pendingShopSurvivalAdvance = false;
        var pendingShopEnemyCount = 0;
        var isShopOpen = true;
        var heroLevel = 1;
        var heroExperience = 0;
        var heroNextLevelXp = 5;
        var shopItemTargetCount = 10;
        var enemyTurnPending = false;
        var enemyMoveTimeoutId = null;
        var enemyMoveDelayMs = 500;
        var isFreshDataMode = false;
        var heroScaling = {
            baseLevel: 1,
            healthIncreasePerLevel: 1,
            damageIncreasePerLevel: 1,
            armorIncreasePerLevel: 1
        };
        var heroBaseStats = {
            healthPoints: 0,
            baseDamage: 0,
            baseArmor: 0
        };
        var lastKillingEnemy = null;
        var endGameMessages = [
            'You have lived the bright life of a hero, destroyed {x} enemies and hoarded {y} gold.',
            'The world still sings your name; you broke {x} foes and gathered {y} gold in your wake.',
            'A legend was forged this day, as you toppled {x} enemies and saved {y} gold for the future.',
            'Your name is carved into the annals of glory, for you defeated {x} enemies and amassed {y} gold.'
        ];
        var welcomeMessages = [
            'Noble hero, help yourself with this finest selection of items in my shop and save the world.',
            'Brave traveler, choose your gear wisely before stepping into danger.',
            'Champion, steel and courage await you. Prepare and begin your quest.',
            'Defender of the realm, stock your pack and carve your path to glory.',
            'Wanderer, fortune favors the prepared. Arm up and face the wilds.'
        ];
        var tipsMessages = [
            'Kill enemies to level up.',
            'Visit druid house to heal.',
            'Buy armor to survive.'
        ];

        function getRandomTipMessage() {
            if (!tipsMessages || tipsMessages.length === 0) {
                return '';
            }
            return tipsMessages[Math.floor(Math.random() * tipsMessages.length)];
        }

        function showStartScreen() {
            var startButton = document.getElementById('startButton');
            var welcomeMessage = document.getElementById('welcomeMessage');
            var welcomeTip = document.getElementById('welcomeTip');

            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.getElementById('adventureButton').style.display = 'none';
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('deathScreen').style.display = 'none';

            if (!isGameDataLoaded) {
                startButton.disabled = true;
                startButton.textContent = 'Loading...';
                if (!welcomeMessage.textContent) {
                    welcomeMessage.textContent = 'Loading game data from JSON files...';
                }
                if (welcomeTip) {
                    welcomeTip.textContent = '';
                }
                return;
            }

            startButton.disabled = false;
            startButton.textContent = 'Start';
            welcomeMessage.textContent = welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
            if (welcomeTip) {
                welcomeTip.textContent = 'Tip: ' + getRandomTipMessage();
            }
        }

        function getSellPrice(item) {
            if (!item || typeof item.price !== 'number') {
                return 0;
            }
            return Math.floor(item.price / 2);
        }

        function isHealthPotionItem(item) {
            return !!(item && item.name === 'Health potion' && item.properties && typeof item.properties.healthPercentsRestores === 'number' && item.properties.healthPercentsRestores > 0);
        }

        function getHealthPotionRestoreAmount(item) {
            if (!isHealthPotionItem(item)) {
                return 0;
            }

            return Math.max(1, Math.round(heroStats.healthPoints * (item.properties.healthPercentsRestores / 100)));
        }

        function getFirstHealthPotionIndex() {
            for (var i = 0; i < inventory.length; i++) {
                if (isHealthPotionItem(inventory[i])) {
                    return i;
                }
            }
            return -1;
        }

        function drinkHealthPotionAt(index) {
            if (gameOver) {
                return false;
            }

            if (typeof index !== 'number' || index < 0 || index >= inventory.length) {
                return false;
            }

            var potion = inventory[index];
            if (!isHealthPotionItem(potion)) {
                return false;
            }

            var restoreAmount = getHealthPotionRestoreAmount(potion);
            var oldHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.min(heroStats.healthPoints, heroStats.currentHealth + restoreAmount);
            inventory.splice(index, 1);
            addEvent('Hero drinks Health potion and restores ' + (heroStats.currentHealth - oldHealth) + ' HP (' + oldHealth + ' -> ' + heroStats.currentHealth + ')');
            showInventory();

            if (!isShopOpen) {
                renderBattle();
            }

            return true;
        }

        function drinkHealthPotion(index) {
            drinkHealthPotionAt(index);
        }

        function drinkHealthPotionQuick() {
            var potionIndex = getFirstHealthPotionIndex();
            if (potionIndex === -1) {
                return;
            }
            drinkHealthPotionAt(potionIndex);
        }

        function getNextLevelXp(level) {
            return 5 * Math.pow(2, Math.max(0, level - 1));
        }

        function getExperienceToNextLevel() {
            return Math.max(0, heroNextLevelXp - heroExperience);
        }

        function applyHeroLevelStats(healToFull) {
            var levelDelta = Math.max(1, heroLevel - heroScaling.baseLevel + 1);
            heroStats.healthPoints = getScaledStat(heroBaseStats.healthPoints, heroScaling.healthIncreasePerLevel, levelDelta, 1);
            heroStats.baseDamage = getScaledStat(heroBaseStats.baseDamage, heroScaling.damageIncreasePerLevel, levelDelta, 0);
            heroStats.baseArmor = getScaledStat(heroBaseStats.baseArmor, heroScaling.armorIncreasePerLevel, levelDelta, 0);

            if (healToFull) {
                heroStats.currentHealth = heroStats.healthPoints;
            } else {
                heroStats.currentHealth = Math.min(heroStats.currentHealth, heroStats.healthPoints);
            }
        }

        function resetHeroProgress() {
            heroLevel = Math.max(1, heroScaling.baseLevel);
            heroExperience = 0;
            heroNextLevelXp = getNextLevelXp(heroLevel);
            applyHeroLevelStats(true);
        }

        function gainHeroExperience(amount) {
            if (typeof amount !== 'number' || amount <= 0) {
                return;
            }

            heroExperience += amount;
            addEvent('Hero gains ' + amount + ' XP (' + heroExperience + ' total).');

            while (heroExperience >= heroNextLevelXp) {
                heroLevel += 1;
                heroNextLevelXp = getNextLevelXp(heroLevel);
                applyHeroLevelStats(true);
                addEvent('Hero reaches Level ' + heroLevel + ' and is fully healed.');
            }
        }

        function startGameFromWelcome() {
            if (!isGameDataLoaded) {
                return;
            }

            var mainView = document.getElementById('mainView');
            var shopBox = mainView.querySelector('.container .box:first-child');
            var inventoryBox = mainView.querySelector('.container .box:last-child');

            resetForNewGame();

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('pageTitle').style.display = 'block';
            document.getElementById('adventureButton').style.display = 'inline-block';
            document.getElementById('backToAdventureButton').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('deathScreen').style.display = 'none';
            mainView.style.display = 'block';

            if (shopBox) {
                shopBox.style.display = 'block';
            }
            if (inventoryBox) {
                inventoryBox.style.display = 'block';
            }

            isShopOpen = true;
            showInventory();
        }

        function showDeathScreen() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('pageTitle').style.display = 'none';
            document.getElementById('adventureButton').style.display = 'none';
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            document.getElementById('backToAdventureButton').style.display = 'none';
            var summary = getEndGameMessage();
            var killerMessage = getKillerMessage();
            if (killerMessage) {
                summary += ' ' + killerMessage;
            }
            document.getElementById('deathSummary').textContent = summary;
            document.getElementById('deathLog').innerHTML = document.getElementById('eventLog').innerHTML;
            document.getElementById('deathScreen').style.display = 'block';
        }

        function restartAfterDeath() {
            resetForNewGame();
            showStartScreen();
        }

        function resetForNewGame() {
            if (!isGameDataLoaded) {
                loadItems();
                showStartScreen();
                return;
            }

            gold = startingGold;
            inventory = [];
            horseCount = 0;
            updateHorseState();

            equippedItems = {
                head: null,
                torso: null,
                mainHand: null,
                offHand: null
            };

            resetHeroProgress();
            lastKillingEnemy = null;
            heroPos = { x: 0, y: 0 };
            shopPos = { x: 0, y: 0 };
            druidHouseCells = [];
            treasureCells = [];
            treeCells = [];
            logCells = [];
            woodBlockCells = [];
            stoneBlockCells = [];
            caveCells = [];
            inCave = false;
            caveHeroPos = { x: Math.floor(caveSize / 2), y: caveSize - 1 };
            caveRockCells = [];
            caveExitPos = null;
            caveExitDiscovered = false;
            caveGeneratedDay = 0;
            caveEnemies = [];
            minedRockItems = [];
            enemies = [];
            currentEnemy = null;
            enemyCurrentHealth = 0;
            battleActive = false;
            gameOver = false;
            turnNumber = 0;
            eventLog = [];
            enemiesKilled = 0;
            goldAcquired = 0;
            currentDay = 1;
            druidHealDay = 0;
            survivalEnemyCount = startingSurvivalEnemyCount;
            pendingShopSurvivalAdvance = false;
            pendingShopEnemyCount = 0;
            isShopOpen = true;

            document.getElementById('warningMessage').textContent = '';
            document.getElementById('battleInfo').textContent = '';
            document.getElementById('battleStats').textContent = '';
            document.getElementById('eventLog').innerHTML = '';
            document.getElementById('deathLog').innerHTML = '';
            showBattleActions(false);

            shopItems = getRandomShopItems(allItems, shopItemTargetCount);
            showShop();
            showInventory();
        }

        function handleHeroDeath(killingEnemy) {
            if (gameOver) {
                return;
            }

            lastKillingEnemy = null;
            if (killingEnemy) {
                lastKillingEnemy = {
                    name: killingEnemy.name,
                    level: killingEnemy.level,
                    equippedWeapon: killingEnemy.equippedWeapon,
                    equippedArmor: killingEnemy.equippedArmor
                };
            }

            addEvent(heroStats.name + ' has fallen in battle');
            gameOver = true;
            battleActive = false;
            currentEnemy = null;
            enemyCurrentHealth = 0;
            showBattleActions(false);
            showDeathScreen();
        }

        function getKillerMessage() {
            if (!lastKillingEnemy || !lastKillingEnemy.name) {
                return '';
            }

            var level = typeof lastKillingEnemy.level === 'number' ? lastKillingEnemy.level : 1;
            var sentence = 'Your life was ended by level ' + level + ' ' + lastKillingEnemy.name;
            var equipmentParts = [];

            if (lastKillingEnemy.equippedWeapon && lastKillingEnemy.equippedWeapon.name) {
                equipmentParts.push('the ' + lastKillingEnemy.equippedWeapon.name);
            }
            if (lastKillingEnemy.equippedArmor && lastKillingEnemy.equippedArmor.name) {
                equipmentParts.push('the ' + lastKillingEnemy.equippedArmor.name);
            }

            if (equipmentParts.length === 1) {
                sentence += ' with ' + equipmentParts[0];
            } else if (equipmentParts.length === 2) {
                sentence += ' with ' + equipmentParts[0] + ' and ' + equipmentParts[1];
            }

            return sentence + '.';
        }

        function updateHorseState() {
            hasHorse = horseCount > 0;
        }

        function buyItem(index) {
            var item = shopItems[index];
            var warningMessage = document.getElementById('warningMessage');

            if (gold >= item.price) {
                gold = gold - item.price;
                inventory.push({ name: item.name, price: item.price, slot: item.slot, properties: item.properties });

                if (item.name === 'Horse') {
                    horseCount += 1;
                    updateHorseState();
                }

                shopItems.splice(index, 1);
                warningMessage.textContent = '';
                showShop();
                showInventory();
            } else {
                warningMessage.textContent = 'Not enough money !!!';
            }
        }

        function getItemStatsText(item) {
            var text = '';

            if (item.properties.damage > 0) {
                text += 'Damage ' + item.properties.damage;
            }

            if (item.properties.armor > 0) {
                if (text !== '') {
                    text += ' / ';
                }
                text += 'Armour ' + item.properties.armor;
            }

            return text;
        }

        function showShop() {
            var shopList = document.getElementById('shopList');
            shopList.innerHTML = '';

            for (var i = 0; i < shopItems.length; i++) {
                var item = shopItems[i];
                var li = document.createElement('li');
                li.innerHTML = '<span class="shopItemInfo"><span class="itemName">' + item.name + '</span> <span class="slotLabel">(' + item.slot + ')</span><br><span class="itemStatsSmall">' + getItemStatsText(item) + '</span></span><span class="price goldValue">' + item.price + '</span><button onclick="buyItem(' + i + ')">Buy</button>';
                shopList.appendChild(li);
            }
        }

        function sellItem(index) {
            if (!isShopOpen) {
                return;
            }

            var item = inventory[index];

            if (item) {
                if (item.name === 'Horse') {
                    horseCount = Math.max(0, horseCount - 1);
                    updateHorseState();
                }

                gold = gold + getSellPrice(item);
                inventory.splice(index, 1);
                showInventory();
            }
        }

        function unequipItem(slotKey) {
            var item = equippedItems[slotKey];

            if (!item) {
                return;
            }

            if (slotKey === 'mainHand' && equippedItems.mainHand && equippedItems.offHand && equippedItems.mainHand === equippedItems.offHand) {
                inventory.push(equippedItems.mainHand);
                equippedItems.mainHand = null;
                equippedItems.offHand = null;
                showInventory();
                return;
            }

            if (slotKey === 'offHand' && equippedItems.mainHand && equippedItems.offHand && equippedItems.mainHand === equippedItems.offHand) {
                inventory.push(equippedItems.offHand);
                equippedItems.mainHand = null;
                equippedItems.offHand = null;
                showInventory();
                return;
            }

            equippedItems[slotKey] = null;
            inventory.push(item);
            showInventory();
        }

        function equipItem(index) {
            var item = inventory[index];

            if (!item) {
                return;
            }

            if (item.slot === 'main hand/off-hand') {
                if (equippedItems.mainHand === null && equippedItems.offHand === null) {
                    equippedItems.mainHand = item;
                    equippedItems.offHand = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'main hand') {
                if (equippedItems.mainHand === null) {
                    equippedItems.mainHand = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'off-hand') {
                if (equippedItems.offHand === null) {
                    equippedItems.offHand = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'head') {
                if (equippedItems.head === null) {
                    equippedItems.head = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            } else if (item.slot === 'torso') {
                if (equippedItems.torso === null) {
                    equippedItems.torso = item;
                    inventory.splice(index, 1);
                    showInventory();
                }
            }
        }

        function showInventory() {
            var inventoryList = document.getElementById('inventoryList');
            var equipmentList = document.getElementById('equipmentList');
            inventoryList.innerHTML = '';
            equipmentList.innerHTML = '';

            var slotNames = [
                { key: 'head', label: 'Head' },
                { key: 'torso', label: 'Torso' },
                { key: 'mainHand', label: 'Main Hand' },
                { key: 'offHand', label: 'Off Hand' }
            ];

            for (var s = 0; s < slotNames.length; s++) {
                var slot = slotNames[s];
                var slotItem = equippedItems[slot.key === 'mainHand' ? 'mainHand' : slot.key === 'offHand' ? 'offHand' : slot.key];
                var slotLi = document.createElement('li');
                var slotKey = slot.key === 'mainHand' ? 'mainHand' : slot.key === 'offHand' ? 'offHand' : slot.key;
                if (slotItem) {
                    slotLi.innerHTML = '<span><strong>' + slot.label + ':</strong> <span class="itemName">' + slotItem.name + '</span> (' + getItemStatsText(slotItem) + ')</span><button onclick="unequipItem(\'' + slotKey + '\')">Unequip</button>';
                } else {
                    slotLi.innerHTML = '<span><strong>' + slot.label + ':</strong> Empty</span><span></span>';
                }
                equipmentList.appendChild(slotLi);
            }

            for (var i = 0; i < inventory.length; i++) {
                var item = inventory[i];
                var li = document.createElement('li');
                var sellPrice = getSellPrice(item);
                var sellButtonHtml = isShopOpen ? '<button onclick="sellItem(' + i + ')">Sell for ' + sellPrice + '</button>' : '<button disabled>Sell for ' + sellPrice + '</button>';
                var actionButtonHtml = '';
                if (isHealthPotionItem(item)) {
                    actionButtonHtml = '<button onclick="drinkHealthPotion(' + i + ')">Drink to restore ' + getHealthPotionRestoreAmount(item) + ' HP</button>';
                } else {
                    actionButtonHtml = '<button onclick="equipItem(' + i + ')">Equip</button>';
                }
                li.innerHTML = '<span><span class="itemName">' + item.name + '</span> <span class="slotLabel">(' + item.slot + ')</span><br>' + getItemStatsText(item) + '</span>' + actionButtonHtml + sellButtonHtml;
                inventoryList.appendChild(li);
            }

            document.getElementById('goldAmount').textContent = gold;
        }

        function getRandomCell() {
            return {
                x: Math.floor(Math.random() * mapSize),
                y: Math.floor(Math.random() * mapSize)
            };
        }

        function addRandomTrees(count, blockedCells) {
            var blocked = blockedCells || [];

            for (var treeIndex = 0; treeIndex < count; treeIndex++) {
                var treePos = getRandomCell();
                var treeBlocked = false;

                while (!treeBlocked) {
                    treeBlocked = true;
                    for (var c = 0; c < blocked.length; c++) {
                        if (blocked[c].x === treePos.x && blocked[c].y === treePos.y) {
                            treePos = getRandomCell();
                            treeBlocked = false;
                            break;
                        }
                    }
                }

                treeCells.push(treePos);
                blocked.push(treePos);
            }
        }

        function getDailyCaveCells() {
            return [
                { x: 0, y: mapSize - 3 },
                { x: 1, y: mapSize - 3 },
                { x: 2, y: mapSize - 3 },
                { x: 0, y: mapSize - 2 },
                { x: 1, y: mapSize - 2, isCenter: true },
                { x: 2, y: mapSize - 2 },
                { x: 0, y: mapSize - 1 },
                { x: 1, y: mapSize - 1 },
                { x: 2, y: mapSize - 1 }
            ];
        }

        function getEnemyDisplayLetter(enemy) {
            if (!enemy || !enemy.name) {
                return 'E';
            }
            return enemy.name.charAt(0).toUpperCase();
        }

        function getEnemyDisplayName(enemy) {
            if (!enemy || !enemy.name) {
                return 'Enemy';
            }

            var level = typeof enemy.level === 'number' ? enemy.level : 1;
            return 'Level ' + level + ' ' + enemy.name;
        }

        function getEnemyMapColor(level) {
            var safeLevel = Math.max(1, typeof level === 'number' ? level : 1);
            var lightness = Math.max(34, 86 - (safeLevel - 1) * 5);
            return 'hsl(0, 70%, ' + lightness + '%)';
        }

        function getEnemyMapTextColor(level) {
            var safeLevel = Math.max(1, typeof level === 'number' ? level : 1);
            var lightness = Math.max(34, 86 - (safeLevel - 1) * 5);
            return lightness <= 56 ? '#fff' : '#4d0f0f';
        }

        function getScaledStat(baseValue, increasePerLevel, level, minimum) {
            var minValue = typeof minimum === 'number' ? minimum : 0;
            var safeBase = typeof baseValue === 'number' ? baseValue : minValue;
            var safeIncrease = typeof increasePerLevel === 'number' && increasePerLevel > 0 ? increasePerLevel : 1;
            var safeLevel = Math.max(1, typeof level === 'number' ? level : 1);
            return Math.max(minValue, Math.round(safeBase * Math.pow(safeIncrease, safeLevel - 1)));
        }

        function getEnemyLevelForCurrentDay(template) {
            var baseLevel = 1;
            if (template && typeof template.baseLevel === 'number') {
                baseLevel = Math.max(1, Math.floor(template.baseLevel));
            }
            var maxLevel = Math.max(1, currentDay);
            var minLevel = Math.min(baseLevel, maxLevel);
            return minLevel + Math.floor(Math.random() * (maxLevel - minLevel + 1));
        }

        function getEnemyGoldDrop(template, level) {
            if (!template) {
                return 0;
            }

            var baseDrop = typeof template.dropsGold === 'number' ? template.dropsGold : 0;
            var increasePerLevel = typeof template.goldIncreasePerLevel === 'number' ? template.goldIncreasePerLevel : 1;
            return getScaledStat(baseDrop, increasePerLevel, level, 0);
        }

        function getRandomEnemyEquipment(kind) {
            if (!allItems || allItems.length === 0) {
                return null;
            }

            var candidates = [];
            var propertyName = kind === 'weapon' ? 'damage' : 'armor';

            for (var i = 0; i < allItems.length; i++) {
                var item = allItems[i];
                if (!item || !item.properties) {
                    continue;
                }

                var value = item.properties[propertyName];
                if (typeof value !== 'number' || value <= 0) {
                    continue;
                }

                if (kind === 'weapon') {
                    if (item.slot !== 'main hand' && item.slot !== 'main hand/off-hand') {
                        continue;
                    }
                } else if (kind === 'armor') {
                    if (item.slot !== 'off-hand' && item.slot !== 'head' && item.slot !== 'torso' && item.slot !== 'main hand/off-hand') {
                        continue;
                    }
                }

                candidates.push(item);
            }

            if (candidates.length === 0) {
                return null;
            }

            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function getRandomShopItems(items, count) {
            var result = [];
            var source = (items || []).slice();
            var maxCount = Math.min(count, source.length);

            for (var i = 0; i < maxCount; i++) {
                var randomIndex = Math.floor(Math.random() * source.length);
                result.push(source[randomIndex]);
                source.splice(randomIndex, 1);
            }

            var requiredItems = [];
            for (var j = 0; j < items.length; j++) {
                if (items[j] && (items[j].name === 'Axe' || items[j].name === 'Pickaxe')) {
                    requiredItems.push(items[j]);
                }
            }

            for (var requiredIndex = 0; requiredIndex < requiredItems.length && result.length > 0; requiredIndex++) {
                var requiredItem = requiredItems[requiredIndex];
                var hasRequiredItem = false;
                for (var k = 0; k < result.length; k++) {
                    if (result[k] && result[k].name === requiredItem.name) {
                        hasRequiredItem = true;
                        break;
                    }
                }
                if (!hasRequiredItem) {
                    var replaceIndex = Math.max(0, result.length - 1 - requiredIndex);
                    result[replaceIndex] = requiredItem;
                }
            }

            return result;
        }

        function refillShopToTargetCount() {
            if (!allItems || allItems.length === 0) {
                return;
            }

            var targetCount = Math.min(shopItemTargetCount, allItems.length);
            while (shopItems.length < targetCount) {
                var existingNames = {};
                for (var i = 0; i < shopItems.length; i++) {
                    if (shopItems[i] && shopItems[i].name) {
                        existingNames[shopItems[i].name] = true;
                    }
                }

                var candidates = [];
                for (var c = 0; c < allItems.length; c++) {
                    var candidate = allItems[c];
                    if (!candidate || !candidate.name) {
                        continue;
                    }
                    if (!existingNames[candidate.name]) {
                        candidates.push(candidate);
                    }
                }

                if (candidates.length === 0) {
                    candidates = allItems.slice();
                }

                shopItems.push(candidates[Math.floor(Math.random() * candidates.length)]);
            }
        }

        function isCellBlockedForEnemyMovement(candidate, movingEnemy, allowHeroCell) {
            if (!candidate) {
                return true;
            }

            if (!allowHeroCell && candidate.x === heroPos.x && candidate.y === heroPos.y) {
                return true;
            }

            if (candidate.x === shopPos.x && candidate.y === shopPos.y) {
                return true;
            }

            if (isDruidHouseCell(candidate)) {
                return true;
            }

            if (getTreasureAt(candidate)) {
                return true;
            }

            if (isTreeCell(candidate)) {
                return true;
            }

            if (isWoodBlockCell(candidate)) {
                return true;
            }

            if (isStoneBlockCell(candidate)) {
                return true;
            }

            if (isCaveCell(candidate)) {
                return true;
            }

            for (var i = 0; i < enemies.length; i++) {
                var otherEnemy = enemies[i];
                if (!otherEnemy || !otherEnemy.alive || otherEnemy === movingEnemy) {
                    continue;
                }

                if (otherEnemy.pos.x === candidate.x && otherEnemy.pos.y === candidate.y) {
                    return true;
                }
            }

            return false;
        }

        function getAliveEnemyCount() {
            var aliveCount = 0;
            for (var i = 0; i < enemies.length; i++) {
                if (enemies[i] && enemies[i].alive) {
                    aliveCount += 1;
                }
            }
            return aliveCount;
        }

        function spawnEnemyAtRandomPosition() {
            var blockedCells = [heroPos, shopPos];
            for (var i = 0; i < druidHouseCells.length; i++) {
                blockedCells.push(druidHouseCells[i]);
            }
            for (var i = 0; i < treasureCells.length; i++) {
                blockedCells.push(treasureCells[i].pos);
            }
            for (var i = 0; i < treeCells.length; i++) {
                blockedCells.push(treeCells[i]);
            }
            for (var i = 0; i < woodBlockCells.length; i++) {
                blockedCells.push(woodBlockCells[i]);
            }
            for (var i = 0; i < stoneBlockCells.length; i++) {
                blockedCells.push(stoneBlockCells[i]);
            }
            for (var i = 0; i < caveCells.length; i++) {
                blockedCells.push(caveCells[i]);
            }
            for (var i = 0; i < enemies.length; i++) {
                if (enemies[i] && enemies[i].alive) {
                    blockedCells.push(enemies[i].pos);
                }
            }

            var enemyPos = getRandomCell();
            var isBlocked = false;
            while (!isBlocked) {
                isBlocked = true;
                for (var b = 0; b < blockedCells.length; b++) {
                    if (blockedCells[b].x === enemyPos.x && blockedCells[b].y === enemyPos.y) {
                        enemyPos = getRandomCell();
                        isBlocked = false;
                        break;
                    }
                }
            }

            var availableTemplates = enemyTemplates.filter(function(enemyTemplate) {
                var templateBaseLevel = typeof enemyTemplate.baseLevel === 'number' ? Math.max(1, Math.floor(enemyTemplate.baseLevel)) : 1;
                return templateBaseLevel <= currentDay && enemyTemplate.name !== 'Skeleton';
            });
            if (availableTemplates.length === 0) {
                availableTemplates = enemyTemplates.filter(function(enemyTemplate) {
                    return enemyTemplate && enemyTemplate.name !== 'Skeleton';
                });
            }

            var template = availableTemplates[Math.floor(Math.random() * availableTemplates.length)];
            var level = getEnemyLevelForCurrentDay(template);
            var healthIncreasePerLevel = typeof template.healthIncreasePerLevel === 'number' ? template.healthIncreasePerLevel : 1;
            var damageIncreasePerLevel = typeof template.damageIncreasePerLevel === 'number' ? template.damageIncreasePerLevel : 1;
            var armorIncreasePerLevel = typeof template.armorIncreasePerLevel === 'number' ? template.armorIncreasePerLevel : 1;
            var canHaveWeaponFromLevel = typeof template.canHaveWeaponFromLevel === 'number' ? template.canHaveWeaponFromLevel : Number.MAX_SAFE_INTEGER;
            var chanceOfHavingWeapon = typeof template.chanceOfHavingWeapon === 'number' ? template.chanceOfHavingWeapon : 0;
            var canHaveArmorFromLevel = typeof template.canHaveArmorFromLevel === 'number' ? template.canHaveArmorFromLevel : Number.MAX_SAFE_INTEGER;
            var chanceOfHavingArmor = typeof template.chanceOfHavingArmor === 'number' ? template.chanceOfHavingArmor : 0;
            var equippedWeapon = null;
            var equippedArmor = null;

            if (level >= canHaveWeaponFromLevel && Math.random() < chanceOfHavingWeapon) {
                equippedWeapon = getRandomEnemyEquipment('weapon');
            }

            if (level >= canHaveArmorFromLevel && Math.random() < chanceOfHavingArmor) {
                equippedArmor = getRandomEnemyEquipment('armor');
            }

            enemies.push({
                name: template.name,
                behaviour: template.behaviour,
                level: level,
                healthPoints: getScaledStat(template.healthPoints, healthIncreasePerLevel, level, 1),
                baseDamage: getScaledStat(typeof template.baseDamage === 'number' ? template.baseDamage : 5, damageIncreasePerLevel, level, 0),
                baseArmor: getScaledStat(typeof template.baseArmor === 'number' ? template.baseArmor : 0, armorIncreasePerLevel, level, 0),
                dropsGold: getEnemyGoldDrop(template, level),
                pos: enemyPos,
                alive: true,
                equippedWeapon: equippedWeapon,
                equippedArmor: equippedArmor
            });

            var spawnedEnemy = enemies[enemies.length - 1];
            addEvent('A new ' + getEnemyDisplayName(spawnedEnemy) + ' has appeared on the map.');
        }

        function spawnEnemyWave(count) {
            for (var i = 0; i < count; i++) {
                spawnEnemyAtRandomPosition();
            }
        }

        function refreshShopForNewDay() {
            if (!allItems || allItems.length === 0) {
                return;
            }

            if (!shopItems) {
                shopItems = [];
            }

            if (shopItems.length > 0) {
                shopItems.shift();
            }

            refillShopToTargetCount();

            var healthPotionItem = null;
            for (var a = 0; a < allItems.length; a++) {
                if (allItems[a] && allItems[a].name === 'Health potion') {
                    healthPotionItem = allItems[a];
                    break;
                }
            }

            if (healthPotionItem) {
                var hasHealthPotion = false;
                for (var p = 0; p < shopItems.length; p++) {
                    if (shopItems[p] && shopItems[p].name === 'Health potion') {
                        hasHealthPotion = true;
                        break;
                    }
                }

                if (!hasHealthPotion && shopItems.length > 0) {
                    shopItems[shopItems.length - 1] = healthPotionItem;
                }
            }

            showShop();
        }

        function advanceSurvivalWave() {
            var nextEnemyCount = pendingShopEnemyCount + 1;
            survivalEnemyCount = nextEnemyCount;
            currentDay += 1;
            refreshShopForNewDay();
            spawnEnemyWave(nextEnemyCount);
            addRandomTrees(dailyTreeGrowth, [heroPos, shopPos].concat(druidHouseCells, treasureCells.map(function(t) { return t.pos; }), treeCells, woodBlockCells, caveCells, enemies.filter(function(enemy) { return enemy && enemy.alive; }).map(function(enemy) { return enemy.pos; })));
            addEvent('Day ' + currentDay + ' begins. The battlefield grows fiercer. ' + survivalEnemyCount + ' enemies now roam the land, and new trees spread across the wilds.');
            updateAdventureTitle();
        }

        function getEndGameMessage() {
            var message = endGameMessages[Math.floor(Math.random() * endGameMessages.length)];
            var daysText = currentDay === 1 ? '1 day' : currentDay + ' days';
            return message.replace('{x}', enemiesKilled).replace('{y}', goldAcquired) + ' You survived ' + daysText + '.';
        }

        function isSameCell(a, b) {
            return a.x === b.x && a.y === b.y;
        }

        function isWithinOneCell(a, b) {
            return Math.abs(a.x - b.x) <= 1 && Math.abs(a.y - b.y) <= 1;
        }

        function isDirectlyAdjacent(a, b) {
            return Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;
        }

        function getEnemyMovementOptions(pos) {
            var options = [];
            var directions = [
                { x: -1, y: -1 },
                { x: 0, y: -1 },
                { x: 1, y: -1 },
                { x: -1, y: 0 },
                { x: 1, y: 0 },
                { x: -1, y: 1 },
                { x: 0, y: 1 },
                { x: 1, y: 1 }
            ];

            for (var i = 0; i < directions.length; i++) {
                var candidate = { x: pos.x + directions[i].x, y: pos.y + directions[i].y };
                if (candidate.x >= 0 && candidate.x < mapSize && candidate.y >= 0 && candidate.y < mapSize) {
                    options.push(candidate);
                }
            }

            return options;
        }

        function getEnemyChaseOptions(pos) {
            var options = getEnemyMovementOptions(pos);
            options.sort(function(a, b) {
                var aDist = Math.abs(a.x - heroPos.x) + Math.abs(a.y - heroPos.y);
                var bDist = Math.abs(b.x - heroPos.x) + Math.abs(b.y - heroPos.y);
                return aDist - bDist;
            });
            return options;
        }

        function moveEnemies() {
            if (gameOver || battleActive) {
                return false;
            }

            for (var i = 0; i < enemies.length; i++) {
                var enemy = enemies[i];
                if (!enemy || !enemy.alive) {
                    continue;
                }

                var behaviour = (enemy.behaviour || '').toLowerCase();
                var options = [];

                if (behaviour.indexOf('active aggressive') !== -1) {
                    options = getEnemyChaseOptions(enemy.pos);
                } else if (behaviour.indexOf('aggressive') !== -1) {
                    options = getEnemyMovementOptions(enemy.pos);
                }

                if (options.length === 0) {
                    continue;
                }

                var allowHeroCell = behaviour.indexOf('active aggressive') !== -1 || behaviour.indexOf('wandering aggressive') !== -1;

                options = options.filter(function(option) {
                    return !isCellBlockedForEnemyMovement(option, enemy, allowHeroCell);
                });

                if (options.length === 0) {
                    continue;
                }

                var chosenIndex = behaviour.indexOf('active aggressive') !== -1 ? 0 : Math.floor(Math.random() * options.length);
                enemy.pos = options[chosenIndex];

                if (isSameCell(enemy.pos, heroPos)) {
                    currentEnemy = enemy;
                    enemyCurrentHealth = enemy.healthPoints;
                    battleActive = true;
                    addEvent('Turn ' + turnNumber + '. ' + enemy.name + ' reaches the hero first and strikes!');

                    var enemyDamage = Math.max(0, getEnemyDamage(currentEnemy) - getHeroArmor());
                    var oldHeroHealth = heroStats.currentHealth;
                    heroStats.currentHealth = Math.max(0, heroStats.currentHealth - enemyDamage);
                    addEvent('Enemy attacks first for ' + enemyDamage + ' damage (' + heroStats.name + ' armor ' + getHeroArmor() + ' reduces to ' + enemyDamage + ', HP ' + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');

                    if (heroStats.currentHealth <= 0) {
                        handleHeroDeath(currentEnemy);
                        return true;
                    }

                    showBattleActions(true);
                    renderBattle();
                    return true;
                }
            }

            return false;
        }

        function getAdjacentCells(pos) {
            var cells = [];
            var step = hasHorse ? 3 : 1;
            var maxIndex = mapSize - 1;

            if (pos.x > 0) cells.push({ x: pos.x - 1, y: pos.y, arrow: '←' });
            if (pos.x < maxIndex) cells.push({ x: pos.x + 1, y: pos.y, arrow: '→' });
            if (pos.y > 0) cells.push({ x: pos.x, y: pos.y - 1, arrow: '↑' });
            if (pos.y < maxIndex) cells.push({ x: pos.x, y: pos.y + 1, arrow: '↓' });
            if (pos.x > 0 && pos.y > 0) cells.push({ x: pos.x - 1, y: pos.y - 1, arrow: '↖' });
            if (pos.x < maxIndex && pos.y > 0) cells.push({ x: pos.x + 1, y: pos.y - 1, arrow: '↗' });
            if (pos.x > 0 && pos.y < maxIndex) cells.push({ x: pos.x - 1, y: pos.y + 1, arrow: '↙' });
            if (pos.x < maxIndex && pos.y < maxIndex) cells.push({ x: pos.x + 1, y: pos.y + 1, arrow: '↘' });

            if (hasHorse) {
                if (pos.x >= 3) cells.push({ x: pos.x - 3, y: pos.y, arrow: '←←←' });
                if (pos.x <= maxIndex - 3) cells.push({ x: pos.x + 3, y: pos.y, arrow: '→→→' });
                if (pos.y >= 3) cells.push({ x: pos.x, y: pos.y - 3, arrow: '↑↑↑' });
                if (pos.y <= maxIndex - 3) cells.push({ x: pos.x, y: pos.y + 3, arrow: '↓↓↓' });
                if (pos.x >= 3 && pos.y >= 3) cells.push({ x: pos.x - 3, y: pos.y - 3, arrow: '↖↖↖' });
                if (pos.x <= maxIndex - 3 && pos.y >= 3) cells.push({ x: pos.x + 3, y: pos.y - 3, arrow: '↗↗↗' });
                if (pos.x >= 3 && pos.y <= maxIndex - 3) cells.push({ x: pos.x - 3, y: pos.y + 3, arrow: '↙↙↙' });
                if (pos.x <= maxIndex - 3 && pos.y <= maxIndex - 3) cells.push({ x: pos.x + 3, y: pos.y + 3, arrow: '↘↘↘' });
            }

            return cells;
        }

        function generateCaveRocks() {
            caveRockCells = [];
            caveExitPos = null;
            caveExitDiscovered = false;
            caveGeneratedDay = currentDay;
            caveEnemies = [];
            caveSkeletonRockKeys = {};
            caveGoldRockKeys = {};
            var blockedCells = [caveHeroPos];

            for (var rockIndex = 0; rockIndex < 16; rockIndex++) {
                var rockPos = {
                    x: Math.floor(Math.random() * caveSize),
                    y: Math.floor(Math.random() * caveSize)
                };
                var blocked = true;

                while (blocked) {
                    blocked = false;
                    for (var i = 0; i < blockedCells.length; i++) {
                        if (blockedCells[i].x === rockPos.x && blockedCells[i].y === rockPos.y) {
                            rockPos = {
                                x: Math.floor(Math.random() * caveSize),
                                y: Math.floor(Math.random() * caveSize)
                            };
                            blocked = true;
                            break;
                        }
                    }
                }

                caveRockCells.push(rockPos);
                blockedCells.push(rockPos);
            }

            if (caveRockCells.length > 0) {
                var exitRock = caveRockCells[Math.floor(Math.random() * caveRockCells.length)];
                caveExitPos = { x: exitRock.x, y: exitRock.y };
            }

            var skeletonAssigned = false;
            var goldAssigned = false;
            for (var rockOutcomeIndex = 0; rockOutcomeIndex < caveRockCells.length; rockOutcomeIndex++) {
                var rockKey = caveRockCells[rockOutcomeIndex].x + '_' + caveRockCells[rockOutcomeIndex].y;
                if (Math.random() < 0.25) {
                    caveSkeletonRockKeys[rockKey] = true;
                    skeletonAssigned = true;
                }
                if (Math.random() < 0.25) {
                    caveGoldRockKeys[rockKey] = true;
                    goldAssigned = true;
                }
            }

            if (!skeletonAssigned && caveRockCells.length > 0) {
                var forcedSkeletonRock = caveRockCells[Math.floor(Math.random() * caveRockCells.length)];
                caveSkeletonRockKeys[forcedSkeletonRock.x + '_' + forcedSkeletonRock.y] = true;
            }
            if (!goldAssigned && caveRockCells.length > 0) {
                var forcedGoldRock = caveRockCells[Math.floor(Math.random() * caveRockCells.length)];
                caveGoldRockKeys[forcedGoldRock.x + '_' + forcedGoldRock.y] = true;
            }
        }

        function isCaveRockCell(pos) {
            for (var i = 0; i < caveRockCells.length; i++) {
                var rock = caveRockCells[i];
                if (rock.x === pos.x && rock.y === pos.y) {
                    return true;
                }
            }
            return false;
        }

        function getCaveEnemyAt(pos) {
            for (var i = 0; i < caveEnemies.length; i++) {
                var caveEnemy = caveEnemies[i];
                if (caveEnemy && caveEnemy.alive && caveEnemy.pos.x === pos.x && caveEnemy.pos.y === pos.y) {
                    return caveEnemy;
                }
            }
            return null;
        }

        function getNearbyCaveEnemy(pos) {
            for (var i = 0; i < caveEnemies.length; i++) {
                var caveEnemy = caveEnemies[i];
                if (caveEnemy && caveEnemy.alive && isWithinOneCell(pos, caveEnemy.pos)) {
                    return caveEnemy;
                }
            }
            return null;
        }

        function getAdjacentCaveRockCell(pos) {
            for (var i = 0; i < caveRockCells.length; i++) {
                if (isWithinOneCell(pos, caveRockCells[i]) && !isSameCell(pos, caveRockCells[i])) {
                    return caveRockCells[i];
                }
            }
            return null;
        }

        function isCaveExitCell(pos) {
            return !!(caveExitDiscovered && caveExitPos && pos && caveExitPos.x === pos.x && caveExitPos.y === pos.y);
        }

        function getSkeletonTemplate() {
            for (var i = 0; i < enemyTemplates.length; i++) {
                if (enemyTemplates[i] && typeof enemyTemplates[i].name === 'string' && enemyTemplates[i].name.trim().toLowerCase() === 'skeleton') {
                    return enemyTemplates[i];
                }
            }

            return {
                name: 'Skeleton',
                behaviour: 'active aggressive',
                baseLevel: 1,
                healthPoints: 10,
                baseDamage: 5,
                baseArmor: 1,
                dropsGold: 3,
                goldIncreasePerLevel: 1.2,
                healthIncreasePerLevel: 1.1,
                damageIncreasePerLevel: 1.1,
                armorIncreasePerLevel: 1.1
            };
        }

        function createCaveSkeletonEncounter() {
            var skeletonTemplate = getSkeletonTemplate();

            var skeletonLevel = getEnemyLevelForCurrentDay(skeletonTemplate);
            var healthIncreasePerLevel = typeof skeletonTemplate.healthIncreasePerLevel === 'number' ? skeletonTemplate.healthIncreasePerLevel : 1;
            var damageIncreasePerLevel = typeof skeletonTemplate.damageIncreasePerLevel === 'number' ? skeletonTemplate.damageIncreasePerLevel : 1;
            var armorIncreasePerLevel = typeof skeletonTemplate.armorIncreasePerLevel === 'number' ? skeletonTemplate.armorIncreasePerLevel : 1;

            currentEnemy = {
                name: skeletonTemplate.name,
                behaviour: skeletonTemplate.behaviour,
                level: skeletonLevel,
                healthPoints: getScaledStat(skeletonTemplate.healthPoints, healthIncreasePerLevel, skeletonLevel, 1),
                baseDamage: getScaledStat(typeof skeletonTemplate.baseDamage === 'number' ? skeletonTemplate.baseDamage : 5, damageIncreasePerLevel, skeletonLevel, 0),
                baseArmor: getScaledStat(typeof skeletonTemplate.baseArmor === 'number' ? skeletonTemplate.baseArmor : 0, armorIncreasePerLevel, skeletonLevel, 0),
                dropsGold: getEnemyGoldDrop(skeletonTemplate, skeletonLevel),
                alive: true,
                equippedWeapon: null,
                equippedArmor: null
            };
            return currentEnemy;
        }

        function spawnCaveSkeletonAt(pos) {
            if (!pos) {
                return false;
            }

            if (getCaveEnemyAt(pos)) {
                return false;
            }

            var skeleton = createCaveSkeletonEncounter();
            skeleton.pos = { x: pos.x, y: pos.y };
            caveEnemies.push(skeleton);
            addEvent('A ' + getEnemyDisplayName(skeleton) + ' rises from the shattered rock!');
            return true;
        }

            var caveGrid = document.getElementById('caveGrid');

            for (var y = 0; y < caveSize; y++) {
                for (var x = 0; x < caveSize; x++) {

                    if (x === caveHeroPos.x && y === caveHeroPos.y) {
                        cell.textContent = 'H';
                        cell.classList.add('hero');
                    } else if (getCaveEnemyAt({ x: x, y: y })) {
                        cell.textContent = 'S';
                        cell.style.background = '#8b1a1a';
                        cell.style.color = '#fff';
                    } else if (isCaveExitCell({ x: x, y: y })) {
                        cell.textContent = 'E';
                    } else if (isCaveRockCell({ x: x, y: y })) {
                        cell.classList.add('rock');
                    } else {
                        var adjacent = getAdjacentCaveCells(caveHeroPos);
                        for (var i = 0; i < adjacent.length; i++) {
                            if (adjacent[i].x === x && adjacent[i].y === y) {
                                cell.innerHTML = '<button class="moveButton" onclick="moveHeroTo(' + x + ', ' + y + ')">' + adjacent[i].arrow + '</button>';
