        function getArrowForDirection(fromPos, toPos) {
            if (toPos.x < fromPos.x && toPos.y === fromPos.y) return '←';
            if (toPos.x > fromPos.x && toPos.y === fromPos.y) return '→';
            if (toPos.x === fromPos.x && toPos.y < fromPos.y) return '↑';
            if (toPos.x === fromPos.x && toPos.y > fromPos.y) return '↓';
            if (toPos.x < fromPos.x && toPos.y < fromPos.y) return '↖';
            if (toPos.x > fromPos.x && toPos.y < fromPos.y) return '↗';
            if (toPos.x < fromPos.x && toPos.y > fromPos.y) return '↙';
            return '↘';
        }

        function formatEventMessage(message) {
            var formatted = message;

            function escapeRegex(text) {
                return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            if (enemyTemplates && enemyTemplates.length > 0) {
                var enemyNames = [];
                for (var i = 0; i < enemyTemplates.length; i++) {
                    if (enemyTemplates[i] && enemyTemplates[i].name) {
                        enemyNames.push(enemyTemplates[i].name);
                    }
                }

                enemyNames.sort(function(a, b) {
                    return b.length - a.length;
                });

                for (var n = 0; n < enemyNames.length; n++) {
                    var enemyName = enemyNames[n];
                    if (enemyName && formatted.indexOf(enemyName) !== -1) {
                        formatted = formatted.replace(new RegExp('\\b' + escapeRegex(enemyName) + '\\b', 'g'), '<span class="enemyLogName">' + enemyName + '</span>');
                    }
                }
            }

            if (heroStats && heroStats.name && formatted.indexOf(heroStats.name) !== -1) {
                formatted = formatted.replace(new RegExp('\\b' + escapeRegex(heroStats.name) + '\\b', 'g'), '<span class="heroLogName">' + heroStats.name + '</span>');
            }

            if (allItems && allItems.length > 0) {
                for (var j = 0; j < allItems.length; j++) {
                    var itemName = allItems[j].name;
                    if (itemName && formatted.indexOf(itemName) !== -1) {
                        formatted = formatted.replace(new RegExp('\\b' + escapeRegex(itemName) + '\\b', 'g'), '<span class="itemName">' + itemName + '</span>');
                    }
                }
            }

            formatted = formatted.replace(/(gold(?: now)?\s+)(\d+)/gi, '$1<span class="goldValue">$2</span>');
            formatted = formatted.replace(/(\d+)(?=\s*g\b)/gi, '<span class="goldValue">$1</span>');
            formatted = formatted.replace(/(\d+)(?=\s+gold\b)/gi, '<span class="goldValue">$1</span>');
            formatted = formatted.replace(/(\d+)(?=\s+coins?\b)/gi, '<span class="goldValue">$1</span>');

            return formatted;
        }

        function addEvent(message) {
            eventLog.unshift(message);
            var eventLogBox = document.getElementById('eventLog');
            eventLogBox.innerHTML = '';

            for (var i = 0; i < eventLog.length; i++) {
                var line = document.createElement('div');
                line.innerHTML = formatEventMessage(eventLog[i]);
                eventLogBox.appendChild(line);
            }
        }

        function getDirectionName(fromPos, toPos) {
            if (toPos.x < fromPos.x && toPos.y === fromPos.y) return 'west';
            if (toPos.x > fromPos.x && toPos.y === fromPos.y) return 'east';
            if (toPos.x === fromPos.x && toPos.y < fromPos.y) return 'north';
            if (toPos.x === fromPos.x && toPos.y > fromPos.y) return 'south';
            if (toPos.x < fromPos.x && toPos.y < fromPos.y) return 'northwest';
            if (toPos.x > fromPos.x && toPos.y < fromPos.y) return 'northeast';
            if (toPos.x < fromPos.x && toPos.y > fromPos.y) return 'southwest';
            return 'southeast';
        }

        function getHeroDamage() {
            var damage = typeof heroStats.baseDamage === 'number' ? heroStats.baseDamage : 3;
            var equippedSlots = [equippedItems.mainHand, equippedItems.offHand];
            var countedItems = [];

            for (var i = 0; i < equippedSlots.length; i++) {
                var item = equippedSlots[i];
                if (item && countedItems.indexOf(item) !== -1) {
                    continue;
                }
                if (item && item.properties && item.properties.damage) {
                    damage += item.properties.damage;
                }
                if (item) {
                    countedItems.push(item);
                }
            }

            return damage;
        }

        function getHeroArmor() {
            var armor = typeof heroStats.baseArmor === 'number' ? heroStats.baseArmor : 0;
            var equippedSlots = [equippedItems.head, equippedItems.torso, equippedItems.mainHand, equippedItems.offHand];
            var countedItems = [];

            for (var i = 0; i < equippedSlots.length; i++) {
                var item = equippedSlots[i];
                if (item && countedItems.indexOf(item) !== -1) {
                    continue;
                }
                if (item && item.properties && item.properties.armor) {
                    armor += item.properties.armor;
                }
                if (item) {
                    countedItems.push(item);
                }
            }

            return armor;
        }

        function getEnemyDamage(enemy) {
            var baseDamage = 5;

            if (!enemy) {
                return baseDamage;
            }

            if (typeof enemy.baseDamage === 'number') {
                baseDamage = enemy.baseDamage;
            }

            if (enemy.equippedWeapon && enemy.equippedWeapon.properties && enemy.equippedWeapon.properties.damage) {
                var weaponEfficiency = typeof enemy.weaponEfficiency === 'number' ? enemy.weaponEfficiency : 1;
                baseDamage = baseDamage + (enemy.equippedWeapon.properties.damage * weaponEfficiency);
            }

            return Math.max(0, Math.ceil(baseDamage));
        }

        function getEnemyArmor(enemy) {
            var armor = 0;

            if (enemy && typeof enemy.baseArmor === 'number') {
                armor += enemy.baseArmor;
            }

            if (enemy && enemy.equippedArmor && enemy.equippedArmor.properties && enemy.equippedArmor.properties.armor) {
                var armorEfficiency = typeof enemy.armorEfficiency === 'number' ? enemy.armorEfficiency : 1;
                armor += enemy.equippedArmor.properties.armor * armorEfficiency;
            }

            return Math.max(0, Math.ceil(armor));
        }

        function showBattleActions(show) {
            var attackButton = document.getElementById('attackButton');
            var fleeButton = document.getElementById('fleeButton');
            attackButton.style.display = show ? 'inline-block' : 'none';
            fleeButton.style.display = show ? 'inline-block' : 'none';
        }

        function createTreasureChestAt(pos, goldAmount, items) {
            if (!pos) {
                return;
            }

            var chest = getTreasureAt(pos);
            if (!chest) {
                chest = { pos: { x: pos.x, y: pos.y }, gold: 0, items: [] };
                treasureCells.push(chest);
            }

            chest.gold += Math.max(0, typeof goldAmount === 'number' ? goldAmount : 0);
            if (!Array.isArray(chest.items)) {
                chest.items = [];
            }

            var lootItems = Array.isArray(items) ? items : [];
            for (var i = 0; i < lootItems.length; i++) {
                var item = lootItems[i];
                if (item) {
                    chest.items.push({ name: item.name, price: item.price, slot: item.slot, properties: item.properties });
                }
            }
        }

        function resolveMapSpellEnemyDefeat(enemy, enemyPos, spellName) {
            if (!enemy || !enemy.alive) {
                return;
            }

            var xpReward = Math.max(1, typeof enemy.level === 'number' ? enemy.level : 1);
            var goldReward = Math.max(0, typeof enemy.dropsGold === 'number' ? enemy.dropsGold : 0);
            var droppedItems = [];
            if (enemy.equippedWeapon) {
                droppedItems.push(enemy.equippedWeapon);
            }
            if (enemy.equippedArmor) {
                droppedItems.push(enemy.equippedArmor);
            }

            gainHeroExperience(xpReward);
            enemiesKilled += 1;
            enemy.alive = false;

            if (goldReward > 0 || droppedItems.length > 0) {
                createTreasureChestAt(enemyPos, goldReward, droppedItems);
                addEvent(getEnemyDisplayName(enemy) + ' is slain by ' + spellName + ' and leaves a treasure chest.');
            } else {
                addEvent(getEnemyDisplayName(enemy) + ' is slain by ' + spellName + '.');
            }
        }

        function defeatCurrentEnemy() {
            if (!currentEnemy) {
                return;
            }

            addEvent(getEnemyDisplayName(currentEnemy) + ' is defeated!');

            var xpReward = Math.max(1, typeof currentEnemy.level === 'number' ? currentEnemy.level : 1);
            gainHeroExperience(xpReward);

            var reward = typeof currentEnemy.dropsGold === 'number' ? currentEnemy.dropsGold : 0;

            if (reward > 0) {
                gold += reward;
                goldAcquired += reward;
                addEvent('Hero gains ' + reward + ' coins for defeating ' + getEnemyDisplayName(currentEnemy) + ' (gold ' + (gold - reward) + ' -> ' + gold + ')');
            } else {
                addEvent(getEnemyDisplayName(currentEnemy) + ' drops no coins.');
            }

            var droppedItems = [];
            if (currentEnemy.equippedWeapon) {
                droppedItems.push(currentEnemy.equippedWeapon);
            }
            if (currentEnemy.equippedArmor) {
                droppedItems.push(currentEnemy.equippedArmor);
            }

            for (var d = 0; d < droppedItems.length; d++) {
                var lootItem = droppedItems[d];
                inventory.push({ name: lootItem.name, price: lootItem.price, slot: lootItem.slot, properties: lootItem.properties });
                if (lootItem.name === 'Horse') {
                    horseCount += 1;
                    updateHorseState();
                }
                addEvent('Hero loots ' + lootItem.name + ' from ' + getEnemyDisplayName(currentEnemy) + ' and adds it to the inventory');
            }

            enemiesKilled += 1;
            currentEnemy.alive = false;
            battleActive = false;
            currentEnemy = null;
            enemyCurrentHealth = 0;
            showBattleActions(false);
            showInventory();
            renderBattle();
        }

        function enterShop() {
            if (gameOver) {
                return;
            }
            if (isWithinOneCell(heroPos, shopPos)) {
                if (getAliveEnemyCount() === 0) {
                    pendingShopSurvivalAdvance = true;
                    pendingShopEnemyCount = survivalEnemyCount;
                    addEvent('The road is clear. The shop feels like a brief calm before the next wave.');
                }

        function enterMonastery() {
            if (gameOver || battleActive) {

            if (isWithinOneCell(heroPos, monasteryPos)) {
                addEvent('Hero enters the monastery.');

            }
        }

        function learnSpell(spellName) {
            if (gameOver || activeVendor !== 'monastery') {
                return;
            }

            var spell = getSpellByName(spellName);
            if (!spell) {
                addEvent('That spell is not available.');
                showShop();
                return;
            }

            if (isSpellLearned(spell.name)) {
                addEvent('Hero already knows ' + spell.name + '.');
                showShop();
                return;
            }

            var learnPrice = typeof spell.learningPrice === 'number' ? spell.learningPrice : 0;
            if (gold < learnPrice) {
                addEvent('Hero needs ' + learnPrice + ' gold to learn ' + spell.name + '.');
                showShop();
                return;
            }

            gold -= learnPrice;
            setSpellLearned(spell.name);
            addEvent('Hero learns ' + spell.name + ' for ' + learnPrice + ' gold.');
            showShop();
            showInventory();
        }

        function learnFireballSpell() {
            learnSpell('Fireball');
        }

        function learnBlizzardSpell() {
            learnSpell('Blizzard');
        }

        function openTreasure() {
            if (gameOver) {
                return;
            }
            var nearbyTreasure = getNearbyTreasure(heroPos);
            if (nearbyTreasure) {
                visitTreasure(nearbyTreasure.pos);
            }
        }

        function heroAttack() {
            if (gameOver) {
                return;
            }

            if (!battleActive) {
                var nearbyEnemy = inCave ? getNearbyCaveEnemy(caveHeroPos) : getNearbyEnemy(heroPos);
                if (nearbyEnemy) {
                    startClash(nearbyEnemy);
                }
                return;
            }

            if (!currentEnemy) {
                return;
            }

            var heroAttackPower = getHeroDamage();
            var enemyArmor = getEnemyArmor(currentEnemy);
            var heroDamage = Math.max(0, heroAttackPower - enemyArmor);
            var oldEnemyHealth = enemyCurrentHealth;
            enemyCurrentHealth = Math.max(0, enemyCurrentHealth - heroDamage);
            addEvent('Hero attacks for ' + heroDamage + ' damage (' + getEnemyDisplayName(currentEnemy) + ' armor ' + enemyArmor + ' reduces ' + heroAttackPower + ' to ' + heroDamage + ', HP ' + oldEnemyHealth + ' -> ' + enemyCurrentHealth + ')');

            if (enemyCurrentHealth <= 0) {
                defeatCurrentEnemy();
                return;
            }

            var enemyAttackPower = getEnemyDamage(currentEnemy);
            var heroArmor = getHeroArmor();
            var enemyDamage = Math.max(0, enemyAttackPower - heroArmor);
            var oldHeroHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.max(0, heroStats.currentHealth - enemyDamage);
            if (enemyDamage === 0) {
                addEvent(getEnemyDisplayName(currentEnemy) + ' attacks but ' + heroStats.name + "'s armor deflects all damage (HP " + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');
            } else {
                addEvent(getEnemyDisplayName(currentEnemy) + ' attacks for ' + enemyDamage + ' damage (' + heroStats.name + ' armor ' + heroArmor + ' reduces ' + enemyAttackPower + ' to ' + enemyDamage + ', HP ' + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');
            }

            if (heroStats.currentHealth <= 0) {
                handleHeroDeath(currentEnemy);
                return;
            }

            renderBattle();
        }

        function castFireball() {
            if (gameOver) {
                return;
            }

            if (!battleActive) {
                return;
            }

            if (!currentEnemy) {
                return;
            }

            if (!hasFireballSpell) {
                addEvent('Hero has not learned Fireball yet.');
                renderBattle();
                return;
            }

            var fireballCastPrice = getSpellCastPrice('Fireball', 3);
            if (heroManaCurrent < fireballCastPrice) {
                addEvent('Hero does not have enough mana to cast Fireball.');
                renderBattle();
                return;
            }

            heroManaCurrent = Math.max(0, heroManaCurrent - fireballCastPrice);

            var heroAttackPower = getHeroDamage();
            var enemyArmor = getEnemyArmor(currentEnemy);
            var fireballSpell = getSpellByName('Fireball');
            var fireballBonusDamage = fireballSpell && typeof fireballSpell.damage === 'number' ? Math.max(0, fireballSpell.damage) : 0;
            var effectiveArmor = Math.max(0, enemyArmor - 3);
            var fireballDamage = Math.max(0, heroAttackPower + fireballBonusDamage - effectiveArmor);
            var oldEnemyHealth = enemyCurrentHealth;
            enemyCurrentHealth = Math.max(0, enemyCurrentHealth - fireballDamage);
            addEvent('Hero casts Fireball for ' + fireballDamage + ' damage (spell damage +' + fireballBonusDamage + ', ignores 3 armor, ' + getEnemyDisplayName(currentEnemy) + ' armor ' + enemyArmor + ' becomes ' + effectiveArmor + ', HP ' + oldEnemyHealth + ' -> ' + enemyCurrentHealth + ')');

            if (enemyCurrentHealth <= 0) {
                defeatCurrentEnemy();
                return;
            }

            var enemyAttackPower = getEnemyDamage(currentEnemy);
            var heroArmor = getHeroArmor();
            var enemyDamage = Math.max(0, enemyAttackPower - heroArmor);
            var oldHeroHealth = heroStats.currentHealth;
            heroStats.currentHealth = Math.max(0, heroStats.currentHealth - enemyDamage);
            if (enemyDamage === 0) {
                addEvent(getEnemyDisplayName(currentEnemy) + ' attacks but ' + heroStats.name + "'s armor deflects all damage (HP " + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');
            } else {
                addEvent(getEnemyDisplayName(currentEnemy) + ' attacks for ' + enemyDamage + ' damage (' + heroStats.name + ' armor ' + heroArmor + ' reduces ' + enemyAttackPower + ' to ' + enemyDamage + ', HP ' + oldHeroHealth + ' -> ' + heroStats.currentHealth + ')');
            }

            if (heroStats.currentHealth <= 0) {
                handleHeroDeath(currentEnemy);
                return;
            }

            renderBattle();
        }

        function castBlizzard() {
            if (gameOver) {
                return;
            }

            if (battleActive) {
                return;
            }

            if (inCave) {
                addEvent('Blizzard can only target the surface map.');
                renderBattle();
                return;
            }

            if (!hasBlizzardSpell) {
                addEvent('Hero has not learned Blizzard yet.');
                renderBattle();
                return;
            }

            var blizzardSpell = getSpellByName('Blizzard');
            if (blizzardSpell && blizzardSpell.canBeUsedOnMap === false) {
                addEvent('Blizzard cannot be cast on the map.');
                renderBattle();
                return;
            }

            var blizzardCastPrice = getSpellCastPrice('Blizzard', 9);
            if (heroManaCurrent < blizzardCastPrice) {
                addEvent('Hero does not have enough mana to cast Blizzard.');
                renderBattle();
                return;
            }

            blizzardTargetingActive = true;
            blizzardPreviewCenter = { x: heroPos.x, y: heroPos.y };
            addEvent('Blizzard targeting active. Double-click any tile to destroy that tile and all adjacent tiles.');
            renderBattle();
        }

        function castBlizzardAt(targetX, targetY) {
            if (!blizzardTargetingActive) {
                return;
            }

            var blizzardCastPrice = getSpellCastPrice('Blizzard', 9);
            if (heroManaCurrent < blizzardCastPrice) {
                blizzardTargetingActive = false;
                blizzardPreviewCenter = null;
                addEvent('Hero does not have enough mana to cast Blizzard.');
                renderBattle();
                return;
            }

            blizzardTargetingActive = false;
            blizzardPreviewCenter = null;
            heroManaCurrent = Math.max(0, heroManaCurrent - blizzardCastPrice);

            var removedTrees = 0;
            var removedWoodBlocks = 0;
            var removedStoneBlocks = 0;
            var removedTreasures = 0;
            var defeatedEnemies = 0;
            var currentEnemyDefeated = false;

            for (var dx = -1; dx <= 1; dx++) {
                for (var dy = -1; dy <= 1; dy++) {
                    var x = targetX + dx;
                    var y = targetY + dy;

                    if (x < 0 || x >= mapSize || y < 0 || y >= mapSize) {
                        continue;
                    }

                    if (heroPos.x === x && heroPos.y === y) {
                        continue;
                    }

                    var beforeTrees = treeCells.length;
                    treeCells = treeCells.filter(function(tree) {
                        return !(tree.x === x && tree.y === y);
                    });
                    removedTrees += beforeTrees - treeCells.length;

                    var beforeWoodBlocks = woodBlockCells.length;
                    woodBlockCells = woodBlockCells.filter(function(block) {
                        return !(block.x === x && block.y === y);
                    });
                    removedWoodBlocks += beforeWoodBlocks - woodBlockCells.length;

                    var beforeStoneBlocks = stoneBlockCells.length;
                    stoneBlockCells = stoneBlockCells.filter(function(block) {
                        return !(block.x === x && block.y === y);
                    });
                    removedStoneBlocks += beforeStoneBlocks - stoneBlockCells.length;

                    var beforeTreasures = treasureCells.length;
                    treasureCells = treasureCells.filter(function(treasure) {
                        return !(treasure && treasure.pos && treasure.pos.x === x && treasure.pos.y === y);
                    });
                    removedTreasures += beforeTreasures - treasureCells.length;

                    for (var i = 0; i < enemies.length; i++) {
                        var enemy = enemies[i];
                        if (!enemy || !enemy.alive || !enemy.pos) {
                            continue;
                        }
                        if (enemy.pos.x === x && enemy.pos.y === y) {
                            resolveMapSpellEnemyDefeat(enemy, { x: x, y: y }, 'Blizzard');
                            defeatedEnemies += 1;
                            if (currentEnemy === enemy) {
                                currentEnemyDefeated = true;
                            }
                        }
                    }
                }
            }

            if (currentEnemyDefeated) {
                battleActive = false;
                currentEnemy = null;
                enemyCurrentHealth = 0;
                showBattleActions(false);
            }

            addEvent('Hero casts Blizzard and spends ' + blizzardCastPrice + ' mana.');
            addEvent('Blizzard destroys ' + removedTrees + ' trees, ' + removedWoodBlocks + ' wood blocks, ' + removedStoneBlocks + ' stone blocks, and ' + removedTreasures + ' treasures.');
            if (defeatedEnemies > 0) {
                addEvent('Blizzard defeats ' + defeatedEnemies + ' enemies in the blast radius.');
            }

            renderBattle();
            if (!battleActive && !inCave && !gameOver) {
                scheduleEnemyMoveAfterHeroTurn();
            }
        }

        function heroFlee() {
            if (gameOver || !battleActive) {
                return;
            }

            blizzardTargetingActive = false;
            blizzardPreviewCenter = null;
            addEvent('Hero flees from ' + getEnemyDisplayName(currentEnemy) + '!');
            battleActive = false;
            currentEnemy = null;
            enemyCurrentHealth = 0;
            showBattleActions(false);
            renderBattle();
        }

        function moveHeroTo(x, y) {
            if (gameOver || battleActive || enemyTurnPending || blizzardTargetingActive) {
                return;
            }

            if (inCave) {
                if (isCaveRockCell({ x: x, y: y })) {
                    addEvent('Hero cannot move into a rock.');
                    renderBattle();
                    return;
                }
                caveHeroPos = { x: x, y: y };
                var caveEnemyOnTile = getCaveEnemyAt(caveHeroPos);
                if (caveEnemyOnTile) {
                    startClash(caveEnemyOnTile);
                    return;
                }
                renderBattle();
                if (!battleActive && inCave && !gameOver) {
                    scheduleEnemyMoveAfterHeroTurn();
                }
                return;
            }

            if (isTreeCell({ x: x, y: y })) {
                if (hasEquippedAxe()) {
                    treeCells = treeCells.filter(function(tree) {
                        return !(tree.x === x && tree.y === y);
                    });
                    addEvent('Turn ' + (turnNumber + 1) + '. Hero chops down a tree with the axe.');
                    spawnLogOnLeftSide();
                    renderBattle();
                    return;
                }
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into a tree.');
                renderBattle();
                return;
            }

            if (isWoodBlockCell({ x: x, y: y })) {
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into a wooden block.');
                renderBattle();
                return;
            }

            if (isStoneBlockCell({ x: x, y: y })) {
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into a stone block.');
                renderBattle();
                return;
            }

            if (isCaveCell({ x: x, y: y })) {
                addEvent('Turn ' + (turnNumber + 1) + '. Hero cannot move into the cave.');
                renderBattle();
                return;
            }

            var oldPos = { x: heroPos.x, y: heroPos.y };
            heroPos = { x: x, y: y };
            turnNumber = turnNumber + 1;
            addEvent('Turn ' + turnNumber + '. Hero moved ' + getDirectionName(oldPos, heroPos));

            var enemyOnTile = getEnemyAt(heroPos);
            if (enemyOnTile) {
                currentEnemy = enemyOnTile;
                enemyCurrentHealth = enemyOnTile.healthPoints;
                battleActive = true;
                addEvent('Turn ' + turnNumber + '. Clash has begun against ' + getEnemyDisplayName(enemyOnTile));
            } else if (isSameCell(heroPos, shopPos)) {
                addEvent('Turn ' + turnNumber + '. Hero reached the shop. Use Enter Shop to browse gear.');
            } else if (isSameCell(heroPos, monasteryPos)) {
                addEvent('Turn ' + turnNumber + '. Hero reached the monastery.');
            } else if (isDruidHouseCell(heroPos)) {
                addEvent('Turn ' + turnNumber + '. Hero reached the druid house. Use Enter Druid House to browse consumables.');
            } else {
                var treasure = getTreasureAt(heroPos);
                if (treasure) {
                    addEvent('Turn ' + turnNumber + '. Hero discovers treasure. Open it to claim the gold.');
                    renderBattle();
                    return;
                }
            }

            renderBattle();
            if (!battleActive && !inCave && !gameOver) {
                scheduleEnemyMoveAfterHeroTurn();
            }
        }

        function startClash(enemy) {
            if (gameOver) {
                return;
            }

            var enemyToBattle = enemy || (inCave ? getCaveEnemyAt(caveHeroPos) || getNearbyCaveEnemy(caveHeroPos) : getEnemyAt(heroPos) || getNearbyEnemy(heroPos));
            if (!enemyToBattle) {
                return;
            }

            if (enemyMoveTimeoutId) {
                clearTimeout(enemyMoveTimeoutId);
                enemyMoveTimeoutId = null;
            }
            enemyTurnPending = false;

            currentEnemy = enemyToBattle;
            enemyCurrentHealth = enemyToBattle.healthPoints;

            renderBattle();

        function returnToAdventure() {
            var mainView = document.getElementById('mainView');
            var shopBox = mainView.querySelector('.container .box:first-child');
            var inventoryBox = mainView.querySelector('.container .box:last-child');

            if (shopBox) {
                shopBox.style.display = 'block';
            }
            if (inventoryBox) {
                inventoryBox.style.display = 'block';
            }

            if (pendingShopSurvivalAdvance && getAliveEnemyCount() === 0) {
                var overnightHeal = Math.max(1, Math.round(heroStats.healthPoints * 0.1));
                var oldHealth = heroStats.currentHealth;
                heroStats.currentHealth = Math.min(heroStats.healthPoints, heroStats.currentHealth + overnightHeal);
                var overnightMana = Math.max(1, Math.round(heroManaMax * 0.1));
                var oldMana = heroManaCurrent;
                heroManaCurrent = Math.min(heroManaMax, heroManaCurrent + overnightMana);
                addEvent('Hero stayed overnight in the shop and recovered ' + (heroStats.currentHealth - oldHealth) + ' HP and ' + (heroManaCurrent - oldMana) + ' mana.');
                advanceSurvivalWave();
            }
            pendingShopSurvivalAdvance = false;
            pendingShopEnemyCount = 0;

            mainView.style.display = 'none';
            document.getElementById('battleScreen').style.display = 'block';
            document.getElementById('deathScreen').style.display = 'none';
            document.getElementById('backToAdventureButton').style.display = 'none';
            isShopOpen = false;
            activeVendor = 'shop';
            blizzardTargetingActive = false;
            blizzardPreviewCenter = null;
            renderBattle();
        }

        function startAdventureMode() {
            document.getElementById('pageTitle').style.display = 'none';
            document.getElementById('adventureButton').style.display = 'none';
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'block';
            document.getElementById('deathScreen').style.display = 'none';
            isShopOpen = false;

            heroStats.currentHealth = heroStats.healthPoints;
            heroManaCurrent = heroStartingMana;
            hasFireballSpell = false;
            hasBlizzardSpell = false;
            blizzardTargetingActive = false;
            blizzardPreviewCenter = null;
            heroPos = getRandomCell();
            caveCells = getDailyCaveCells();
            inCave = false;
            caveHeroPos = { x: Math.floor(caveSize / 2), y: caveSize - 1 };
            caveExitPos = null;
            caveExitDiscovered = false;
            caveGeneratedDay = 0;
            caveEnemies = [];
            hornUsedThisGame = false;
            hornSummonInProgress = false;
            riderMarkers = [];
            caveRiderMarkers = [];
            while (isCaveCell(heroPos)) {
                heroPos = getRandomCell();
            }
            enemies = [];
            enemiesKilled = 0;
            goldAcquired = 0;
            currentDay = 1;
            druidHealDay = 0;
            survivalEnemyCount = startingSurvivalEnemyCount;
            pendingShopSurvivalAdvance = false;
            pendingShopEnemyCount = 0;
            activeVendor = 'shop';
            updateAdventureTitle();
            var blockedCells = [heroPos, monasteryPos].concat(caveCells);

            spawnEnemyWave(survivalEnemyCount);
            for (var i = 0; i < enemies.length; i++) {
                if (enemies[i] && enemies[i].alive) {
                    blockedCells.push(enemies[i].pos);
                }
            }

            var shopCell = getRandomCell();
            var shopBlocked = false;

            while (!shopBlocked) {
                shopBlocked = true;
                for (var c = 0; c < blockedCells.length; c++) {
                    if (blockedCells[c].x === shopCell.x && blockedCells[c].y === shopCell.y) {
                        shopCell = getRandomCell();
                        shopBlocked = false;
                        break;
                    }
                }
            }

            shopPos = shopCell;
            druidHouseCells = [];
            treasureCells = [];
            treeCells = [];
            logCells = [];
            woodBlockCells = [];
            stoneBlockCells = [];
            var houseCell = getRandomCell();
            var houseAdjacent = { x: houseCell.x + 1, y: houseCell.y };
            if (houseAdjacent.x > mapSize - 1 || blockedCells.some(function(c) { return c.x === houseAdjacent.x && c.y === houseAdjacent.y; })) {
                houseAdjacent = { x: houseCell.x, y: houseCell.y + 1 };
            }
            if (houseAdjacent.x <= mapSize - 1 && houseAdjacent.y <= mapSize - 1 && !blockedCells.some(function(c) { return c.x === houseAdjacent.x && c.y === houseAdjacent.y; })) {
                druidHouseCells = [houseCell, houseAdjacent];
            } else {
                // fallback to a second random adjacent cell
                for (var x = -1; x <= 1 && druidHouseCells.length === 0; x++) {
                    for (var y = -1; y <= 1 && druidHouseCells.length === 0; y++) {
                        if (Math.abs(x) + Math.abs(y) === 1) {
                            var candidate = { x: houseCell.x + x, y: houseCell.y + y };
                            if (candidate.x >= 0 && candidate.x < mapSize && candidate.y >= 0 && candidate.y < mapSize && !blockedCells.some(function(c) { return c.x === candidate.x && c.y === candidate.y; })) {
                                druidHouseCells = [houseCell, candidate];
                            }
                        }
                    }
                }
            }

            blockedCells.push(houseCell);
            if (druidHouseCells.length > 1) {
                blockedCells.push(druidHouseCells[1]);
            }

            for (var t = 0; t < 2; t++) {
                var treasurePos = getRandomCell();
                var treasureBlocked = false;
                while (!treasureBlocked) {
                    treasureBlocked = true;
                    for (var c = 0; c < blockedCells.length; c++) {
                        if (blockedCells[c].x === treasurePos.x && blockedCells[c].y === treasurePos.y) {
                            treasurePos = getRandomCell();
                            treasureBlocked = false;
                            break;
                        }
                    }
                }
                treasureCells.push({ pos: treasurePos, gold: 10 + Math.floor(Math.random() * 11) });
                blockedCells.push(treasurePos);
            }

            addRandomTrees(initialTreeCount, blockedCells);

            currentEnemy = null;
            enemyCurrentHealth = 0;
            gameOver = false;
            turnNumber = 0;
            eventLog = [];
            addEvent('Adventure started');
            battleActive = false;
            renderBattle();
        }

        function fetchJsonDynamic(path) {
            var requestPath = path;
            var fetchOptions = {};

            if (isFreshDataMode) {
                requestPath = path + '?t=' + Date.now();
                fetchOptions.cache = 'no-store';
            }

            return fetch(requestPath, fetchOptions).then(function(response) {
                if (!response.ok) {
                    throw new Error(path + ' failed to load (HTTP ' + response.status + ').');
                }
                return response.json();
            });
        }

        function loadItems() {
            isGameDataLoaded = false;
            isFreshDataMode = new URLSearchParams(window.location.search).get('fresh') === '1';
            currentGameMode = getModeFromUrl();
            Promise.all([
                fetchJsonDynamic('items.json'),
                fetchJsonDynamic('enemies.json'),
                fetchJsonDynamic('hero.json'),
                fetchJsonDynamic('spells.json'),
                fetchJsonDynamic('tips.json').catch(function() {
                    return [];
                })
            ])
                .then(function(results) {
                    var loadedItems = results[0] || [];
                    var allEnemies = results[1] || [];
                    var heroConfig = results[2] || {};
                    var loadedSpells = results[3] || [];
                    var loadedTips = results[4] || [];

                    if (!Array.isArray(loadedItems) || loadedItems.length === 0) {
                        throw new Error('items.json is empty or invalid.');
                    }
                    if (!Array.isArray(allEnemies) || allEnemies.length === 0) {
                        throw new Error('enemies.json is empty or invalid.');
                    }
                    if (!heroConfig || typeof heroConfig !== 'object') {
                        throw new Error('hero.json is invalid.');
                    }
                    if (!Array.isArray(loadedSpells) || loadedSpells.length === 0) {
                        throw new Error('spells.json is empty or invalid.');
                    }
                    for (var spellCheckIndex = 0; spellCheckIndex < loadedSpells.length; spellCheckIndex++) {
                        var checkedSpell = loadedSpells[spellCheckIndex];
                        if (!checkedSpell || typeof checkedSpell.name !== 'string' || checkedSpell.name.length === 0) {
                            throw new Error('spells.json has an entry with missing name.');
                        }
                        if (typeof checkedSpell.learningPrice !== 'number' || checkedSpell.learningPrice < 0) {
                            throw new Error('spells.json has invalid learningPrice for ' + checkedSpell.name + '.');
                        }
                        if (typeof checkedSpell.castPrice !== 'number' || checkedSpell.castPrice < 0) {
                            throw new Error('spells.json has invalid castPrice for ' + checkedSpell.name + '.');
                        }
                        if (typeof checkedSpell.source !== 'string' || checkedSpell.source.length === 0) {
                            throw new Error('spells.json has invalid source for ' + checkedSpell.name + '.');
                        }
                        if (typeof checkedSpell.damage !== 'number' || checkedSpell.damage < 0) {
                            throw new Error('spells.json has invalid damage for ' + checkedSpell.name + '.');
                        }
                        if (typeof checkedSpell.canBeUsedOnMap !== 'boolean') {
                            throw new Error('spells.json has invalid canBeUsedOnMap for ' + checkedSpell.name + '.');
                        }
                    }
                    if (typeof heroConfig.name !== 'string' || heroConfig.name.length === 0) {
                        throw new Error('hero.json is missing a valid name.');
                    }
                    if (typeof heroConfig.healthPoints !== 'number' || heroConfig.healthPoints <= 0) {
                        throw new Error('hero.json is missing a valid healthPoints value.');
                    }
                    if (typeof heroConfig.baseDamage !== 'number' || heroConfig.baseDamage < 0) {
                        throw new Error('hero.json is missing a valid baseDamage value.');
                    }
                    if (typeof heroConfig.baseArmor !== 'number' || heroConfig.baseArmor < 0) {
                        throw new Error('hero.json is missing a valid baseArmor value.');
                    }
                    if (typeof heroConfig.startingGold !== 'number' || heroConfig.startingGold < 0) {
                        throw new Error('hero.json is missing a valid startingGold value.');
                    }
                    if (typeof heroConfig.startingSurvivalEnemyCount !== 'number' || heroConfig.startingSurvivalEnemyCount < 1) {
                        throw new Error('hero.json is missing a valid startingSurvivalEnemyCount value.');
                    }

                    allItems = loadedItems;
                    spellsCatalog = loadedSpells;
                    if (Array.isArray(loadedTips) && loadedTips.length > 0) {
                        var normalizedTips = loadedTips.filter(function(tip) {
                            return typeof tip === 'string' && tip.trim().length > 0;
                        }).map(function(tip) {
                            return tip.trim();
                        });
                        if (normalizedTips.length > 0) {
                            tipsMessages = normalizedTips;
                        }
                    }
                    startingGold = heroConfig.startingGold;
                    startingSurvivalEnemyCount = Math.floor(heroConfig.startingSurvivalEnemyCount);
                    survivalEnemyCount = startingSurvivalEnemyCount;

                    shopItems = getRandomShopItems(allItems, 10);
                    druidItems = getDruidStockItems(allItems);
                    shopItemTargetCount = 10;

                    enemyTemplates = allEnemies;
                    heroStats.name = heroConfig.name;
                    heroBaseStats.healthPoints = heroConfig.healthPoints;
                    heroBaseStats.baseDamage = heroConfig.baseDamage;
                    heroBaseStats.baseArmor = heroConfig.baseArmor;
                    heroScaling.baseLevel = typeof heroConfig.baseLevel === 'number' ? Math.max(1, Math.floor(heroConfig.baseLevel)) : 1;
                    heroScaling.healthIncreasePerLevel = typeof heroConfig.healthIncreasePerLevel === 'number' && heroConfig.healthIncreasePerLevel > 0 ? heroConfig.healthIncreasePerLevel : 1;
                    heroScaling.damageIncreasePerLevel = typeof heroConfig.damageIncreasePerLevel === 'number' && heroConfig.damageIncreasePerLevel > 0 ? heroConfig.damageIncreasePerLevel : 1;
                    heroScaling.armorIncreasePerLevel = typeof heroConfig.armorIncreasePerLevel === 'number' && heroConfig.armorIncreasePerLevel > 0 ? heroConfig.armorIncreasePerLevel : 1;
                    heroManaMax = typeof heroConfig.manaPoints === 'number' && heroConfig.manaPoints > 0 ? Math.floor(heroConfig.manaPoints) : 30;
                    heroStartingMana = typeof heroConfig.startingMana === 'number' && heroConfig.startingMana >= 0 ? Math.floor(heroConfig.startingMana) : 20;
                    heroStartingMana = Math.min(heroManaMax, heroStartingMana);
                    heroManaCurrent = heroStartingMana;
                    resetHeroProgress();

                    gold = startingGold;
                    isGameDataLoaded = true;

                    var welcomeMessage = document.getElementById('welcomeMessage');
                    var welcomeTip = document.getElementById('welcomeTip');
                    setStartButtonsDisabled(false);
                    if (welcomeMessage) {
                        welcomeMessage.textContent = welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
                    }
                    if (welcomeTip) {
                        welcomeTip.textContent = 'Tip: ' + getRandomTipMessage();
                    }

                    showShop();
                    showInventory();
                })
                .catch(function(error) {
                    isGameDataLoaded = false;
                    allItems = [];
                    enemyTemplates = [];
                    shopItems = [];
                    spellsCatalog = [];

                    var welcomeMessage = document.getElementById('welcomeMessage');
                    var welcomeTip = document.getElementById('welcomeTip');
                    var warningMessage = document.getElementById('warningMessage');

                    setStartButtonsDisabled(true);
                    if (welcomeMessage) {
                        welcomeMessage.textContent = 'Could not load game data. Check items.json, enemies.json, hero.json and spells.json.';
                    }
                    if (welcomeTip) {
                        welcomeTip.textContent = '';
                    }
                    if (warningMessage) {
                        warningMessage.textContent = 'Data load error: ' + (error && error.message ? error.message : 'Unknown error');
                    }
                });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function() {
                    // Service worker registration failure should not block gameplay.
                });
            });
        }

        loadItems();
        showStartScreen();

        function handleAdventureKeyboardNavigation(event) {
            if (gameOver || battleActive || enemyTurnPending) {
                return;
            }

            var mainView = document.getElementById('mainView');
            var battleScreen = document.getElementById('battleScreen');
            if (!battleScreen || battleScreen.style.display === 'none') {
                return;
            }
            if (mainView && mainView.style.display !== 'none') {
                return;
            }

            var targetTag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
            if (targetTag === 'input' || targetTag === 'textarea' || targetTag === 'select') {
                return;
            }

            var key = (event.key || '').toLowerCase();
            var deltas = {
                w: { x: 0, y: -1 },
                x: { x: 0, y: 1 },
                a: { x: -1, y: 0 },
                d: { x: 1, y: 0 },
                q: { x: -1, y: -1 },
                e: { x: 1, y: -1 },
                z: { x: -1, y: 1 },
                c: { x: 1, y: 1 }
            };

            if (!deltas[key]) {
                return;
            }

            event.preventDefault();

            var currentPos = inCave ? caveHeroPos : heroPos;
            var maxX = inCave ? caveSize - 1 : mapSize - 1;
            var maxY = inCave ? caveSize - 1 : mapSize - 1;
            var nextX = currentPos.x + deltas[key].x;
            var nextY = currentPos.y + deltas[key].y;

            if (nextX < 0 || nextY < 0 || nextX > maxX || nextY > maxY) {
                return;
            }

            moveHeroTo(nextX, nextY);
        }

        document.addEventListener('keydown', handleAdventureKeyboardNavigation);
    </script>
</body>
</html>
